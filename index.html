<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mangit Metan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --border:#E3DED6; --fg:#241F1A; --muted:#7A7168;
  --accent:#B5651D; --accent-fg:#FFFFFF; --good:#2E7D4F; --bad:#B3261E; --warn:#B8860B;
  --blue:#2B5F8A; --purple:#6B4E9E;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181512; --surface:#221E19; --border:#3A342C; --fg:#F1ECE4; --muted:#A79E92;
    --accent:#E08A3C; --accent-fg:#181512; --good:#5FBE84; --bad:#F2938A; --warn:#E0B84C;
    --blue:#7FB0DD; --purple:#B69AE6;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:16px;padding-block:20px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 4px}
h1{font-size:1.4rem}
h2{font-size:1.05rem}
h3{font-size:.92rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.who{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:5}
.tab-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:.85rem;font-weight:600;cursor:pointer}
.tab-btn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card.group-income{border-left:4px solid var(--good)}
.card.group-expense{border-left:4px solid var(--bad)}
.card.group-tax{border-left:4px solid var(--purple)}
.card.group-company{border-left:4px solid var(--blue)}
.card.group-settings{border-left:4px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label{font-size:.78rem;color:var(--muted);font-weight:600}
input,select,textarea{font-family:var(--font-body);font-size:.95rem;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:60px;resize:vertical}
.btn{padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.9rem;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.list-item:last-child{border-bottom:none}
.list-item .del{margin-left:auto;background:none;border:none;color:var(--bad);cursor:pointer;font-size:1rem;padding:2px 8px}
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tile .value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:700;margin-top:4px}
.tile .value.good{color:var(--good)} .tile .value.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.bad{background:color-mix(in srgb, var(--bad) 18%, transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good)}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.show{opacity:1}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.login-card{max-width:360px;margin:60px auto;text-align:center}
.detail-box{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:10px;font-size:.85rem}
.detail-box div{padding:3px 0}
.confirm-wrap{background:var(--bg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:8px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty" id="globalLoading">Yuklanmoqda…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// CONFIG — these two values are safe to be public (anon/publishable
// key only allows what the RLS policies in schema.sql permit).
// ============================================================
const SUPABASE_URL = 'https://kypgclfrdynegezqitsw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Lq6eHYDL3H_WruWBjN--Lg_PlYQoMYl';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// One-time historical starting point (last known pump readings from the
// old Excel system, 2026-09-26). Used ONLY until the first real entry
// exists in the new system - after that, the baseline is always derived
// from the most recent entry, never hardcoded again.
const SEED_PUMP_START = [971377.59, 788394.55, 1684533.06, 1557224.34, 1180665.26, 1444438.03];
const PUMP_NAMES = ['K1','K2','K3','K4','K5','K6'];

let state = {
  session: null, profile: null,
  companies: [], prices: [], taxRates: [], fixedCosts: [], prepayments: [], otherExpenses: [],
  entries: [], deliveries: [], payments: []
};
let pending = { deliveries: [], payments: [] };
let activeTab = null;

const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const pct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';
const todayISO = () => new Date().toISOString().slice(0,10);
const monthISO = (d) => d.slice(0,7)+'-01';
const toast = (msg) => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); };
const esc = s => (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// AUTH
// ============================================================
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(session); } else { renderLogin(); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ state = {session:null, profile:null, companies:[],prices:[],taxRates:[],fixedCosts:[],prepayments:[],otherExpenses:[],entries:[],deliveries:[],payments:[]}; renderLogin(); }
  });
}

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="card login-card">
      <h1>Mangit Metan</h1>
      <p class="sub">Kunlik hisobot va boshqaruv tizimi</p>
      <div class="field" style="text-align:left"><label>Email</label><input type="email" id="loginEmail"></div>
      <div class="field" style="text-align:left"><label>Parol</label><input type="password" id="loginPass"></div>
      <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Kirish</button>
      <p class="hint" id="loginErr" style="color:var(--bad)"></p>
    </div>`;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Tekshirilmoqda…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Kirish';
  if(error){ document.getElementById('loginErr').textContent = 'Email yoki parol xato'; return; }
  await afterLogin(data.session);
}

async function doLogout(){
  await sb.auth.signOut();
}

async function afterLogin(session){
  state.session = session;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !profile){
    document.getElementById('app').innerHTML = `<div class="card login-card"><p>Hisobingiz hali rolga bog'lanmagan. CEO bilan bog'laning.</p><button class="btn secondary" onclick="doLogout()">Chiqish</button></div>`;
    return;
  }
  state.profile = profile;
  await loadAll();
  renderShell();
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadAll(){
  const [companies, prices, taxRates, fixedCosts, prepayments, otherExpenses, entries, deliveries, payments] = await Promise.all([
    sb.from('companies').select('*').order('name'),
    sb.from('prices').select('*').order('effective_date'),
    sb.from('tax_rates').select('*').order('effective_date'),
    sb.from('fixed_costs').select('*').order('effective_date'),
    sb.from('prepayments').select('*').order('month', {ascending:false}),
    sb.from('other_expenses').select('*').order('date', {ascending:false}),
    sb.from('entries').select('*').order('date', {ascending:false}).limit(400),
    sb.from('deliveries').select('*, entries(price,date)'),
    sb.from('payments').select('*, entries(date)'),
  ]);
  state.companies = companies.data || [];
  state.prices = prices.data || [];
  state.taxRates = taxRates.data || [];
  state.fixedCosts = fixedCosts.data || [];
  state.prepayments = prepayments.data || [];
  state.otherExpenses = otherExpenses.data || [];
  state.entries = entries.data || [];
  state.deliveries = deliveries.data || [];
  state.payments = payments.data || [];
}

function priceFor(dateStr){
  let best = state.prices[0] || {sale_price:5500, cost_price:2750, excise:780};
  for(const p of state.prices){ if(p.effective_date <= dateStr) best = p; }
  return best;
}
function taxFor(dateStr){
  let best = state.taxRates[0] || {nds_rate:0.12, social_tax_rate:0.01, profit_tax_rate:0.075};
  for(const t of state.taxRates){ if(t.effective_date <= dateStr) best = t; }
  return best;
}
function fixedCostFor(dateStr){
  let best = state.fixedCosts[0] || {salary:0, bank_loan_interest:0, land_property_tax:0, electricity_tariff:0};
  for(const f of state.fixedCosts){ if(f.effective_date <= dateStr) best = f; }
  return best;
}
function pumpBaseline(){
  if(state.entries.length){
    // entries loaded newest-first
    return state.entries[0].pump_end;
  }
  return SEED_PUMP_START;
}
function companyTotals(){
  const totals = {};
  state.companies.forEach(c=> totals[c.id] = { id:c.id, name:c.name, m3:c.seed_m3||0, sold:c.seed_sold||0, paid:c.seed_paid||0 });
  state.deliveries.forEach(d=>{
    const t = totals[d.company_id]; if(!t) return;
    const price = (d.entries && d.entries.price) || 0;
    t.m3 += Number(d.m3)||0;
    t.sold += (Number(d.m3)||0) * price;
  });
  state.payments.forEach(p=>{
    const t = totals[p.company_id]; if(!t) return;
    t.paid += Number(p.amount)||0;
  });
  return Object.values(totals);
}

// ============================================================
// SHELL / TABS
// ============================================================
function tabsForRole(role){
  if(role === 'operator') return [['entry','Kunlik hisobot']];
  if(role === 'direktor') return [['overview','Umumiy'],['reports','Hisobotlar'],['companies','Kompaniyalar'],['expenses','Xarajatlar']];
  return [['entry','Kunlik hisobot'],['overview','Umumiy'],['reports','Hisobotlar'],['companies','Kompaniyalar'],['expenses','Xarajatlar'],['settings','Sozlamalar']];
}

function renderShell(){
  const role = state.profile.role;
  const tabs = tabsForRole(role);
  if(!activeTab || !tabs.find(t=>t[0]===activeTab)) activeTab = tabs[0][0];
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div><h1 style="margin-bottom:0">Mangit Metan</h1><p class="who">${esc(state.profile.full_name)} — ${roleLabel(role)}</p></div>
      <button class="btn secondary small" onclick="doLogout()">Chiqish</button>
    </div>
    <div class="tabs" id="tabsRow"></div>
    <div id="tabBody"></div>`;
  document.getElementById('tabsRow').innerHTML = tabs.map(([id,label])=>
    `<button class="tab-btn ${id===activeTab?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('');
  renderTab();
}
function roleLabel(r){ return r==='ceo'?'CEO':(r==='direktor'?'Direktor':'Operator'); }
function switchTab(id){ activeTab = id; renderShell(); }

function renderTab(){
  const body = document.getElementById('tabBody');
  const role = state.profile.role;
  if(activeTab==='entry') body.innerHTML = tplEntry();
  else if(activeTab==='overview') body.innerHTML = tplOverview();
  else if(activeTab==='reports') body.innerHTML = tplReports();
  else if(activeTab==='companies') body.innerHTML = tplCompanies(role);
  else if(activeTab==='expenses') body.innerHTML = tplExpenses(role);
  else if(activeTab==='settings') body.innerHTML = tplSettings();
  afterRenderTab();
}
function afterRenderTab(){
  if(activeTab==='entry'){
    buildPumpFields(); buildCompanySelects(); renderPendingLists(); recalcPreview();
    document.getElementById('f_date').value = todayISO();
  }
  if(activeTab==='reports'){
    document.getElementById('rep_date').addEventListener('change', renderReportDetail);
  }
}

// ============================================================
// OPERATOR — daily entry
// ============================================================
function tplEntry(){
  return `
  <div class="card">
    <div class="section-title"><h2>Bugungi hisobot</h2></div>
    <div class="row">
      <div class="field"><label>Sana</label><input type="date" id="f_date"></div>
      <div class="field"><label>Operator ismi</label><input type="text" id="f_operator" placeholder="Jahongir / Sardor"></div>
    </div>
  </div>
  <div class="card">
    <h2>Pompalar — hozirgi ko'rsatkich (m3)</h2>
    <p class="hint">Oldingi ko'rsatkich qavs ichida — shundan katta raqam kiriting.</p>
    <div class="row" id="pumpFields"></div>
  </div>
  <div class="card">
    <h2>Hisoblagichdan o'tgan gaz — Агрес (m3)</h2>
    <div class="field"><input type="number" id="f_agres" step="1" placeholder="m3"></div>
  </div>
  <div class="card">
    <h2>To'lov turlari (so'm)</h2>
    <div class="row">
      <div class="field"><label>UZCARD</label><input type="number" id="f_uzcard" step="1" value="0"></div>
      <div class="field"><label>HUMO</label><input type="number" id="f_humo" step="1" value="0"></div>
      <div class="field"><label>QR to'lov</label><input type="number" id="f_qr" step="1" value="0"></div>
    </div>
    <div class="tile-row" style="margin-top:6px">
      <div class="tile"><div class="label">Sotilgan m3</div><div class="value" id="calcSoldM3">—</div></div>
      <div class="tile"><div class="label">Sotuv summasi</div><div class="value" id="calcSalesValue">—</div></div>
      <div class="tile"><div class="label">Naqt (avtomatik)</div><div class="value good" id="calcNaqt">—</div></div>
    </div>
    <p class="hint">Naqt = Sotuv summasi − UZCARD − HUMO − QR.</p>
  </div>
  <div class="card">
    <div class="section-title"><h2>Kompaniyalarga berilgan gaz</h2></div>
    <div id="deliveryList"></div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:2"><select id="delCompany"></select></div>
      <div class="field"><input type="number" id="delM3" placeholder="m3" step="0.01"></div>
      <div class="field" style="flex:0 0 auto"><button class="btn secondary small" onclick="addDelivery()">+ Qo'shish</button></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Kompaniyadan kelgan to'lov</h2></div>
    <div id="paymentList"></div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:2"><select id="payCompany"></select></div>
      <div class="field"><input type="number" id="payAmount" placeholder="so'm" step="1"></div>
      <div class="field" style="flex:0 0 auto"><button class="btn secondary small" onclick="addPayment()">+ Qo'shish</button></div>
    </div>
  </div>
  <div class="card"><h2>Izoh</h2><textarea id="f_izoh" placeholder="Ixtiyoriy izoh..."></textarea></div>
  <button class="btn" id="submitBtn" style="width:100%;padding:14px" onclick="submitEntry()">Yuborish</button>`;
}

function recalcPreview(){
  const baseline = pumpBaseline();
  const pumps = PUMP_NAMES.map((_,i)=>{
    const el = document.getElementById('pump_'+i);
    return el ? parseFloat(el.value) : NaN;
  });
  let soldM3 = 0, ok = true;
  pumps.forEach((v,i)=>{ if(isNaN(v)){ ok=false; return; } soldM3 += (v - baseline[i]); });
  const date = document.getElementById('f_date').value || todayISO();
  const price = priceFor(date);
  const salesValue = ok ? soldM3 * price.sale_price : NaN;
  const uzcard = parseFloat(document.getElementById('f_uzcard').value)||0;
  const humo = parseFloat(document.getElementById('f_humo').value)||0;
  const qr = parseFloat(document.getElementById('f_qr').value)||0;
  const naqt = ok ? (salesValue - uzcard - humo - qr) : NaN;
  document.getElementById('calcSoldM3').textContent = ok ? fmt(soldM3)+' m3' : '—';
  document.getElementById('calcSalesValue').textContent = ok ? fmt(salesValue)+" so'm" : '—';
  const naqtEl = document.getElementById('calcNaqt');
  naqtEl.textContent = ok ? fmt(naqt)+" so'm" : '—';
  naqtEl.className = 'value ' + (naqt < 0 ? 'bad' : 'good');
  return {soldM3, salesValue, naqt, uzcard, humo, qr, price, ok};
}
function buildPumpFields(){
  const wrap = document.getElementById('pumpFields');
  const baseline = pumpBaseline();
  wrap.innerHTML = PUMP_NAMES.map((name,i)=>
    `<div class="field"><label>${name} (oldingi: ${fmt(baseline[i])})</label>
      <input type="number" id="pump_${i}" step="0.01" placeholder="hozirgi ko'rsatkich"></div>`).join('');
  wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcPreview));
}
function buildCompanySelects(){
  const opts = state.companies.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  document.getElementById('delCompany').innerHTML = opts;
  document.getElementById('payCompany').innerHTML = opts;
}
function addDelivery(){
  const sel = document.getElementById('delCompany');
  const m3 = parseFloat(document.getElementById('delM3').value);
  if(!sel.value || !m3){ toast("Kompaniya va m3 kiriting"); return; }
  pending.deliveries.push({company_id: sel.value, companyName: sel.options[sel.selectedIndex].text, m3});
  document.getElementById('delM3').value = '';
  renderPendingLists();
}
function addPayment(){
  const sel = document.getElementById('payCompany');
  const amt = parseFloat(document.getElementById('payAmount').value);
  if(!sel.value || !amt){ toast("Kompaniya va summa kiriting"); return; }
  pending.payments.push({company_id: sel.value, companyName: sel.options[sel.selectedIndex].text, amount: amt});
  document.getElementById('payAmount').value = '';
  renderPendingLists();
}
function renderPendingLists(){
  document.getElementById('deliveryList').innerHTML = pending.deliveries.map((d,i)=>
    `<div class="list-item">${esc(d.companyName)} — ${fmt(d.m3)} m3 <button class="del" onclick="pending.deliveries.splice(${i},1);renderPendingLists()">✕</button></div>`
  ).join('') || '<p class="empty">Hali qo&#39;shilmagan</p>';
  document.getElementById('paymentList').innerHTML = pending.payments.map((p,i)=>
    `<div class="list-item">${esc(p.companyName)} — ${fmt(p.amount)} so'm <button class="del" onclick="pending.payments.splice(${i},1);renderPendingLists()">✕</button></div>`
  ).join('') || '<p class="empty">Hali qo&#39;shilmagan</p>';
}

async function submitEntry(){
  const date = document.getElementById('f_date').value;
  const operator = document.getElementById('f_operator').value.trim();
  if(!date || !operator){ toast("Sana va operator ismini kiriting"); return; }
  const calc = recalcPreview();
  if(!calc.ok){ toast("Barcha pompa ko'rsatkichlarini kiriting"); return; }
  const agres = parseFloat(document.getElementById('f_agres').value);
  if(isNaN(agres)){ toast("Агрес ko'rsatkichini kiriting"); return; }
  const pumpEnd = PUMP_NAMES.map((_,i)=>parseFloat(document.getElementById('pump_'+i).value));

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Yuborilmoqda…';
  try{
    const { data: entryRow, error } = await sb.from('entries').insert({
      date, operator_id: state.profile.id, operator_name: operator,
      pump_end: pumpEnd, agres,
      uzcard: calc.uzcard, humo: calc.humo, qr: calc.qr,
      sold_m3: calc.soldM3, sales_value: calc.salesValue, naqt: calc.naqt,
      price: calc.price.sale_price,
      izoh: document.getElementById('f_izoh').value.trim() || null
    }).select().single();
    if(error) throw error;

    if(pending.deliveries.length){
      const rows = pending.deliveries.map(d=>({entry_id: entryRow.id, company_id: d.company_id, m3: d.m3}));
      const { error: e2 } = await sb.from('deliveries').insert(rows);
      if(e2) throw e2;
    }
    if(pending.payments.length){
      const rows = pending.payments.map(p=>({entry_id: entryRow.id, company_id: p.company_id, amount: p.amount}));
      const { error: e3 } = await sb.from('payments').insert(rows);
      if(e3) throw e3;
    }

    toast("Hisobot yuborildi ✓");
    pending = {deliveries:[], payments:[]};
    await loadAll();
    renderTab();
  }catch(e){
    toast("Xatolik: " + (e.message || 'saqlanmadi'));
  }finally{
    btn.disabled = false; btn.textContent = 'Yuborish';
  }
}

// REPORTS — table + date lookup (shows everything for one day)
// ============================================================
function tplReports(){
  const rows = state.entries.slice(0,30);
  return `
  <div class="card">
    <h2>Sana bo'yicha qidirish</h2>
    <p class="hint">Istalgan o'tgan kunni tanlang — o'sha kundagi barcha ma'lumotlar (pompalar, to'lovlar, yetkazib berish, izoh) to'liq chiqadi.</p>
    <div class="field"><input type="date" id="rep_date" max="${todayISO()}"></div>
    <div id="repDetail"></div>
  </div>
  <div class="card">
    <h2>So'nggi kunlar</h2>
    <div class="table-wrap">
      <table><thead><tr><th>Sana</th><th>Operator</th><th>Sotilgan m3</th><th>Sotuv summasi</th><th>Naqt</th><th>Агрес farqi</th></tr></thead>
      <tbody>${rows.map(e=>{
        const gap = Number(e.sold_m3)-Number(e.agres);
        return `<tr style="cursor:pointer" onclick="document.getElementById('rep_date').value='${e.date}';renderReportDetail()">
          <td>${e.date}</td><td>${esc(e.operator_name)}</td><td>${fmt(e.sold_m3)}</td><td>${fmt(e.sales_value)}</td><td>${fmt(e.naqt)}</td>
          <td><span class="pill ${Math.abs(gap)>300?'bad':'good'}">${fmt(gap)} m3</span></td></tr>`;
      }).join('') || '<tr><td colspan="6" class="empty">Hali hisobot yo&#39;q</td></tr>'}</tbody></table>
    </div>
  </div>`;
}
function renderReportDetail(){
  const date = document.getElementById('rep_date').value;
  const box = document.getElementById('repDetail');
  if(!date){ box.innerHTML=''; return; }
  const e = state.entries.find(x=>x.date===date);
  if(!e){ box.innerHTML = `<p class="detail-box">Bu sanada hisobot topilmadi.</p>`; return; }
  const dels = state.deliveries.filter(d=>d.entry_id===e.id);
  const pays = state.payments.filter(p=>p.entry_id===e.id);
  const compName = id => (state.companies.find(c=>c.id===id)||{}).name || '—';
  box.innerHTML = `<div class="detail-box">
    <div><b>${e.date}</b> — Operator: ${esc(e.operator_name)}</div>
    <div>Pompalar: ${(e.pump_end||[]).map((v,i)=>PUMP_NAMES[i]+': '+fmt(v)).join(' · ')}</div>
    <div>Агрес: ${fmt(e.agres)} m3 &nbsp; | &nbsp; Sotilgan: ${fmt(e.sold_m3)} m3 &nbsp; | &nbsp; Farq: ${fmt(e.sold_m3-e.agres)} m3</div>
    <div>Sotuv summasi: ${fmt(e.sales_value)} so'm (narx: ${fmt(e.price)}/m3)</div>
    <div>UZCARD: ${fmt(e.uzcard)} · HUMO: ${fmt(e.humo)} · QR: ${fmt(e.qr)} · Naqt: ${fmt(e.naqt)}</div>
    ${dels.length? '<div>Berilgan gaz: '+dels.map(d=>compName(d.company_id)+' — '+fmt(d.m3)+' m3').join(', ')+'</div>':''}
    ${pays.length? '<div>Kelgan to&#39;lov: '+pays.map(p=>compName(p.company_id)+' — '+fmt(p.amount)+" so'm").join(', ')+'</div>':''}
    ${e.izoh? '<div>Izoh: '+esc(e.izoh)+'</div>':''}
  </div>`;
}

// COMPANIES
// ============================================================
function tplCompanies(role){
  const totals = companyTotals().sort((a,b)=>a.name.localeCompare(b.name));
  const canEdit = role==='ceo';
  return `
  <div class="card group-company">
    <div class="section-title"><h2>Kompaniyalar balansi</h2></div>
    <div class="table-wrap">
      <table><thead><tr><th>Kompaniya</th><th>Sotilgan m3</th><th>Sotilgan summa</th><th>To'langan</th><th>Qoldiq balans</th></tr></thead>
      <tbody>${totals.map(c=>{
        const bal = c.paid - c.sold;
        return `<tr><td>${esc(c.name)}</td><td>${fmt(c.m3)}</td><td>${fmt(c.sold)}</td><td>${fmt(c.paid)}</td>
          <td><span class="pill ${bal<0?'bad':'good'}">${fmt(bal)}</span></td></tr>`;
      }).join('')}</tbody></table>
    </div>
  </div>
  ${canEdit ? `
  <div class="card group-settings">
    <h2>Yangi kompaniya qo'shish</h2>
    <div class="row">
      <div class="field" style="flex:2"><label>Nomi</label><input type="text" id="nc_name"></div>
      <div class="field"><label>Boshlang'ich m3</label><input type="number" id="nc_m3" value="0"></div>
      <div class="field"><label>Boshlang'ich sotilgan summa</label><input type="number" id="nc_sold" value="0"></div>
      <div class="field"><label>Boshlang'ich to'langan</label><input type="number" id="nc_paid" value="0"></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn small" onclick="addCompany()">Qo'shish</button></div>
    </div>
  </div>` : ''}`;
}
async function addCompany(){
  const name = document.getElementById('nc_name').value.trim();
  if(!name){ toast("Nom kiriting"); return; }
  const { error } = await sb.from('companies').insert({
    name,
    seed_m3: parseFloat(document.getElementById('nc_m3').value)||0,
    seed_sold: parseFloat(document.getElementById('nc_sold').value)||0,
    seed_paid: parseFloat(document.getElementById('nc_paid').value)||0
  });
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Kompaniya qo'shildi ✓");
  await loadAll(); renderTab();
}

      <table><thead><tr><th>Oy</th><th>Turi</th><th>Summa</th><th>Izoh</th></tr></thead>

      ).join('') || '<tr><td colspan="4" class="empty">Hali kiritilmagan</td></tr>'}</tbody></table>

        `<tr><td>${e.date}</td><td>${esc(e.description)}</td><td>${fmt(e.amount)}</td></tr>`

async function addPrepayment(){
  const monthVal = document.getElementById('pp_month').value; // yyyy-mm
  if(!monthVal){ toast("Oyni tanlang"); return; }
  const { error } = await sb.from('prepayments').upsert({
    month: monthVal+'-01', kind: document.getElementById('pp_kind').value,
    amount: parseFloat(document.getElementById('pp_amount').value)||0,
    note: document.getElementById('pp_note').value.trim()||null
  }, { onConflict: 'month,kind' });
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Saqlandi ✓"); await loadAll(); renderTab();
}
async function addOtherExpense(){
  const { error } = await sb.from('other_expenses').insert({
    date: document.getElementById('oe_date').value,
    description: document.getElementById('oe_desc').value.trim(),
    amount: parseFloat(document.getElementById('oe_amount').value)||0
  });
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Saqlandi ✓"); await loadAll(); renderTab();
}

  <div class="card group-tax">

    <div class="confirm-wrap">

        <div class="field"><label>Amal qilish sanasi</label><input type="date" id="tx_date"></div>
        <div class="field"><label>NDS (%)</label><input type="number" step="0.1" id="tx_nds"></div>

      </div>
      <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="tx_confirm" style="width:auto"> Ha, soliq stavkasi haqiqatan ham o'zgardi</label>

async function addPrice(){
  if(!document.getElementById('np_confirm').checked){ toast("Avval tasdiqlang"); return; }
  const { error } = await sb.from('prices').upsert({
    effective_date: document.getElementById('np_date').value,
    sale_price: parseFloat(document.getElementById('np_sale').value),
    cost_price: parseFloat(document.getElementById('np_cost').value),
    excise: parseFloat(document.getElementById('np_excise').value)
  }, {onConflict:'effective_date'});
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Narx qo'shildi ✓"); await loadAll(); renderTab();
}
async function addTaxRate(){
  if(!document.getElementById('tx_confirm').checked){ toast("Avval tasdiqlang"); return; }
  const { error } = await sb.from('tax_rates').upsert({
    effective_date: document.getElementById('tx_date').value,
    nds_rate: parseFloat(document.getElementById('tx_nds').value)/100,
    social_tax_rate: parseFloat(document.getElementById('tx_social').value)/100,
    profit_tax_rate: parseFloat(document.getElementById('tx_profit').value)/100
  }, {onConflict:'effective_date'});
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Stavka qo'shildi ✓"); await loadAll(); renderTab();
}
async function addFixedCost(){
  if(!document.getElementById('fc_confirm').checked){ toast("Avval tasdiqlang"); return; }
  const { error } = await sb.from('fixed_costs').upsert({
    effective_date: document.getElementById('fc_date').value,
    salary: parseFloat(document.getElementById('fc_salary').value)||0,
    bank_loan_interest: parseFloat(document.getElementById('fc_bank').value)||0,
    land_property_tax: parseFloat(document.getElementById('fc_land').value)||0,
    electricity_tariff: parseFloat(document.getElementById('fc_elec').value)||0
  }, {onConflict:'effective_date'});
  if(error){ toast("Xatolik: "+error.message); return; }
  toast("Qiymat qo'shildi ✓"); await loadAll(); renderTab();
}

boot();
</script>
