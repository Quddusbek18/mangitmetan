<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мангит Метан</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --border:#E3DED6; --fg:#241F1A; --muted:#7A7168;
  --accent:#B5651D; --accent-fg:#FFFFFF; --good:#2E7D4F; --bad:#B3261E; --warn:#B8860B; --orange:#C1590B;
  --blue:#2B5F8A; --purple:#6B4E9E;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181512; --surface:#221E19; --border:#3A342C; --fg:#F1ECE4; --muted:#A79E92;
    --accent:#E08A3C; --accent-fg:#181512; --good:#5FBE84; --bad:#F2938A; --warn:#E0B84C; --orange:#F0954D;
    --blue:#7FB0DD; --purple:#B69AE6;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:16px;padding-block:20px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 4px}
h1{font-size:1.4rem}
h2{font-size:1.05rem}
h3{font-size:.92rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.who{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:5}
.tab-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:.85rem;font-weight:600;cursor:pointer}
.tab-btn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card.group-income{border-left:4px solid var(--good)}
.card.group-expense{border-left:4px solid var(--bad)}
.card.group-tax{border-left:4px solid var(--purple)}
.card.group-company{border-left:4px solid var(--blue)}
.card.group-settings{border-left:4px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label{font-size:.78rem;color:var(--muted);font-weight:600}
input,select,textarea{font-family:var(--font-body);font-size:.95rem;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:60px;resize:vertical}
.btn{padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.9rem;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.list-item:last-child{border-bottom:none}
.list-item .del{margin-left:auto;background:none;border:none;color:var(--bad);cursor:pointer;font-size:1rem;padding:2px 8px}
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tile .value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:700;margin-top:4px}
.tile .value.good{color:var(--good)} .tile .value.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.bad{background:color-mix(in srgb, var(--bad) 18%, transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good)}
.pill.orange{background:color-mix(in srgb, var(--orange) 18%, transparent);color:var(--orange)}
.pill.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:.9rem}
.pl-row.pl-indent{padding-left:14px;font-size:.83rem;color:var(--muted)}
.pl-row.pl-bold{font-weight:700;font-size:1rem;border-bottom:2px solid var(--fg);margin-top:4px}
.pl-row .good-text{color:var(--good)}
.pl-row .bad-text{color:var(--bad)}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:100}
.review-box{background:var(--bg);border-radius:14px;max-width:560px;width:100%;padding:18px;margin:auto}
.review-box h2{margin:0 0 4px}
.review-section{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.review-section h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:0 0 6px}
.review-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;font-variant-numeric:tabular-nums}
.review-row .k{color:var(--muted)}
.review-warn{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:12px;font-weight:600}
.toast.show{opacity:1}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.login-card{max-width:360px;margin:60px auto;text-align:center}
.detail-box{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:10px;font-size:.85rem}
.detail-box div{padding:3px 0}
.confirm-wrap{background:var(--bg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:8px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty" id="globalLoading">Юкланмоқда…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// CONFIG — these two values are safe to be public (anon/publishable
// key only allows what the RLS policies in schema.sql permit).
// ============================================================
const SUPABASE_URL = 'https://kypgclfrdynegezqitsw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Lq6eHYDL3H_WruWBjN--Lg_PlYQoMYl';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// One-time historical starting point (last known pump readings from the
// old Excel system, 2026-09-26). Used ONLY until the first real entry
// exists in the new system - after that, the baseline is always derived
// from the most recent entry, never hardcoded again.
const SEED_PUMP_START = [971377.59, 788394.55, 1684533.06, 1557224.34, 1180665.26, 1444438.03];
const PUMP_NAMES = ['K1','K2','K3','K4','K5','K6'];

let state = {
  session: null, profile: null,
  companies: [], prices: [], taxRates: [], fixedCosts: [], prepayments: [], otherExpenses: [],
  entries: [], deliveries: [], payments: []
};
let pending = { deliveries: [] };
let activeTab = null;

const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const pct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';
const todayISO = () => new Date().toISOString().slice(0,10);
const monthISO = (d) => d.slice(0,7)+'-01';
const toast = (msg) => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); };
const esc = s => (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// AUTH
// ============================================================
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(session); } else { renderLogin(); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ state = {session:null, profile:null, companies:[],prices:[],taxRates:[],fixedCosts:[],prepayments:[],otherExpenses:[],entries:[],deliveries:[],payments:[]}; renderLogin(); }
  });
}

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="card login-card">
      <h1>Мангит Метан</h1>
      <p class="sub">Кунлик ҳисобот ва бошқарув тизими</p>
      <div class="field" style="text-align:left"><label>Email</label><input type="email" id="loginEmail"></div>
      <div class="field" style="text-align:left"><label>Парол</label><input type="password" id="loginPass"></div>
      <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Кириш</button>
      <p class="hint" id="loginErr" style="color:var(--bad)"></p>
    </div>`;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Текширилмоқда…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Кириш';
  if(error){ document.getElementById('loginErr').textContent = 'Email ёки парол хато'; return; }
  await afterLogin(data.session);
}

async function doLogout(){
  await sb.auth.signOut();
}

async function afterLogin(session){
  state.session = session;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !profile){
    document.getElementById('app').innerHTML = `<div class="card login-card"><p>Ҳисобингиз ҳали ролга боғланмаган. CEO билан боғланинг.</p><button class="btn secondary" onclick="doLogout()">Чиқиш</button></div>`;
    return;
  }
  state.profile = profile;
  await loadAll();
  renderShell();
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadAll(){
  const [companies, prices, taxRates, fixedCosts, prepayments, otherExpenses, entries, deliveries, payments] = await Promise.all([
    sb.from('companies').select('*').order('name'),
    sb.from('prices').select('*').order('effective_date'),
    sb.from('tax_rates').select('*').order('effective_date'),
    sb.from('fixed_costs').select('*').order('effective_date'),
    sb.from('prepayments').select('*').order('month', {ascending:false}),
    sb.from('other_expenses').select('*').order('date', {ascending:false}),
    sb.from('entries').select('*').order('date', {ascending:false}).limit(400),
    sb.from('deliveries').select('*, entries(price,date)'),
    sb.from('payments').select('*, entries(date)').order('created_at', {ascending:false}),
  ]);
  state.companies = companies.data || [];
  state.prices = prices.data || [];
  state.taxRates = taxRates.data || [];
  state.fixedCosts = fixedCosts.data || [];
  state.prepayments = prepayments.data || [];
  state.otherExpenses = otherExpenses.data || [];
  state.entries = entries.data || [];
  state.deliveries = deliveries.data || [];
  state.payments = payments.data || [];
}

function priceFor(dateStr){
  let best = state.prices[0] || {sale_price:5500, cost_price:2750, excise:780};
  for(const p of state.prices){ if(p.effective_date <= dateStr) best = p; }
  return best;
}
function taxFor(dateStr){
  let best = state.taxRates[0] || {nds_rate:0.12, social_tax_rate:0.01, profit_tax_rate:0.075};
  for(const t of state.taxRates){ if(t.effective_date <= dateStr) best = t; }
  return best;
}
function fixedCostFor(dateStr){
  let best = state.fixedCosts[0] || {salary:0, bank_loan_interest:0, land_property_tax:0, electricity_tariff:0};
  for(const f of state.fixedCosts){ if(f.effective_date <= dateStr) best = f; }
  return best;
}
function pumpBaseline(){
  if(state.entries.length){
    // entries loaded newest-first
    return state.entries[0].pump_end;
  }
  return SEED_PUMP_START;
}
function companyTotals(){
  const totals = {};
  state.companies.forEach(c=> totals[c.id] = { id:c.id, name:c.name, m3:c.seed_m3||0, sold:c.seed_sold||0, paid:c.seed_paid||0 });
  state.deliveries.forEach(d=>{
    const t = totals[d.company_id]; if(!t) return;
    const price = (d.entries && d.entries.price) || 0;
    t.m3 += Number(d.m3)||0;
    t.sold += (Number(d.m3)||0) * price;
  });
  state.payments.forEach(p=>{
    const t = totals[p.company_id]; if(!t) return;
    t.paid += Number(p.amount)||0;
  });
  return Object.values(totals);
}

// ============================================================
// SHELL / TABS
// ============================================================
function tabsForRole(role){
  if(role === 'operator') return [['entry','Кунлик ҳисобот']];
  if(role === 'direktor') return [['overview','Умумий'],['reports','Ҳисоботлар'],['companies','Компаниялар'],['expenses','Харажатлар']];
  return [['entry','Кунлик ҳисобот'],['overview','Умумий'],['reports','Ҳисоботлар'],['companies','Компаниялар'],['expenses','Харажатлар'],['settings','Созламалар']];
}

function renderShell(){
  const role = state.profile.role;
  const tabs = tabsForRole(role);
  if(!activeTab || !tabs.find(t=>t[0]===activeTab)) activeTab = tabs[0][0];
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div><h1 style="margin-bottom:0">Мангит Метан</h1><p class="who">${esc(state.profile.full_name)} — ${roleLabel(role)}</p></div>
      <button class="btn secondary small" onclick="doLogout()">Чиқиш</button>
    </div>
    <div class="tabs" id="tabsRow"></div>
    <div id="tabBody"></div>`;
  document.getElementById('tabsRow').innerHTML = tabs.map(([id,label])=>
    `<button class="tab-btn ${id===activeTab?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('');
  renderTab();
}
function roleLabel(r){ return r==='ceo'?'CEO':(r==='direktor'?'Директор':'Оператор'); }
function switchTab(id){ activeTab = id; renderShell(); }

function renderTab(){
  const body = document.getElementById('tabBody');
  const role = state.profile.role;
  if(activeTab==='entry') body.innerHTML = tplEntry();
  else if(activeTab==='overview') body.innerHTML = tplOverview();
  else if(activeTab==='reports') body.innerHTML = tplReports();
  else if(activeTab==='companies') body.innerHTML = tplCompanies(role);
  else if(activeTab==='expenses') body.innerHTML = tplExpenses(role);
  else if(activeTab==='settings') body.innerHTML = tplSettings();
  afterRenderTab();
}
function afterRenderTab(){
  if(activeTab==='entry'){
    buildPumpFields(); buildCompanySelects(); renderPendingLists(); recalcPreview();
    document.getElementById('f_date').value = todayISO();
  }
  if(activeTab==='reports'){
    document.getElementById('rep_date').addEventListener('change', renderReportDetail);
  }
  if(activeTab==='companies'){
    afterRenderCompanies();
  }
  if(activeTab==='overview'){
    renderPL();
    document.getElementById('pl_month').addEventListener('change', renderPL);
  }
}

// ============================================================
// OPERATOR — daily entry
// ============================================================
function tplEntry(){
  return `
  <div class="card">
    <div class="section-title"><h2>Бугунги ҳисобот</h2></div>
    <div class="row">
      <div class="field"><label>Сана</label><input type="date" id="f_date"></div>
      <div class="field"><label>Оператор исми</label><input type="text" id="f_operator" placeholder="Жаҳонгир / Сардор"></div>
    </div>
  </div>
  <div class="card">
    <h2>Помпалар — ҳозирги кўрсаткич (m3)</h2>
    <p class="hint">Олдинги кўрсаткич қавс ичида — шундан катта рақам киритинг.</p>
    <div class="row" id="pumpFields"></div>
  </div>
  <div class="card">
    <h2>Ҳисоблагичдан ўтган газ — Агрес (m3)</h2>
    <div class="field"><input type="number" id="f_agres" step="1" placeholder="m3"></div>
  </div>
  <div class="card">
    <h2>Тўлов турлари (сўм)</h2>
    <div class="row">
      <div class="field"><label>UZCARD</label><input type="number" id="f_uzcard" step="1" value="0"></div>
      <div class="field"><label>HUMO</label><input type="number" id="f_humo" step="1" value="0"></div>
      <div class="field"><label>QR тўлов</label><input type="number" id="f_qr" step="1" value="0"></div>
    </div>
    <div class="tile-row" style="margin-top:6px">
      <div class="tile"><div class="label">Сотилган m3</div><div class="value" id="calcSoldM3">—</div></div>
      <div class="tile"><div class="label">Сотув суммаси</div><div class="value" id="calcSalesValue">—</div></div>
      <div class="tile"><div class="label">Нақт (автоматик)</div><div class="value good" id="calcNaqt">—</div></div>
    </div>
    <p class="hint">Нақт = Сотув суммаси − UZCARD − HUMO − QR.</p>
  </div>
  <div class="card">
    <div class="section-title"><h2>Компанияларга берилган газ</h2></div>
    <div id="deliveryList"></div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:2"><select id="delCompany"></select></div>
      <div class="field"><input type="number" id="delM3" placeholder="m3" step="0.01"></div>
      <div class="field" style="flex:0 0 auto"><button class="btn secondary small" onclick="addDelivery()">+ Қўшиш</button></div>
    </div>
  </div>
  <div class="card"><h2>Изоҳ</h2><textarea id="f_izoh" placeholder="Ихтиёрий изоҳ..."></textarea></div>
  <button class="btn" id="submitBtn" style="width:100%;padding:14px" onclick="openReview()">Текшириш ва юбориш</button>`;
}

function recalcPreview(){
  const baseline = pumpBaseline();
  const pumps = PUMP_NAMES.map((_,i)=>{
    const el = document.getElementById('pump_'+i);
    return el ? parseFloat(el.value) : NaN;
  });
  let soldM3 = 0, ok = true;
  pumps.forEach((v,i)=>{ if(isNaN(v)){ ok=false; return; } soldM3 += (v - baseline[i]); });
  const date = document.getElementById('f_date').value || todayISO();
  const price = priceFor(date);
  const salesValue = ok ? soldM3 * price.sale_price : NaN;
  const uzcard = parseFloat(document.getElementById('f_uzcard').value)||0;
  const humo = parseFloat(document.getElementById('f_humo').value)||0;
  const qr = parseFloat(document.getElementById('f_qr').value)||0;
  const naqt = ok ? (salesValue - uzcard - humo - qr) : NaN;
  document.getElementById('calcSoldM3').textContent = ok ? fmt(soldM3)+' m3' : '—';
  document.getElementById('calcSalesValue').textContent = ok ? fmt(salesValue)+" сўм" : '—';
  const naqtEl = document.getElementById('calcNaqt');
  naqtEl.textContent = ok ? fmt(naqt)+" сўм" : '—';
  naqtEl.className = 'value ' + (naqt < 0 ? 'bad' : 'good');
  return {soldM3, salesValue, naqt, uzcard, humo, qr, price, ok};
}
function buildPumpFields(){
  const wrap = document.getElementById('pumpFields');
  const baseline = pumpBaseline();
  wrap.innerHTML = PUMP_NAMES.map((name,i)=>
    `<div class="field"><label>${name} (олдинги: ${fmt(baseline[i])})</label>
      <input type="number" id="pump_${i}" step="0.01" placeholder="ҳозирги кўрсаткич"></div>`).join('');
  wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcPreview));
}
function buildCompanySelects(){
  const opts = state.companies.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  document.getElementById('delCompany').innerHTML = opts;
}
function addDelivery(){
  const sel = document.getElementById('delCompany');
  const m3 = parseFloat(document.getElementById('delM3').value);
  if(!sel.value || !m3){ toast("Компания ва m3 киритинг"); return; }
  pending.deliveries.push({company_id: sel.value, companyName: sel.options[sel.selectedIndex].text, m3});
  document.getElementById('delM3').value = '';
  renderPendingLists();
}
function renderPendingLists(){
  document.getElementById('deliveryList').innerHTML = pending.deliveries.map((d,i)=>
    `<div class="list-item">${esc(d.companyName)} — ${fmt(d.m3)} m3 <button class="del" onclick="pending.deliveries.splice(${i},1);renderPendingLists()">✕</button></div>`
  ).join('') || '<p class="empty">Ҳали қўшилмаган</p>';
}

// Gathers + validates the current form. Returns null (and toasts the
// problem) if something required is missing; otherwise returns everything
// needed both to render the review screen and to actually submit.
function collectEntryForm(){
  const date = document.getElementById('f_date').value;
  const operator = document.getElementById('f_operator').value.trim();
  if(!date || !operator){ toast("Сана ва оператор исмини киритинг"); return null; }
  const calc = recalcPreview();
  if(!calc.ok){ toast("Барча помпа кўрсаткичларини киритинг"); return null; }
  const agres = parseFloat(document.getElementById('f_agres').value);
  if(isNaN(agres)){ toast("Агрес кўрсаткичини киритинг"); return null; }
  const baseline = pumpBaseline();
  const pumpEnd = PUMP_NAMES.map((_,i)=>parseFloat(document.getElementById('pump_'+i).value));
  const izoh = document.getElementById('f_izoh').value.trim() || null;
  return { date, operator, calc, agres, pumpEnd, baseline, izoh };
}

  const el = document.getElementById('reviewOverlay');

// Step 2: only runs after the operator ticked the confirm box on the
// review screen. This is the actual database write.
async function doSubmitEntry(){
  const f = collectEntryForm();
  if(!f){ closeReview(); return; }

  const btn = document.getElementById('reviewSubmitBtn');
  btn.disabled = true; btn.textContent = 'Юборилмоқда…';
  try{
    const { data: entryRow, error } = await sb.from('entries').insert({
      date: f.date, operator_id: state.profile.id, operator_name: f.operator,
      pump_end: f.pumpEnd, agres: f.agres,
      uzcard: f.calc.uzcard, humo: f.calc.humo, qr: f.calc.qr,
      sold_m3: f.calc.soldM3, sales_value: f.calc.salesValue, naqt: f.calc.naqt,
      price: f.calc.price.sale_price,
      izoh: f.izoh
    }).select().single();
    if(error) throw error;

    if(pending.deliveries.length){
      const rows = pending.deliveries.map(d=>({entry_id: entryRow.id, company_id: d.company_id, m3: d.m3}));
      const { error: e2 } = await sb.from('deliveries').insert(rows);
      if(e2) throw e2;
    }

    closeReview();
    toast("Ҳисобот юборилди ✓");
    pending = {deliveries:[]};
    await loadAll();
    renderTab();
  }catch(e){
    toast("Хатолик: " + (e.message || 'сақланмади'));
    btn.disabled = false; btn.textContent = 'Тасдиқлаш ва юбориш';
  }
}

function currentMonthKey(){ return todayISO().slice(0,7); }

// Full monthly profit & loss for one calendar month (yyyy-mm).
// Every line is shown separately in renderPL() so the CEO/Direktor can
// verify each number against the source data - this is an ESTIMATE built
// from the entered rates, not a substitute for the accountant's own
// bookkeeping (NDS/tax math in particular is simplified).
function computeMonthlyPL(monthStr){
  const monthEntries = state.entries.filter(e=> e.date && e.date.slice(0,7)===monthStr);
  let revenue=0, cogs=0, excise=0;
  monthEntries.forEach(e=>{
    const soldM3 = Number(e.sold_m3)||0;
    revenue += Number(e.sales_value)||0;
    const pr = priceFor(e.date);
    cogs += soldM3 * pr.cost_price;
    excise += soldM3 * pr.excise;
  });
  const grossProfit = revenue - cogs - excise;
  const fc = fixedCostFor(monthStr+'-01');
  const fixedTotal = (Number(fc.salary)||0)+(Number(fc.bank_loan_interest)||0)+(Number(fc.land_property_tax)||0);
  const otherExp = state.otherExpenses.filter(e=>e.date && e.date.slice(0,7)===monthStr).reduce((s,e)=>s+Number(e.amount||0),0);
  const prepayGaz = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='gaz').reduce((s,p)=>s+Number(p.amount||0),0);
  const prepayTok = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='tok').reduce((s,p)=>s+Number(p.amount||0),0);
  const preTax = grossProfit - fixedTotal - otherExp;
  const tax = taxFor(monthStr+'-01');
  const ndsRate = Number(tax.nds_rate)||0;
  const ndsAmount = revenue * (ndsRate/(1+ndsRate));
  const socialAmount = (Number(fc.salary)||0) * (Number(tax.social_tax_rate)||0);
  const profitTaxBase = Math.max(preTax - ndsAmount, 0);
  const profitTaxAmount = profitTaxBase * (Number(tax.profit_tax_rate)||0);
  const netProfit = preTax - ndsAmount - socialAmount - profitTaxAmount;
  return { count: monthEntries.length, revenue, cogs, excise, grossProfit, fc, fixedTotal, otherExp, prepayGaz, prepayTok, preTax, tax, ndsAmount, socialAmount, profitTaxAmount, netProfit };
}

function renderPL(){

  box.innerHTML = `
    <p class="hint" style="margin-bottom:10px">${pl.count} та кунлик ҳисобот асосида ҳисобланди. Рақамлар СОЗЛАМАЛАРдаги нарх/солиқ ставкаларига асосан тахминий ҳисобланади — аниқ солиқ ҳисоб-китоби учун бухгалтер билан текшириб олинг.</p>
    ${row('Сотув суммаси (жами)', fmt(pl.revenue)+" сўм")}
    ${row('− Таннарх харажати (газ)', fmt(pl.cogs)+" сўм", {indent:true})}
    ${row('− Акциз', fmt(pl.excise)+" сўм", {indent:true})}
    ${row('= Ялпи фойда', fmt(pl.grossProfit)+" сўм", {bold:true})}
    ${row('− Иш ҳақи', fmt(pl.fc.salary)+" сўм", {indent:true})}
    ${row('− Банк кредити', fmt(pl.fc.bank_loan_interest)+" сўм", {indent:true})}
    ${row('− Ер-мулк солиғи', fmt(pl.fc.land_property_tax)+" сўм", {indent:true})}
    ${row('− Бошқа харажатлар', fmt(pl.otherExp)+" сўм", {indent:true})}
    ${row('= Солиққача фойда', fmt(pl.preTax)+" сўм", {bold:true})}
    ${row('− НДС ('+pct(pl.tax.nds_rate)+')', fmt(pl.ndsAmount)+" сўм", {indent:true})}

}

// Balance tiers — the further below zero, the more urgent the reminder
// to contact the company about topping up. Thresholds per CEO's request:
// < 200k = red (urgent), < 500k = orange, < 1.5mln = yellow (watch),
// >= 1.5mln = green (fine). A negative balance (company owes money) is
// always red regardless of these thresholds.
function balanceTier(bal){
  if(bal < 200000) return 'bad';
  if(bal < 500000) return 'orange';
  if(bal < 1500000) return 'warn';
  return 'good';
}
function balanceLabel(bal){
  if(bal < 0) return 'Қарздор!';
  if(bal < 200000) return 'Жуда кам қолди';
  if(bal < 500000) return 'Кам қолмоқда';
  if(bal < 1500000) return 'Кузатиб туринг';
  return 'Яхши';
}

    sel.innerHTML = state.companies.slice().sort((a,b)=>a.name.localeCompare(b.name))

  }
}
async function addCompanyPayment(){
  const companyId = document.getElementById('cp_company').value;
  const amount = parseFloat(document.getElementById('cp_amount').value);
  const date = document.getElementById('cp_date').value || todayISO();
  if(!companyId || !amount){ toast("Компания ва суммани киритинг"); return; }
  const { error } = await sb.from('payments').insert({
    company_id: companyId, amount, date,
    note: document.getElementById('cp_note').value.trim() || null
  });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Баланс янгиланди ✓");
  await loadAll(); renderTab();
}
async function deleteCompanyPayment(id){
  if(!confirm("Бу тўловни ўчирасизми? (компания баланси қайта ҳисобланади)")) return;
  const { error } = await sb.from('payments').delete().eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ўчирилди ✓");
  await loadAll(); renderTab();
}
async function addCompany(){

  if(!name){ toast("Ном киритинг"); return; }
  const { error } = await sb.from('companies').insert({
    name,
    seed_m3: parseFloat(document.getElementById('nc_m3').value)||0,
    seed_sold: parseFloat(document.getElementById('nc_sold').value)||0,
    seed_paid: parseFloat(document.getElementById('nc_paid').value)||0
  });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Компания қўшилди ✓");
  await loadAll(); renderTab();
}
async function deleteCompany(id){
  if(!confirm("Бу компанияни ўчирасизми? (агар унга боғлиқ етказиб бериш/тўлов ёзувлари бўлса, ўчирилмайди)")) return;

// ============================================================
// EXPENSES — prepayments + other expenses (grouped, CEO edits)
// ============================================================
function tplExpenses(role){
  const canEdit = role==='ceo';
  return `
  <div class="card group-expense">
    <div class="section-title"><h2>Препеймент (Газ / Ток)</h2></div>
    <div class="table-wrap">
      <table><thead><tr><th>Ой</th><th>Тури</th><th>Сумма</th><th>Изоҳ</th>${canEdit?'<th></th>':''}</tr></thead>
      <tbody>${state.prepayments.map(p=>
        `<tr><td>${p.month}</td><td>${p.kind==='gaz'?'Газ':'Ток'}</td><td>${fmt(p.amount)}</td><td>${esc(p.note||'')}</td>
          ${canEdit?`<td><button class="del" onclick="deletePrepayment('${p.id}')">✕</button></td>`:''}</tr>`
      ).join('') || `<tr><td colspan="${canEdit?5:4}" class="empty">Ҳали киритилмаган</td></tr>`}</tbody></table>
    </div>
    ${canEdit ? `<div class="row" style="margin-top:10px">
      <div class="field"><label>Ой</label><input type="month" id="pp_month"></div>
      <div class="field"><label>Тури</label><select id="pp_kind"><option value="gaz">Газ</option><option value="tok">Ток</option></select></div>
      <div class="field"><label>Сумма</label><input type="number" id="pp_amount"></div>
      <div class="field"><label>Изоҳ</label><input type="text" id="pp_note"></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn small" onclick="addPrepayment()">Қўшиш</button></div>
    </div>` : ''}
  </div>

  <div class="card group-expense">
    <div class="section-title"><h2>Бошқа харажатлар</h2></div>
    <div class="table-wrap">
      <table><thead><tr><th>Сана</th><th>Тавсиф</th><th>Сумма</th>${canEdit?'<th></th>':''}</tr></thead>
      <tbody>${state.otherExpenses.map(e=>
        `<tr><td>${e.date}</td><td>${esc(e.description)}</td><td>${fmt(e.amount)}</td>
          ${canEdit?`<td><button class="del" onclick="deleteOtherExpense('${e.id}')">✕</button></td>`:''}</tr>`
      ).join('') || `<tr><td colspan="${canEdit?4:3}" class="empty">Ҳали киритилмаган</td></tr>`}</tbody></table>
    </div>
    ${canEdit ? `<div class="row" style="margin-top:10px">
      <div class="field"><label>Сана</label><input type="date" id="oe_date" value="${todayISO()}"></div>
      <div class="field" style="flex:2"><label>Тавсиф</label><input type="text" id="oe_desc"></div>
      <div class="field"><label>Сумма</label><input type="number" id="oe_amount"></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn small" onclick="addOtherExpense()">Қўшиш</button></div>
    </div>` : ''}
  </div>`;
}
async function addPrepayment(){
  const monthVal = document.getElementById('pp_month').value; // yyyy-mm
  if(!monthVal){ toast("Ойни танланг"); return; }
  const { error } = await sb.from('prepayments').upsert({
    month: monthVal+'-01', kind: document.getElementById('pp_kind').value,
    amount: parseFloat(document.getElementById('pp_amount').value)||0,
    note: document.getElementById('pp_note').value.trim()||null
  }, { onConflict: 'month,kind' });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Сақланди ✓"); await loadAll(); renderTab();
}
async function deletePrepayment(id){
  if(!confirm("Ўчирасизми?")) return;
  const { error } = await sb.from('prepayments').delete().eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ўчирилди ✓"); await loadAll(); renderTab();
}
async function deleteOtherExpense(id){
  if(!confirm("Ўчирасизми?")) return;
  const { error } = await sb.from('other_expenses').delete().eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ўчирилди ✓"); await loadAll(); renderTab();
}
async function addOtherExpense(){
  const { error } = await sb.from('other_expenses').insert({
    date: document.getElementById('oe_date').value,
    description: document.getElementById('oe_desc').value.trim(),
    amount: parseFloat(document.getElementById('oe_amount').value)||0
  });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Сақланди ✓"); await loadAll(); renderTab();
}

// ============================================================
// SETTINGS (CEO only) — rarely-changing numbers, deliberate edit flow
// ============================================================
function tplSettings(){
  return `
  <div class="card group-settings">
    <div class="section-title"><h2>Нарх тарихи (Сотув / Таннарх / Акциз)</h2></div>
    <div class="table-wrap"><table><thead><tr><th>Сана (дан)</th><th>Сотув</th><th>Таннарх</th><th>Акциз</th></tr></thead>
      <tbody>${state.prices.map(p=>`<tr><td>${p.effective_date}</td><td>${fmt(p.sale_price)}</td><td>${fmt(p.cost_price)}</td><td>${fmt(p.excise)}</td></tr>`).join('')}</tbody></table></div>
    <div class="confirm-wrap">
      <p class="hint">⚠️ Бу узоқ муддат ўзгармайдиган рақам. Фақат нарх ҳақиқатан ҳам ўзгарган кунда янги қатор қўшинг — эски кунлар эски нархда ҳисобланаверади.</p>
      <div class="row">
        <div class="field"><label>Амал қилиш санаси</label><input type="date" id="np_date"></div>
        <div class="field"><label>Сотув нархи</label><input type="number" id="np_sale"></div>
        <div class="field"><label>Таннарх</label><input type="number" id="np_cost"></div>
        <div class="field"><label>Акциз</label><input type="number" id="np_excise"></div>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="np_confirm" style="width:auto"> Ҳа, нарх ҳақиқатан ҳам ўзгарди</label>
      <button class="btn small" onclick="addPrice()">Янги нарх қўшиш</button>
    </div>
  </div>

  <div class="card group-tax">
    <div class="section-title"><h2>Солиқ ставкалари тарихи</h2></div>
    <div class="table-wrap"><table><thead><tr><th>Сана (дан)</th><th>НДС</th><th>Ижтимоий</th><th>Фойда</th></tr></thead>
      <tbody>${state.taxRates.map(t=>`<tr><td>${t.effective_date}</td><td>${pct(t.nds_rate)}</td><td>${pct(t.social_tax_rate)}</td><td>${pct(t.profit_tax_rate)}</td></tr>`).join('')}</tbody></table></div>
    <div class="confirm-wrap">
      <div class="row">
        <div class="field"><label>Амал қилиш санаси</label><input type="date" id="tx_date"></div>
        <div class="field"><label>НДС (%)</label><input type="number" step="0.1" id="tx_nds"></div>
        <div class="field"><label>Ижтимоий (%)</label><input type="number" step="0.1" id="tx_social"></div>
        <div class="field"><label>Фойда (%)</label><input type="number" step="0.1" id="tx_profit"></div>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="tx_confirm" style="width:auto"> Ҳа, солиқ ставкаси ҳақиқатан ҳам ўзгарди</label>
      <button class="btn small" onclick="addTaxRate()">Янги ставка қўшиш</button>
    </div>
  </div>

  <div class="card group-settings">
    <div class="section-title"><h2>Доимий харажатлар (Иш ҳақи / Банк кредити / Ер-мулк солиғи / Электр тарифи)</h2></div>
    <div class="table-wrap"><table><thead><tr><th>Сана (дан)</th><th>Иш ҳақи</th><th>Банк кредити</th><th>Ер-мулк</th><th>Электр</th></tr></thead>
      <tbody>${state.fixedCosts.map(f=>`<tr><td>${f.effective_date}</td><td>${fmt(f.salary)}</td><td>${fmt(f.bank_loan_interest)}</td><td>${fmt(f.land_property_tax)}</td><td>${fmt(f.electricity_tariff)}</td></tr>`).join('')}</tbody></table></div>
    <div class="confirm-wrap">
      <div class="row">
        <div class="field"><label>Амал қилиш санаси</label><input type="date" id="fc_date"></div>
        <div class="field"><label>Иш ҳақи</label><input type="number" id="fc_salary"></div>
        <div class="field"><label>Банк кредити</label><input type="number" id="fc_bank"></div>
        <div class="field"><label>Ер-мулк солиғи</label><input type="number" id="fc_land"></div>
        <div class="field"><label>Электр тарифи</label><input type="number" id="fc_elec"></div>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="fc_confirm" style="width:auto"> Ҳа, бу рақамлар ҳақиқатан ҳам ўзгарди</label>
      <button class="btn small" onclick="addFixedCost()">Янги қиймат қўшиш</button>
    </div>
  </div>`;
}
async function addPrice(){
  if(!document.getElementById('np_confirm').checked){ toast("Аввал тасдиқланг"); return; }
  const { error } = await sb.from('prices').upsert({
    effective_date: document.getElementById('np_date').value,
    sale_price: parseFloat(document.getElementById('np_sale').value),
    cost_price: parseFloat(document.getElementById('np_cost').value),
    excise: parseFloat(document.getElementById('np_excise').value)
  }, {onConflict:'effective_date'});
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Нарх қўшилди ✓"); await loadAll(); renderTab();
}
async function addTaxRate(){
  if(!document.getElementById('tx_confirm').checked){ toast("Аввал тасдиқланг"); return; }
  const { error } = await sb.from('tax_rates').upsert({
    effective_date: document.getElementById('tx_date').value,
    nds_rate: parseFloat(document.getElementById('tx_nds').value)/100,
    social_tax_rate: parseFloat(document.getElementById('tx_social').value)/100,
    profit_tax_rate: parseFloat(document.getElementById('tx_profit').value)/100
  }, {onConflict:'effective_date'});
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ставка қўшилди ✓"); await loadAll(); renderTab();
}
async function addFixedCost(){
  if(!document.getElementById('fc_confirm').checked){ toast("Аввал тасдиқланг"); return; }
  const { error } = await sb.from('fixed_costs').upsert({
    effective_date: document.getElementById('fc_date').value,
    salary: parseFloat(document.getElementById('fc_salary').value)||0,
    bank_loan_interest: parseFloat(document.getElementById('fc_bank').value)||0,
    land_property_tax: parseFloat(document.getElementById('fc_land').value)||0,
    electricity_tariff: parseFloat(document.getElementById('fc_elec').value)||0
  }, {onConflict:'effective_date'});
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Қиймат қўшилди ✓"); await loadAll(); renderTab();
}

boot();
</script>
