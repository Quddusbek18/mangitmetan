<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мангит Метан</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --border:#DCE6F2; --fg:#132236; --muted:#5B7089;
  --accent:#2563EB; --accent-fg:#FFFFFF; --good:#16A34A; --bad:#DC2626; --warn:#D97706; --orange:#EA580C;
  --blue:#0EA5E9; --purple:#7C3AED;
  --font-display:'Inter',system-ui,-apple-system,sans-serif; --font-body:'Inter',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#121D30; --border:#223148; --fg:#E7EEF9; --muted:#8CA0BC;
    --accent:#4C8DFF; --accent-fg:#0B1220; --good:#34D399; --bad:#F87171; --warn:#FBBF24; --orange:#FB923C;
    --blue:#38BDF8; --purple:#A78BFA;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:16px;padding-block:20px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 4px}
h1{font-size:1.4rem}
h2{font-size:1.05rem}
h3{font-size:.92rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.who{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:5}
.tab-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:.85rem;font-weight:600;cursor:pointer}
.tab-btn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(19,34,54,.04)}
.card.group-income{border-left:4px solid var(--good)}
.card.group-expense{border-left:4px solid var(--bad)}
.card.group-tax{border-left:4px solid var(--purple)}
.card.group-company{border-left:4px solid var(--blue)}
.card.group-settings{border-left:4px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label{font-size:.78rem;color:var(--muted);font-weight:600}
input,select,textarea{font-family:var(--font-body);font-size:.95rem;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:60px;resize:vertical}
.btn{padding:10px 16px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.9rem;cursor:pointer;transition:filter .15s}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.list-item:last-child{border-bottom:none}
.list-item .del{margin-left:auto;background:none;border:none;color:var(--bad);cursor:pointer;font-size:1rem;padding:2px 8px}
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(19,34,54,.04)}
.tile .label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tile .value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:700;margin-top:4px}
.tile .value.good{color:var(--good)} .tile .value.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase}
.table-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.bad{background:color-mix(in srgb, var(--bad) 18%, transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good)}
.pill.orange{background:color-mix(in srgb, var(--orange) 18%, transparent);color:var(--orange)}
.pill.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:.9rem}
.pl-row.pl-indent{padding-left:14px;font-size:.83rem;color:var(--muted)}
.pl-row.pl-bold{font-weight:700;font-size:1rem;border-bottom:2px solid var(--fg);margin-top:4px}
.pl-row .good-text{color:var(--good)}
.pl-row .bad-text{color:var(--bad)}
.pl-group-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-top:12px;margin-bottom:2px}
.pl-group-title:first-of-type{margin-top:0}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:100}
.review-box{background:var(--bg);border-radius:14px;max-width:560px;width:100%;padding:18px;margin:auto}
.review-box h2{margin:0 0 4px}
.review-section{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.review-section h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:0 0 6px}
.review-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;font-variant-numeric:tabular-nums}
.review-row .k{color:var(--muted)}
.review-warn{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:12px;font-weight:600}
.toast.show{opacity:1}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.login-card{max-width:360px;margin:60px auto;text-align:center}
.detail-box{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:10px;font-size:.85rem}
.detail-box div{padding:3px 0}
.confirm-wrap{background:var(--bg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:8px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty" id="globalLoading">Юкланмоқда…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ============================================================
// CONFIG — these two values are safe to be public (anon/publishable
// key only allows what the RLS policies in schema.sql permit).
// ============================================================
const SUPABASE_URL = 'https://kypgclfrdynegezqitsw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Lq6eHYDL3H_WruWBjN--Lg_PlYQoMYl';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// One-time historical starting point (last known pump readings from the
// old Excel system, 2026-09-26). Used ONLY until the first real entry
// exists in the new system - after that, the baseline is always derived
// from the most recent entry, never hardcoded again.
const SEED_PUMP_START = [971377.59, 788394.55, 1684533.06, 1557224.34, 1180665.26, 1444438.03];
const PUMP_NAMES = ['K1','K2','K3','K4','K5','K6'];

let state = {
  session: null, profile: null,
  companies: [], prices: [], taxRates: [], fixedCosts: [], prepayments: [], otherExpenses: [],
  entries: [], deliveries: [], payments: [], gapLedger: [], entryEditLog: []
};
let pending = { deliveries: [] };
let benzinPending = { sales: [] };

// ============================================================
// ЎҚУВ РЕЖИМИ — операторлар машқ қилиши учун. Ёқилганда, шакллар худди
// одатдагидек ишлайди (текшириш экрани ҳам чиқади), лекин "Тасдиқлаш"
// босилганда ҲЕЧ НАРСА базага ёзилмайди — фақат натижа кўрсатилади.
// Алоҳида база қурилмаган (мураккаблик учун), шунчаки ёзиш қадами
// сохталаштирилади. Саҳифа қайта юкланса ўчиб қолади (қасддан — доим
// ёдда бўлсин деб).
// ============================================================
let trainingMode = false;
function toggleTrainingMode(){ trainingMode = !trainingMode; renderTab(); }
function trainingBannerHtml(){
  return !trainingMode ? '' : `<div class="review-warn" style="margin-bottom:14px">🎓 ЎҚУВ РЕЖИМИ ёқилган — бу ерда киритган ҳеч нарса базага сақланмайди, фақат машқ учун.</div>`;
}
function trainingToggleBtnHtml(){
  return `<button class="btn ${trainingMode?'':'secondary'} small" style="margin-bottom:12px" onclick="toggleTrainingMode()">${trainingMode?'🎓 Ўқув режими — YONIQ (босиб ўчиринг)':'🎓 Ўқув режимини ёқиш (машқ учун, ҳеч нарса сақланмайди)'}</button>`;
}
let activeTab = null;
// Танланган станция: 'metan' | 'benzin' | 'umumiy' | null (ҳали танланмаган).
// profile.station 'both' бўлганларгина (CEO/директор) буни ўзгартира олади,
// бошқаларга логиндаёқ автоматик белгиланади.
let currentStation = null;

const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const pct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';
const todayISO = () => new Date().toISOString().slice(0,10);
const monthISO = (d) => d.slice(0,7)+'-01';
const toast = (msg) => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); };
const esc = s => (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// AUTH
// ============================================================
// Хавфсизлик учун: бир логин 5 соатдан кейин АВТОМАТИК чиқиб кетади —
// акс ҳолда кейинги оператор ўтган кишининг эски логида қолиб кетиши
// мумкин (умумий компьютер/телефонда).
const SESSION_MAX_MS = 5 * 60 * 60 * 1000;
function sessionExpired(){
  const t = Number(localStorage.getItem('mm_login_at'))||0;
  return t>0 && (Date.now()-t) > SESSION_MAX_MS;
}
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session && sessionExpired()){
    await sb.auth.signOut();
    renderLogin();
    document.getElementById('loginErr').textContent = '5 соатдан кейин автоматик чиқиб кетилди — қайта киринг';
  } else if(session){
    await afterLogin(session);
  } else {
    renderLogin();
  }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ localStorage.removeItem('mm_login_at'); state = {session:null, profile:null, companies:[],prices:[],taxRates:[],fixedCosts:[],prepayments:[],otherExpenses:[],entries:[],deliveries:[],payments:[],
      fuelTypes:[],fuelPrices:[],dispensers:[],benzinEntries:[],benzinCompanySales:[],benzinDeliveries:[],employees:[],employeeSalaries:[],gapLedger:[],entryEditLog:[]}; renderLogin(); }
  });

  // Очиқ турган саҳифада ҳам 5 соат тўлганда автоматик чиқариб юбориш
  // (саҳифани қайта юкламаса ҳам) — ҳар дақиқада текширади.
  setInterval(()=>{
    if(state.session && sessionExpired()){
      sb.auth.signOut().then(()=>{ toast("5 соатдан кейин автоматик чиқиб кетилди"); });
    }
  }, 60*1000);
}

// Операторлар учун ҳақиқий email очиш шарт эмас — "логин" (username)
// билан кирадилар. Ичкарида Supabase'нинг ўзи ҳамон email талаб қилади,
// шунинг учун "username" ни кўринмас тарзда "username@mangitmetan.local"
// қилиб юборамиз. Аккаунт очишда ҳам email ўрнига шу форматни ишлатинг.
const LOGIN_DOMAIN = '@mangitmetan.local';
function toLoginEmail(input){
  input = input.trim();
  return input.includes('@') ? input : (input.toLowerCase() + LOGIN_DOMAIN);
}
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="card login-card">
      <h1>Мангит Метан</h1>
      <p class="sub">Кунлик ҳисобот ва бошқарув тизими</p>
      <div class="field" style="text-align:left"><label>Логин</label><input type="text" id="loginEmail" autocapitalize="off" autocomplete="username"></div>
      <div class="field" style="text-align:left"><label>Парол</label><input type="password" id="loginPass"></div>
      <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Кириш</button>
      <p class="hint" id="loginErr" style="color:var(--bad)"></p>
    </div>`;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const email = toLoginEmail(document.getElementById('loginEmail').value);
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Текширилмоқда…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Кириш';
  if(error){ document.getElementById('loginErr').textContent = 'Логин ёки парол хато'; return; }
  localStorage.setItem('mm_login_at', String(Date.now()));
  await afterLogin(data.session);
}

async function doLogout(){
  await sb.auth.signOut();
}

async function afterLogin(session){
  state.session = session;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !profile){
    document.getElementById('app').innerHTML = `<div class="card login-card"><p>Ҳисобингиз ҳали ролга боғланмаган. CEO билан боғланинг.</p><button class="btn secondary" onclick="doLogout()">Чиқиш</button></div>`;
    return;
  }
  state.profile = profile;
  const station = profile.station || 'both';
  currentStation = (station === 'both') ? null : station; // 'both' -> танлов экранини кўрсатади
  await loadAll();
  renderShell();
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadAll(){
  const [companies, prices, taxRates, fixedCosts, prepayments, otherExpenses, entries, deliveries, payments,
    fuelTypes, fuelPrices, dispensers, benzinEntries, benzinCompanySales, benzinDeliveries,
    employees, employeeSalaries, gapLedger, entryEditLog] = await Promise.all([
    sb.from('companies').select('*').order('name'),
    sb.from('prices').select('*').order('effective_date'),
    sb.from('tax_rates').select('*').order('effective_date'),
    sb.from('fixed_costs').select('*').order('effective_date'),
    sb.from('prepayments').select('*').order('month', {ascending:false}),
    sb.from('other_expenses').select('*').order('date', {ascending:false}),
    sb.from('entries').select('*').order('date', {ascending:false}).limit(400),
    sb.from('deliveries').select('*, entries(price,date)'),
    sb.from('payments').select('*, entries(date)').order('created_at', {ascending:false}),
    sb.from('fuel_types').select('*').order('name'),
    sb.from('fuel_prices').select('*').order('effective_date'),
    sb.from('dispensers').select('*').order('sort_order'),
    sb.from('benzin_entries').select('*').order('date', {ascending:false}).limit(400),
    sb.from('benzin_company_sales').select('*'),
    sb.from('benzin_deliveries').select('*').order('date', {ascending:false}),
    sb.from('employees').select('*').order('full_name'),
    sb.from('employee_salaries').select('*').order('effective_date'),
    sb.from('gap_ledger').select('*').order('date', {ascending:false}),
    sb.from('entry_edit_log').select('*').order('edited_at', {ascending:false}),
  ]);
  state.companies = companies.data || [];
  state.prices = prices.data || [];
  state.taxRates = taxRates.data || [];
  state.fixedCosts = fixedCosts.data || [];
  state.prepayments = prepayments.data || [];
  state.otherExpenses = otherExpenses.data || [];
  state.entries = entries.data || [];
  state.deliveries = deliveries.data || [];
  state.payments = payments.data || [];
  state.fuelTypes = fuelTypes.data || [];
  state.fuelPrices = fuelPrices.data || [];
  state.dispensers = dispensers.data || [];
  state.benzinEntries = benzinEntries.data || [];
  state.benzinCompanySales = benzinCompanySales.data || [];
  state.benzinDeliveries = benzinDeliveries.data || [];
  state.employees = employees.data || [];
  state.employeeSalaries = employeeSalaries.data || [];
  state.gapLedger = gapLedger.data || [];
  state.entryEditLog = entryEditLog.data || [];
}

function priceFor(dateStr){
  let best = state.prices[0] || {sale_price:5500, cost_price:2750, excise:780, loss_coefficient:0.986};
  for(const p of state.prices){ if(p.effective_date <= dateStr) best = p; }
  return best;
}
function taxFor(dateStr){
  let best = state.taxRates[0] || {nds_rate:0.12, social_tax_rate:0.01, profit_tax_rate:0.075};
  for(const t of state.taxRates){ if(t.effective_date <= dateStr) best = t; }
  return best;
}
function fixedCostFor(dateStr, station){
  station = station || 'metan';
  const rows = state.fixedCosts.filter(f=> (f.station||'metan')===station );
  let best = rows[0] || {salary:0, bank_loan_interest:0, land_property_tax:0, electricity_tariff:0};
  rows.forEach(f=>{ if(f.effective_date <= dateStr) best = f; });
  return best;
}
function pumpBaseline(){
  if(state.entries.length){
    // entries loaded newest-first
    return state.entries[0].pump_end;
  }
  return SEED_PUMP_START;
}
// Компания қайси станция(лар)га тегишли — метан ва бензин мижозлари
// рўйхатда аралашиб кетмаслиги учун. 'both' — иккала жойда ҳам кўринади.
function companiesForStation(station){
  return state.companies.filter(c => (c.station||'both')==='both' || (c.station||'both')===station);
}
function companyTotals(station){
  const totals = {};
  const list = station ? companiesForStation(station) : state.companies;
  list.forEach(c=> totals[c.id] = { id:c.id, name:c.name, station:c.station||'both', m3:c.seed_m3||0, sold:c.seed_sold||0, paid:c.seed_paid||0 });
  state.deliveries.forEach(d=>{
    const t = totals[d.company_id]; if(!t) return;
    const price = (d.entries && d.entries.price) || 0;
    t.m3 += Number(d.m3)||0;
    t.sold += (Number(d.m3)||0) * price;
  });
  state.payments.forEach(p=>{
    const t = totals[p.company_id]; if(!t) return;
    t.paid += Number(p.amount)||0;
  });
  Object.values(totals).forEach(t => { t.balance = t.paid - t.sold; });
  return Object.values(totals);
}

// ============================================================
// SHELL / TABS
// ============================================================
// Ҳар бир станция (метан/бензин) ва "умумий ҳолат" учун алоҳида таб рўйхати —
// улар бир-бирига умуман аралашмайди. Оператор фақат ўзига рухсат берилган
// станциянинг табларини кўради (currentStation орқали ажратилади).
function tabsForRole(role, station){
  if(station === 'metan'){
    if(role === 'operator') return [['entry','📝 Кунлик ҳисобот'],['reports','📊 Ҳисоботлар'],['davlat','🏛 Давлат ҳисоботи'],['gap','💰 Фарқ фонди']];
    if(role === 'direktor') return [['overview','🏠 Умумий'],['reports','📊 Ҳисоботлар'],['davlat','🏛 Давлат ҳисоботи'],['gap','💰 Фарқ фонди'],['companies','🏢 Компаниялар'],['expenses','💸 Харажатлар'],['salaries','👥 Ойликлар']];

function recalcPreview(){
  const baseline = pumpBaseline();
  const pumps = PUMP_NAMES.map((_,i)=>{
    const el = document.getElementById('pump_'+i);
    return el ? parseFloat(el.value) : NaN;
  });
  let soldM3 = 0, ok = true;
  pumps.forEach((v,i)=>{ if(isNaN(v)){ ok=false; return; } soldM3 += (v - baseline[i]); });
  const date = document.getElementById('f_date').value || todayISO();
  const price = priceFor(date);
  const salesValue = ok ? soldM3 * price.sale_price : NaN;
  const uzcard = parseFloat(document.getElementById('f_uzcard').value)||0;
  const humo = parseFloat(document.getElementById('f_humo').value)||0;
  const qr = parseFloat(document.getElementById('f_qr').value)||0;
  const naqt = ok ? (salesValue - uzcard - humo - qr) : NaN;
  document.getElementById('calcSoldM3').textContent = ok ? fmt(soldM3)+' m3' : '—';
  document.getElementById('calcSalesValue').textContent = ok ? fmt(salesValue)+" сўм" : '—';
  const naqtEl = document.getElementById('calcNaqt');
  naqtEl.textContent = ok ? fmt(naqt)+" сўм" : '—';
  naqtEl.className = 'value ' + (naqt < 0 ? 'bad' : 'good');
  return {soldM3, salesValue, naqt, uzcard, humo, qr, price, ok};
}
function buildPumpFields(){
  const wrap = document.getElementById('pumpFields');
  const baseline = pumpBaseline();
  wrap.innerHTML = PUMP_NAMES.map((name,i)=>
    `<div class="field"><label>${name} (олдинги: ${fmt(baseline[i])})</label>
      <input type="number" id="pump_${i}" step="0.01" placeholder="ҳозирги кўрсаткич"></div>`).join('');
  wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcPreview));
}

// Gathers + validates the current form. Returns null (and toasts the
// problem) if something required is missing; otherwise returns everything
// needed both to render the review screen and to actually submit.
// Шу сана учун ҳисобот аллақачон бор-йўқлигини текшириш (дублика ёзувнинг
// олдини олиш учун — базада ҳам "date unique" чекланиши бор, бу фақат
// операторга ОЛДИНДАН, тушунарли хабар билан огоҳлантириш учун).
function entryExistsForDate(date, station){
  if(station==='benzin') return state.benzinEntries.some(e=>e.date===date);
  return state.entries.some(e=>e.date===date);
}
// Сана майдони ўзгарганда — шу кунга ҳисобот борми, йўқми, операторга
// ОЛДИНДАН (формани тўлдиришдан олдин) кўрсатиш учун.
function updateEntryDateWarning(station){
  const dateEl = document.getElementById(station==='benzin' ? 'bz_date' : 'f_date');
  const warnEl = document.getElementById(station==='benzin' ? 'bz_dateWarn' : 'f_dateWarn');
  if(!dateEl || !warnEl) return;
  const date = dateEl.value;
  if(date && entryExistsForDate(date, station)){
    warnEl.innerHTML = `<div class="review-warn" style="margin-top:8px">⚠ ${date} санасига ҳисобот АЛЛАҚАЧОН киритилган. Бу санани қайта юбориб бўлмайди — тўғри санани танланг ёки CEO'га мурожаат қилинг.</div>`;
  } else {
    warnEl.innerHTML = '';
  }
}
// Supabase'дан қайтган "duplicate key" хатосини операторга тушунарли
// ўзбекча хабарга айлантиради.
function friendlyDbError(error){
  if(error && (error.code==='23505' || /duplicate key|already exists/i.test(error.message||''))){
    return "Бу санага ҳисобот АЛЛАҚАЧОН киритилган — қайта юбориб бўлмайди. Агар хато бўлса, CEO'дан эски ёзувни тузатишни сўранг.";
  }
  return "Хатолик: " + ((error && error.message) || 'сақланмади');
}
function collectEntryForm(){
  const date = document.getElementById('f_date').value;
  const operator = document.getElementById('f_operator').value.trim();
  if(!date || !operator){ toast("Сана ва оператор исмини киритинг"); return null; }
  if(entryExistsForDate(date, 'metan')){ toast("Бу санага ҳисобот аллақачон киритилган — бошқа сана танланг ёки CEO'га мурожаат қилинг"); return null; }
  const calc = recalcPreview();
  if(!calc.ok){ toast("Барча помпа кўрсаткичларини киритинг"); return null; }
  const agres = parseFloat(document.getElementById('f_agres').value);
  if(isNaN(agres)){ toast("Агрес кўрсаткичини киритинг"); return null; }
  const baseline = pumpBaseline();
  const pumpEnd = PUMP_NAMES.map((_,i)=>parseFloat(document.getElementById('pump_'+i).value));
  const izoh = document.getElementById('f_izoh').value.trim() || null;
  return { date, operator, calc, agres, pumpEnd, baseline, izoh };
}

// Step 1: operator hits "Текшириш ва юбориш" -> validate, then show a
// read-only summary of everything that's about to be saved. Nothing is
// written to the database yet. Operator must tick the confirm box before
// the real submit button becomes clickable, and can still go back and
// edit any field first.

  const f = collectEntryForm();
  if(!f) return;

  const pumpRows = PUMP_NAMES.map((name,i)=>
    `<div class="review-row"><span class="k">${name}</span><span>${fmt(f.baseline[i])} → <b>${fmt(f.pumpEnd[i])}</b> (${fmt(f.pumpEnd[i]-f.baseline[i])} m3)</span></div>`

  const html = `
  <div class="overlay" id="reviewOverlay">
    <div class="review-box">
      <h2>Юборишдан олдин текширинг</h2>
      <p class="hint">Ҳамма рақамни диққат билан ўқиб чиқинг. Юборилгандан кейин фақат CEO тузата олади — шунинг учун хато бўлса ҳозир орқага қайтиб тузатинг.</p>

      <div class="review-section">
        <h3>Умумий</h3>
        <div class="review-row"><span class="k">Сана</span><span><b>${f.date}</b></span></div>
        <div class="review-row"><span class="k">Оператор</span><span><b>${esc(f.operator)}</b></span></div>
      </div>

      <div class="review-section">
        <h3>Помпалар (олдинги → ҳозирги)</h3>
        ${pumpRows}
        <div class="review-row" style="margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span class="k">Жами сотилган</span><span><b>${fmt(f.calc.soldM3)} m3</b></span></div>
        <div class="review-row"><span class="k">Агрес кўрсаткичи</span><span><b>${fmt(f.agres)} m3</b></span></div>
      </div>

      <div class="review-section">
        <h3>Тўловлар</h3>
        <div class="review-row"><span class="k">Сотув суммаси</span><span><b>${fmt(f.calc.salesValue)} сўм</b></span></div>
        <div class="review-row"><span class="k">UZCARD</span><span>${fmt(f.calc.uzcard)} сўм</span></div>
        <div class="review-row"><span class="k">HUMO</span><span>${fmt(f.calc.humo)} сўм</span></div>
        <div class="review-row"><span class="k">QR</span><span>${fmt(f.calc.qr)} сўм</span></div>
        <div class="review-row"><span class="k">Нақт (автоматик)</span><span><b>${fmt(f.calc.naqt)} сўм</b></span></div>
      </div>

      <div class="review-section">
        <h3>Компанияларга берилган газ</h3>
        ${delRows}
      </div>

      ${f.izoh ? `<div class="review-section"><h3>Изоҳ</h3><p style="font-size:.9rem">${esc(f.izoh)}</p></div>` : ''}

      ${gapWarn}

      <label style="display:flex;gap:6px;align-items:center;margin:16px 0 10px"><input type="checkbox" id="review_confirm" style="width:auto" onchange="document.getElementById('reviewSubmitBtn').disabled=!this.checked"> Юқоридаги маълумотларнинг ҳаммасини текширдим, тўғри деб тасдиқлайман</label>

      <div class="row">
        <button class="btn secondary" style="flex:1" onclick="closeReview()">← Ортга (таҳрирлаш)</button>
        <button class="btn" id="reviewSubmitBtn" style="flex:1" disabled onclick="doSubmitEntry()">Тасдиқлаш ва юбориш</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeReview(){
  const el = document.getElementById('reviewOverlay');
  if(el) el.remove();
}

// Step 2: only runs after the operator ticked the confirm box on the
// review screen. This is the actual database write.
async function doSubmitEntry(){
  const f = collectEntryForm();
  if(!f){ closeReview(); return; }

  if(trainingMode){
    closeReview();
    toast("🎓 Машқ якунланди — бу ҳеч нарса базага ёзилмади");
    pending = {deliveries:[]};
    renderTab();
    return;
  }

  const btn = document.getElementById('reviewSubmitBtn');
  btn.disabled = true; btn.textContent = 'Юборилмоқда…';
  try{
    const { data: entryRow, error } = await sb.from('entries').insert({
      date: f.date, operator_id: state.profile.id, operator_name: f.operator,
      pump_end: f.pumpEnd, agres: f.agres,
      uzcard: f.calc.uzcard, humo: f.calc.humo, qr: f.calc.qr,
      sold_m3: f.calc.soldM3, sales_value: f.calc.salesValue, naqt: f.calc.naqt,
      price: f.calc.price.sale_price,
      izoh: f.izoh
    }).select().single();
    if(error) throw error;

    if(pending.deliveries.length){
      const rows = pending.deliveries.map(d=>({entry_id: entryRow.id, company_id: d.company_id, m3: d.m3}));
      const { error: e2 } = await sb.from('deliveries').insert(rows);
      if(e2) throw e2;
    }

    closeReview();
    toast("Ҳисобот юборилди ✓");
    pending = {deliveries:[]};
    await loadAll();
    renderTab();
  }catch(e){
    toast(friendlyDbError(e));
    btn.disabled = false; btn.textContent = 'Тасдиқлаш ва юбориш';
    await loadAll();
  }
}

function currentMonthKey(){ return todayISO().slice(0,7); }

// Full monthly profit & loss for one calendar month (yyyy-mm).
// Every line is shown separately in renderPL() so the CEO/Direktor can
// verify each number against the source data - this is an ESTIMATE built
// from the entered rates, not a substitute for the accountant's own
// bookkeeping (NDS/tax math in particular is simplified).
// Matches the company's own official monthly report format exactly
// (Даромадлар / Харажатлар / Солиқлар / Фойда), verified line-by-line
// against a real submitted "МАНГИТ МЕТАН" hisobot:
//   Фойда = Даромад − Харажатлар(Газ+Электр+Иш ҳақи+Банк+Бошқа)
//           − Акциз − НДС(нетто) − Ижтимоий солиқ − Ер-мулк солиғи
//   Фойда солиғи = Фойда × ставка (ижтимоий солиқ АЛЛАҚАЧОН айирилган
//   бўлгандан кейин ҳисобланади)
//   Соф фойда = Фойда − Фойда солиғи
function computeMonthlyPL(monthStr){
  const monthEntries = state.entries.filter(e=> e.date && e.date.slice(0,7)===monthStr);
  let revenue=0, soldM3Total=0, agresTotal=0;
  monthEntries.forEach(e=>{
    revenue += Number(e.sales_value)||0;
    soldM3Total += Number(e.sold_m3)||0;
    agresTotal += Number(e.agres)||0;
  });
  // Narx (taннарх/акциз) o'zgargan bo'lishi mumkin oy ichida — shuning
  // uchun oyning ohirgi kunidagi ставкаdan foydalanamiz (rasmiy hisobot
  // ham bir oyga bitta ставка bilan ishlaydi).
  const pr = priceFor(monthStr+'-28');
  // Таннарх — таъминотчидан қанча газ СОТИБ ОЛИНГАНИ (Агрес, давлат
  // ҳисоблагичи) асосида — эски расмий ҳисоботдаги каби (пумпадан
  // сотилган m3 эмас).
  const cogsGas = agresTotal * pr.cost_price;
  // Акциз — сотилган (пумпа) m3'дан олинадиган солиқ.
  const excise = soldM3Total * pr.excise;

  const fc = fixedCostFor(monthStr+'-01');
  // Электр учун Агрес каби "аниқ истеъмол" ўлчагичи йўқ (газдан фарқли
  // равишда) — шунинг учун электр харажати сифатида шу ойда ТЎЛАНГАН
  // препеймент (Ток) суммасининг ўзи олинади. Агар шу ой учун препеймент
  // ёзуви бўлмаса (тарихий ойлар), Созламалардаги қўлда киритилган
  // ойлик жами қиймат fallback сифатида ишлатилади.
  const prepayGaz = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='gaz').reduce((s,p)=>s+Number(p.amount||0),0);
  const prepayTok = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='tok').reduce((s,p)=>s+Number(p.amount||0),0);
  const electricity = prepayTok || Number(fc.electricity_tariff)||0;
  // Иш ҳақи — ХОДИМЛАР рўйхатидан (ҳар бирининг ойлиги алоҳида, тарихи
  // билан) ҳисобланади. Агар ҳали ходим киритилмаган бўлса (масалан эски
  // импорт қилинган ойлар), эски Доимий харажатлардаги якка рақамга
  // fallback қилинади.
  const salary = totalSalaryFor(monthStr, 'metan') || Number(fc.salary)||0;
  const bank = Number(fc.bank_loan_interest)||0;
  const land = Number(fc.land_property_tax)||0;
  const otherExp = state.otherExpenses.filter(e=>e.date && e.date.slice(0,7)===monthStr && (e.station||'metan')==='metan').reduce((s,e)=>s+Number(e.amount||0),0);
  const expensesTotal = cogsGas + electricity + salary + bank + otherExp;

  const tax = taxFor(monthStr+'-01');
  const ndsRate = Number(tax.nds_rate)||0;
  const outputVat = revenue * (ndsRate/(1+ndsRate));
  const inputVat = (cogsGas + electricity) * (ndsRate/(1+ndsRate));
  const ndsNet = outputVat - inputVat;
  const socialAmount = salary * (Number(tax.social_tax_rate)||0);

  const profitBeforeTax = revenue - expensesTotal - excise - ndsNet - socialAmount - land;
  const profitTaxAmount = Math.max(profitBeforeTax, 0) * (Number(tax.profit_tax_rate)||0);
  const netProfit = profitBeforeTax - profitTaxAmount;

  return { count: monthEntries.length, revenue, cogsGas, electricity, salary, bank, land, otherExp, expensesTotal,
    excise, outputVat, inputVat, ndsNet, socialAmount, profitBeforeTax, tax, profitTaxAmount, netProfit,
    prepayGaz, prepayTok };
}

// Станция учун сўнгги 12 ойнинг даромад/фойда рўйхати — "хоҳлаган ойда
// қанча даромад қилганимизни" бир қарашда кўриш учун (чартдан ташқари,
// аниқ рақамлар билан).
function monthlyRevenueRows(station){
  const src = station==='benzin' ? state.benzinEntries : state.entries;
  const months = [...new Set(src.map(e=>e.date && e.date.slice(0,7)).filter(Boolean))].sort().slice(-12).reverse();
  return months.map(m=>{
    if(station==='benzin'){
      const pl = computeBenzinMonthlyPL(m);
      return { month: m, revenue: pl.revenue, netProfit: pl.netProfit };
    }
    const pl = computeMonthlyPL(m);
    return { month: m, revenue: pl.revenue, netProfit: pl.netProfit };
  });
}

// CHARTS — small inline-SVG bar/line charts, no external library.
// Single series each, so no legend needed (title names the series);
// axis/grid stay muted, the mark itself carries the accent color.
// ============================================================
function monthlySalesSeries(){
  const byMonth = {};
  state.entries.forEach(e=>{
    if(!e.date) return;
    const m = e.date.slice(0,7);
    byMonth[m] = (byMonth[m]||0) + (Number(e.sales_value)||0);
  });
  const months = Object.keys(byMonth).sort().slice(-12);
  return months.map(m=>({label:m.slice(2), value:byMonth[m]}));
}
function dailySoldSeries(){
  return state.entries.slice(0,30).slice().reverse()
    .map(e=>({label:e.date.slice(5), value:Number(e.sold_m3)||0}));
}
function svgBarChart(points, opts={}){
  const w=760,h=200,padL=54,padR=12,padT=10,padB=28;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  if(!points.length) return `<p class="empty">Маълумот йўқ</p>`;
  const max = Math.max(...points.map(p=>p.value), 1);
  const bw = innerW/points.length;
  const bars = points.map((p,i)=>{
    const bh = max>0 ? (p.value/max)*innerH : 0;
    const x = padL + i*bw + bw*0.15;
    const y = padT + innerH - bh;
    const bwReal = bw*0.7;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwReal.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="var(--accent)"><title>${esc(p.label)}: ${fmt(p.value)}${opts.unit||''}</title></rect>`;
  }).join('');
  const labels = points.map((p,i)=>{
    if(points.length>8 && i%2!==0) return '';
    const x = padL + i*bw + bw/2;
    return `<text x="${x.toFixed(1)}" y="${h-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(p.label)}</text>`;
  }).join('');
  const gridY = padT + innerH;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <line x1="${padL}" y1="${gridY}" x2="${w-padR}" y2="${gridY}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-6}" y="${padT+4}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(max)}</text>
    ${bars}${labels}
  </svg>`;
}
function svgLineChart(points, opts={}){
  const w=760,h=200,padL=54,padR=12,padT=10,padB=28;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  if(!points.length) return `<p class="empty">Маълумот йўқ</p>`;
  const max = Math.max(...points.map(p=>p.value), 1);
  const step = points.length>1 ? innerW/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = padL + i*step;
    const y = padT + innerH - (max>0 ? (p.value/max)*innerH : 0);
    return {x,y,p};
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+' '+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="var(--accent)"><title>${esc(c.p.label)}: ${fmt(c.p.value)}${opts.unit||''}</title></circle>`).join('');
  const labels = coords.map((c,i)=>{
    if(points.length>10 && i%3!==0) return '';
    return `<text x="${c.x.toFixed(1)}" y="${h-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(c.p.label)}</text>`;
  }).join('');
  const gridY = padT + innerH;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <line x1="${padL}" y1="${gridY}" x2="${w-padR}" y2="${gridY}" stroke="var(--border)" stroke-width="1"/>
    <text x="${padL-6}" y="${padT+4}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(max)}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}
function renderOverviewCharts(){
  const mBox = document.getElementById('chartMonthly');
  const dBox = document.getElementById('chartDaily');
  if(mBox) mBox.innerHTML = svgBarChart(monthlySalesSeries(), {unit:' сўм'});
  if(dBox) dBox.innerHTML = svgLineChart(dailySoldSeries(), {unit:' m3'});

function startEditEntry(id){
  const e = state.entries.find(x=>x.id===id);

  area.innerHTML = `<div class="card" style="margin-top:8px;background:#fffbe6">

async function saveEntryEdit(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  const updates = {};
  const logRows = [];
  ENTRY_EDIT_FIELDS.forEach(([key])=>{
    const el = document.getElementById('ee_'+key);
    if(!el) return;
    let newVal = key==='izoh' ? el.value.trim() : parseFloat(el.value);
    if(key==='izoh' && newVal==='') newVal = null;
    const oldVal = e[key];
    const changed = key==='izoh' ? (String(oldVal||'') !== String(newVal||'')) : (Number(oldVal||0) !== Number(newVal||0));
    if(changed){
      updates[key] = newVal;
      logRows.push({ station:'metan', entry_id:id, entry_date:e.date, field_name:key, old_value: oldVal==null?'':String(oldVal), new_value: newVal==null?'':String(newVal), edited_by_name: state.profile.full_name });
    }
  });
  if(!Object.keys(updates).length){ toast("Ҳеч нарса ўзгармади"); document.getElementById('entryEditArea').innerHTML=''; return; }
  const { error } = await sb.from('entries').update(updates).eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  if(logRows.length){
    await sb.from('entry_edit_log').insert(logRows);

  renderTab();
  document.getElementById('rep_date').value = e.date;
  renderReportDetail();
}
async function deleteEntry(id){
  if(!confirm("Бу кунлик ҳисоботни бутунлай ўчирасизми? (унга боғлиқ етказиб бериш/тўловлар ҳам ўчади)")) return;
  const { error } = await sb.from('entries').delete().eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ўчирилди ✓");
  await loadAll();
  document.getElementById('rep_date').value = '';
  renderTab();
}

// ============================================================
// DAVLAT ҲИСОБОТИ — state/regulator-facing report
// ------------------------------------------------------------
// Same formula as the old Excel's DAVLAT_HISOBOT sheet: the internal
// (ICHKI) numbers are built from the pump totals, but the state gas
// meter is the Агрес counter, and the meter reading is corrected by a
// fixed "loss coefficient" (0.986 historically -> Созламалар / Нарх
// тарихи) before it's reported. UZCARD/HUMO and company deliveries
// carry over unchanged; "Терминал" is the balancing cash figure that
// makes the state-side numbers add up to the state-side sold volume.
// Nothing here is stored separately -- it's all computed on the fly
// from entries + deliveries, exactly like the old sheet computed it
// from ICHKI_HISOBOT with formulas.
// ============================================================
function computeDavlatRow(e, companyM3, companySum){
  const lossCoef = priceFor(e.date).loss_coefficient || 0.986;
  const stateSoldM3 = Number(e.agres||0) * lossCoef;
  const humo = Number(e.humo)||0;
  const uzcard = Number(e.uzcard)||0;
  const stateRevenue = stateSoldM3 * Number(e.price||0);
  const terminal = stateRevenue - humo - uzcard - companySum;
  const totalRevenue = humo + uzcard + terminal + companySum;
  return { lossCoef, stateSoldM3, humo, uzcard, companyM3, companySum, terminal, totalRevenue };
}
function tplDavlat(){
  return `
  <div class="card group-tax">
    <div class="section-title"><h2>Давлат ҳисоботи</h2></div>
    <p class="hint">Бу — давлат (газ таъминоти) ҳисоботига мос рақамлар. Ички ҳисобот помпа кўрсаткичига асосланади, давлат ҳисоботи эса Агрес (давлат ҳисоблагичи) кўрсаткичига йўқотиш коэффициентини қўллаб ҳисобланади (Созламалар → Нарх тарихида созланади). "Терминал" — қолган суммани мувозанатлаш учун ҳисобланадиган устун.</p>
    <div class="row">
      <div class="field"><label>Ой</label><input type="month" id="dh_month" value="${currentMonthKey()}"></div>
    </div>
    <div id="dhDetail"></div>
  </div>`;
}

  const monthStr = document.getElementById('dh_month').value || currentMonthKey();
  const rows = state.entries.filter(e=> e.date && e.date.slice(0,7)===monthStr).slice().sort((a,b)=> a.date.localeCompare(b.date));

  const totals = computed.reduce((t,r)=>({
    stateSoldM3: t.stateSoldM3+r.stateSoldM3, humo: t.humo+r.humo, uzcard: t.uzcard+r.uzcard,

      <td>${fmt(totals.companyM3)}</td><td>${fmt(totals.companySum)}</td><td>${fmt(totals.terminal)}</td><td>${fmt(totals.totalRevenue)}</td>

// ============================================================
// ФАРҚ ФОНДИ — ҳисоблагич (Агрес) билан помпадан сотилган m3 орасидаги
// кунлик фарқ (сўмда) йиғилиб борадиган ҳисоб. 2026-10-01дан бошланади
// (ундан олдинги ойлар ҳисобга олинмайди — шундай сўралган).
// Ҳар кун: фарқ = (сотилган m3 − Агрес) × нарх.
//   Агар сотилган > Агрес → МУСБАТ (қўшилади, ортиқча нақд пайдо бўлган)
//   Агар Агрес > сотилган → МАНФИЙ (айрилади, камомад)
// Шунга қўшимча: оператор кунлик харажат ёзса ёки CEO ўзи ечиб олса —
// gap_ledger'га ёзилади ва ШУ йиғиндидан АЙРИЛАДИ.
// ============================================================
const GAP_START_DATE = '2026-10-01';
function gapDailyRows(){
  // Давлат ҳисоботида Агрес кўрсаткичи YЙЎҲ эмас, балки йўқотиш коэффициентига
  // кўпайтирилган ҳолда (stateSoldM3 = agres * lossCoef) соликка тортилади —
  // шу сабабли фарқ ҳам шу "давлат тан олган" рақамга нисбатан ҳисобланади,
  // хом Агреснинг ўзига нисбатан эмас.
  return state.entries
    .filter(e=>e.date && e.date >= GAP_START_DATE)
    .map(e=>{
      const lossCoef = priceFor(e.date).loss_coefficient || 0.986;
      const stateSoldM3 = Number(e.agres||0) * lossCoef;
      const amount = (Number(e.sold_m3||0) - stateSoldM3) * Number(e.price||0);
      return { date: e.date, amount, operator: e.operator_name };
    })
    .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
}
function gapWithdrawalRows(){
  return state.gapLedger.filter(g=>g.date>=GAP_START_DATE);
}
// Жорий йиғинди (барча кунлик фарқлар − барча ечиб олинганлар).
function gapBalance(){
  const credit = gapDailyRows().reduce((s,r)=>s+r.amount, 0);
  const debit = gapWithdrawalRows().reduce((s,r)=>s+Number(r.amount||0), 0);
  return credit - debit;
}

  </div>
  ${canWrite ? `
  <div class="card group-settings">
    <h2>${role==='ceo'?'CEO — ечиб олиш / сарфлаш':'Харажат ёзиш'}</h2>

// ============================================================
// Balance tiers — the further below zero, the more urgent the reminder
// to contact the company about topping up. Thresholds per CEO's request:
// < 200k = red (urgent), < 500k = orange, < 1.5mln = yellow (watch),
// >= 1.5mln = green (fine). A negative balance (company owes money) is
// always red regardless of these thresholds.
function balanceTier(bal){
  if(bal < 200000) return 'bad';
  if(bal < 500000) return 'orange';
  if(bal < 1500000) return 'warn';
  return 'good';
}
function balanceLabel(bal){
  if(bal < 0) return 'Қарздор!';
  if(bal < 200000) return 'Жуда кам қолди';
  if(bal < 500000) return 'Кам қолмоқда';
  if(bal < 1500000) return 'Кузатиб туринг';
  return 'Яхши';
}

async function addCompanyPayment(){
  const companyId = document.getElementById('cp_company').value;
  const amount = parseFloat(document.getElementById('cp_amount').value);
  const date = document.getElementById('cp_date').value || todayISO();
  if(!companyId || !amount){ toast("Компания ва суммани киритинг"); return; }
  const { error } = await sb.from('payments').insert({
    company_id: companyId, amount, date,
    note: document.getElementById('cp_note').value.trim() || null,
    created_by_name: state.profile.full_name
  });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Баланс янгиланди ✓");
  await loadAll(); renderTab();
}

  toast("Ўчирилди ✓");

// БЕНЗИН — алоҳида модуль (метандан фарқли: калонкалар кўп маҳсулот
// сота олади, физик заҳира бор, ёқилғи тури кўпайиши мумкин).
// Компаниялар (companies) жадвали МЕТАН БИЛАН БИР ХИЛ — бир компания
// ҳам газ, ҳам бензин олиши мумкин, баланси умумий ҳисобланади.
// ============================================================
function fuelTypeName(id){ return (state.fuelTypes.find(f=>f.id===id)||{}).name || '—'; }
// Тўлиқ нарх қатори (сотув/таннарх/акциз) — ойлик ҳисоб-китоб учун.
function fuelPriceRowFor(fuelTypeId, dateStr){
  const rows = state.fuelPrices.filter(p=>p.fuel_type_id===fuelTypeId);
  let best = rows[0] || {sale_price:0, cost_price:0, excise:0};
  rows.forEach(p=>{ if(p.effective_date <= dateStr) best = p; });
  return best;
}
function fuelPriceFor(fuelTypeId, dateStr){ return fuelPriceRowFor(fuelTypeId, dateStr).sale_price; }
// Бугунги санагача бўлган энг сўнгги ёзувдаги шу калонканинг кўрсаткичи —
// метандаги pumpBaseline() билан бир хил мантиқ.
function dispenserBaseline(dispenserId){
  for(const e of state.benzinEntries){
    const r = (e.readings||{})[dispenserId];
    if(r !== undefined && r !== null) return Number(r);
  }
  return 0;
}
// Барча кунлар бўйича хронологик тартибда сотилган литрни ҳисоблайди
// (ҳар калонка учун кетма-кет фарқ), кейин ёқилғи тури бўйича жамлайди.
// Заҳира (стоk) ва ойлик/умумий ҳисоботлар шундан фойдаланади.
function benzinComputeAll(){
  const asc = state.benzinEntries.slice().sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const lastReading = {};
  const result = {};
  asc.forEach(e=>{
    const soldByFuel = {};
    let revenue = 0;
    state.dispensers.forEach(d=>{
      const reading = (e.readings||{})[d.id];
      if(reading === undefined || reading === null) return;
      const r = Number(reading);
      const prev = lastReading[d.id] !== undefined ? lastReading[d.id] : r;
      const sold = r - prev;
      if(d.fuel_type_id) soldByFuel[d.fuel_type_id] = (soldByFuel[d.fuel_type_id]||0) + sold;
      lastReading[d.id] = r;
    });
    Object.keys(soldByFuel).forEach(ftId=>{ revenue += soldByFuel[ftId] * fuelPriceFor(ftId, e.date); });
    result[e.id] = { soldByFuel, revenue };
  });
  return result;
}
function benzinStockSummary(){
  const calc = benzinComputeAll();
  const soldTotals = {}; // fuelTypeId -> jami sotilgan litr
  Object.values(calc).forEach(c=>{
    Object.keys(c.soldByFuel).forEach(ftId=>{ soldTotals[ftId] = (soldTotals[ftId]||0) + c.soldByFuel[ftId]; });
  });
  const deliveredTotals = {};
  state.benzinDeliveries.forEach(d=>{ deliveredTotals[d.fuel_type_id] = (deliveredTotals[d.fuel_type_id]||0) + Number(d.liters); });
  return state.fuelTypes.map(ft=>{
    const delivered = deliveredTotals[ft.id]||0, sold = soldTotals[ft.id]||0;
    return { fuelType: ft, delivered, sold, balance: delivered - sold };
  });
}

// ФИФО (аввал келган — аввал сотилган) таннарх ҳисоби: ҳар бир ЕТКАЗИБ
// БЕРИШ (benzin_deliveries) ўзининг ҳақиқий таннархи (total_sum/liters)
// билан "партия" сифатида сақланади, ва сотилган литрлар хронологик
// тартибда ЭНГ ЭСКИ партиядан бошлаб "ейилади". Шунда, масалан, эски
// қолдиқ 9 000 сўм/литрдан, кейин келган янги партия 8 800 сўм/литрдан
// ҳисобланади — иккаласи АРАЛАШТИРИЛМАЙДИ. Таннархи қоғозда йўқ партия
// (яъни накладной топилмаган кун) учун ёки партиялар тугаб қолса,
// Созламалардаги жорий таннарх қиймати захира сифатида ишлатилади.
// Ҳар бир ФИФО "олиш" ҳаракати шу ерга ёзилади (benzinFifoCogs() чақирилганда
// қайта тўлдирилади) — ойлик ҳисоботда "қайси партиядан қанча сотилди"
// шаффофлигини кўрсатиш учун (пастга қаранг: benzinMonthlyBatchBreakdown).
let FIFO_BATCH_EVENTS = [];
function benzinFifoCogs(){
  FIFO_BATCH_EVENTS = [];
  const batchesByFuel = {};
  state.benzinDeliveries.slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))
    .forEach(d=>{
      const ftId = d.fuel_type_id;
      if(!batchesByFuel[ftId]) batchesByFuel[ftId] = [];
      const liters = Number(d.liters)||0;
      const totalSum = Number(d.total_sum)||0;
      const costPerLiter = (totalSum > 0 && liters > 0) ? (totalSum/liters) : null;
      batchesByFuel[ftId].push({ date: d.date, remaining: liters, costPerLiter });
    });
  const calc = benzinComputeAll();
  const asc = state.benzinEntries.slice().sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const cogsByEntry = {};
  asc.forEach(e=>{
    const c = calc[e.id];
    if(!c) return;
    const byFuel = {};
    let totalCogs = 0;
    Object.keys(c.soldByFuel).forEach(ftId=>{
      let need = c.soldByFuel[ftId];
      let cost = 0;
      const batches = batchesByFuel[ftId] || [];
      for(const b of batches){
        if(need <= 0) break;
        if(b.remaining <= 0) continue;
        const take = Math.min(b.remaining, need);
        const cpl = (b.costPerLiter != null) ? b.costPerLiter : fuelPriceRowFor(ftId, b.date).cost_price;
        cost += take * cpl;
        b.remaining -= take;
        need -= take;
        FIFO_BATCH_EVENTS.push({ entryDate: e.date, ftId, batchDate: b.date, costPerLiter: cpl, liters: take, cost: take*cpl });
      }
      if(need > 0){
        // Партиялар тугади / ёзилмаган — жорий (созламадаги) таннархдан фойдаланамиз.
        const cpl = fuelPriceRowFor(ftId, e.date).cost_price;
        cost += need * cpl;
        FIFO_BATCH_EVENTS.push({ entryDate: e.date, ftId, batchDate: null, costPerLiter: cpl, liters: need, cost: need*cpl });
      }
      byFuel[ftId] = { liters: c.soldByFuel[ftId], cogs: cost };
      totalCogs += cost;
    });
    cogsByEntry[e.id] = { byFuel, totalCogs };
  });
  return cogsByEntry;
}

// Шаффофлик учун: шу ойда сотилган таннарх АЙНАН ҚАЙСИ партия(лар)дан
// йиғилганини кўрсатади (ёқилғи тури бўйича, партия санаси ва нархи
// билан). Бир ой ичида эски ва янги партиядан аралаш сотилиши мумкин —
// шуни ОЧИҚ кўрсатади, "ўртача" рақам ортида яшириб қўймайди.
function benzinMonthlyBatchBreakdown(monthStr){
  benzinFifoCogs(); // FIFO_BATCH_EVENTS'ни жорий маълумот асосида тўлдиради
  const monthEvents = FIFO_BATCH_EVENTS.filter(ev => ev.entryDate && ev.entryDate.slice(0,7)===monthStr);
  const grouped = {};
  monthEvents.forEach(ev=>{
    const key = ev.ftId + '|' + (ev.batchDate || 'joriy');
    if(!grouped[key]) grouped[key] = { ftId: ev.ftId, batchDate: ev.batchDate, costPerLiter: ev.costPerLiter, liters: 0, cost: 0 };
    grouped[key].liters += ev.liters;
    grouped[key].cost += ev.cost;
  });
  return Object.values(grouped)
    .map(g => ({ ...g, fuelName: fuelTypeName(g.ftId) }))
    .sort((a,b)=> a.fuelName===b.fuelName ? (a.batchDate||'9999').localeCompare(b.batchDate||'9999') : a.fuelName.localeCompare(b.fuelName));
}

// Бензиннинг ойлик "қанча реал даромад қолиши" ҳисоби. МУҲИМ ЧЕКЛОВ:
// бу фақат бензиннинг ЎЗИГА тегишли рақамлар (сотув − таннарх − акциз −
// НДС нетто) — яъни ЯЛПИ фойда. Иш ҳақи, электр, банк, ер-мулк солиғи каби
// умумий компания харажатлари бу ҳисобга КИРМАЙДИ, чунки улар метан ва
// бензин орасида қандай тақсимланиши ҳозирча аниқ эмас (иккала бизнес ҳам
// бир компания, бир жамоа) — шуларни қандай бўлишни айтсангиз, "Соф фойда"
// қаторини ҳам қўшамиз.
function computeBenzinMonthlyPL(monthStr){
  const calc = benzinComputeAll();
  const fifoCogs = benzinFifoCogs();
  const monthEntries = state.benzinEntries.filter(e=> e.date && e.date.slice(0,7)===monthStr);
  let revenue = 0;
  const soldByFuel = {};
  let cogs = 0;
  const cogsByFuel = {};
  monthEntries.forEach(e=>{
    const c = calc[e.id];
    if(!c) return;
    revenue += c.revenue;
    Object.keys(c.soldByFuel).forEach(ftId=>{ soldByFuel[ftId] = (soldByFuel[ftId]||0) + c.soldByFuel[ftId]; });
    const fc = fifoCogs[e.id];
    if(fc){
      cogs += fc.totalCogs;
      Object.keys(fc.byFuel).forEach(ftId=>{ cogsByFuel[ftId] = (cogsByFuel[ftId]||0) + fc.byFuel[ftId].cogs; });
    }
  });

  let excise = 0;
  const byFuelRows = Object.keys(soldByFuel).map(ftId=>{
    const row = fuelPriceRowFor(ftId, monthStr+'-28');
    const liters = soldByFuel[ftId];
    excise += liters * row.excise;
    // ФИФОдан келиб чиққан шу ойдаги ЎРТАЧА таннарх (кўрсатиш учун; ҳисобда cogs тўғридан-тўғри ишлатилади)
    const costPrice = liters>0 ? (cogsByFuel[ftId]||0)/liters : row.cost_price;
    return { name: fuelTypeName(ftId), liters, costPrice, excise: row.excise };
  });

  const fcBenzin = fixedCostFor(monthStr+'-01', 'benzin');
  const electricity = Number(fcBenzin.electricity_tariff)||0;
  const salary = totalSalaryFor(monthStr, 'benzin');
  const otherExp = state.otherExpenses.filter(e=>e.date && e.date.slice(0,7)===monthStr && (e.station||'metan')==='benzin').reduce((s,e)=>s+Number(e.amount||0),0);
  const expensesTotal = electricity + salary + otherExp;

  const tax = taxFor(monthStr+'-01');
  const ndsRate = Number(tax.nds_rate)||0;
  const outputVat = revenue * (ndsRate/(1+ndsRate));
  // НДС кирими — РАСМИЙ қоида бўйича ТТН (харид) ҚАЙСИ ОЙГА тегишли бўлса,
  // шу ойга ёзилади — товар қачон сотилганига боғлиқ эмас. Шунинг учун
  // таннарх (cogs, ФИФО — сотилган ойга боғлиқ, фойда ҳисоби учун тўғри)
  // билан НДС кирими (харид ойига боғлиқ, солиқ қоидаси учун тўғри) ОНГЛИ
  // равишда АЖРАТИЛГАН — булар баъзан турли сон бўлиши мумкин, бу хато эмас.
  const monthlyPurchases = state.benzinDeliveries
    .filter(d=>d.date && d.date.slice(0,7)===monthStr)
    .reduce((s,d)=>s+(Number(d.total_sum)||0),0);
  const inputVat = (monthlyPurchases + electricity) * (ndsRate/(1+ndsRate));
  const ndsNet = outputVat - inputVat;
  const socialAmount = salary * (Number(tax.social_tax_rate)||0);

  const grossProfit = revenue - cogs - excise - ndsNet;
  const profitBeforeTax = grossProfit - electricity - salary - otherExp - socialAmount;
  const profitTaxAmount = Math.max(profitBeforeTax, 0) * (Number(tax.profit_tax_rate)||0);
  const netProfit = profitBeforeTax - profitTaxAmount;

  return { count: monthEntries.length, revenue, byFuelRows, cogs, excise, outputVat, inputVat, ndsNet, grossProfit,
    electricity, salary, otherExp, expensesTotal, socialAmount, profitBeforeTax, profitTaxAmount, netProfit, tax,
    monthlyPurchases };
}
function renderBenzinPL(){
  const monthStr = document.getElementById('bpl_month').value || currentMonthKey();
  const pl = computeBenzinMonthlyPL(monthStr);
  const box = document.getElementById('bplDetail');
  if(!box) return;
  const row = (label, value, opts={}) => `<div class="pl-row${opts.bold?' pl-bold':''}${opts.indent?' pl-indent':''}"><span>${label}</span><span class="${opts.cls||''}">${value}</span></div>`;
  const zeroExcise = pl.byFuelRows.some(r=>r.excise===0);
  const batchRows = benzinMonthlyBatchBreakdown(monthStr);
  box.innerHTML = `
    <p class="hint" style="margin-bottom:10px">${pl.count} та кунлик ҳисобот асосида, ФИФО (аввал келган — аввал сотилган) таннарх ҳисоби бўйича.</p>
    <div class="pl-group-title">Даромад</div>
    ${row('Сотув суммаси (жами)', fmt(pl.revenue)+" сўм")}
    <div class="pl-group-title">Таннарх (ёқилғи тури бўйича, ФИФО — партия-партия шаффоф)</div>
    ${batchRows.map(r=>row(
      esc(r.fuelName)+' — '+(r.batchDate? r.batchDate+' партия' : 'жорий нарх')+' ('+fmt(r.costPerLiter)+' сўм/л)',
      fmt(r.liters)+' л = '+fmt(r.cost)+" сўм", {indent:true}
    )).join('') || row('—','0 сўм',{indent:true})}
    ${row('= Таннарх жами', fmt(pl.cogs)+" сўм", {bold:true})}
    <p class="hint" style="margin:2px 0 0">Агар бир ойда бир неча қатор чиқса — демак шу ойда ЭСКИ ва ЯНГИ партия аралаш сотилган (эски қолдиқ тугаб, янгисига ўтилган). Бу "ўртача" рақам эмас, ҳар бир литр қайси партиядан экани аниқ кузатилади.</p>
    <div class="pl-group-title">Харажатлар</div>
    ${row('Электр энергияси (ойлик, жами)', fmt(pl.electricity)+" сўм", {indent:true})}
    ${row('Иш ҳақи (Бензин ходимлари)', fmt(pl.salary)+" сўм", {indent:true})}
    ${row('Бошқа харажатлар', fmt(pl.otherExp)+" сўм", {indent:true})}
    ${row('= Харажатлар жами', fmt(pl.expensesTotal)+" сўм", {bold:true})}
    <div class="pl-group-title">Солиқлар</div>
    ${row('Акциз солиғи', fmt(pl.excise)+" сўм", {indent:true})}
    ${row('НДС — чиқим ('+pct(pl.tax.nds_rate)+', сотувдан)', fmt(pl.outputVat)+" сўм", {indent:true})}
    ${row('НДС — кирим (шу ОЙДА харид қилинган ёқилғи + электр)', '− '+fmt(pl.inputVat)+" сўм", {indent:true})}
    ${row('= НДС (тўланадиган, нетто)', fmt(pl.ndsNet)+" сўм", {indent:true})}
    ${row('Ижтимоий солиқ ('+pct(pl.tax.social_tax_rate)+', иш ҳақидан)', fmt(pl.socialAmount)+" сўм", {indent:true})}
    <div class="pl-group-title">Натижа</div>
    ${row('= Фойда (солиққача)', fmt(pl.profitBeforeTax)+" сўм", {bold:true})}
    ${row('− Фойда солиғи ('+pct(pl.tax.profit_tax_rate)+')', fmt(pl.profitTaxAmount)+" сўм", {indent:true})}
    ${row('= СОФ ФОЙДА', fmt(pl.netProfit)+" сўм", {bold:true, cls: pl.netProfit<0?'bad-text':'good-text'})}
    ${zeroExcise ? `<div class="review-warn" style="margin-top:10px">⚠ Баъзи ёқилғи турларида акциз ставкаси 0 турибди (Созламалар → Бензин созламаларида ҳали киритилмаган) — демак юқоридаги фойда ҳақиқийдан КЎПРОҚ кўринади. Бухгалтер билан аниқлаштириб киритинг.</div>` : ''}`;
}

// Ойлар кесимида бензин сотув суммаси — monthlySalesSeries()'нинг бензин
// эгизаги, "Умумий ҳолат" графиги учун.
function benzinMonthlySeries(){
  const calc = benzinComputeAll();
  const byMonth = {};
  state.benzinEntries.forEach(e=>{
    if(!e.date) return;
    const m = e.date.slice(0,7);
    const rev = (calc[e.id] && calc[e.id].revenue) || 0;
    byMonth[m] = (byMonth[m]||0) + rev;
  });
  const months = Object.keys(byMonth).sort().slice(-12);
  return months.map(m=>({label:m.slice(2), value:byMonth[m]}));
}

function recalcBenzinPreview(){
  const box = document.getElementById('bzPreviewTiles');
  if(!box) return;
  const date = document.getElementById('bz_date').value || todayISO();
  const soldByFuel = {};
  let ok = true;
  state.dispensers.filter(d=>d.active).forEach(d=>{
    const el = document.getElementById('bz_disp_'+d.id);
    if(!el) return;
    const v = parseFloat(el.value);
    if(isNaN(v)){ ok = false; return; }
    const sold = v - dispenserBaseline(d.id);
    if(d.fuel_type_id) soldByFuel[d.fuel_type_id] = (soldByFuel[d.fuel_type_id]||0) + sold;
  });
  if(!ok){ box.innerHTML = `<div class="tile"><div class="label">Сотув суммаси</div><div class="value">—</div></div>`; return; }
  let revenue = 0;
  const lines = Object.keys(soldByFuel).map(ftId=>{
    const price = fuelPriceFor(ftId, date);
    revenue += soldByFuel[ftId]*price;
    return `<div class="tile"><div class="label">${esc(fuelTypeName(ftId))}</div><div class="value">${fmt(soldByFuel[ftId])} л</div></div>`;
  }).join('');
  const salesSum = benzinPending.sales.reduce((s,x)=>s+x.sum,0);
  const uzkard = parseFloat(document.getElementById('bz_uzkard').value)||0;
  const xumo = parseFloat(document.getElementById('bz_xumo').value)||0;
  const naqd = revenue - uzkard - xumo - salesSum;
  box.innerHTML = lines +
    `<div class="tile"><div class="label">Сотув суммаси</div><div class="value">${fmt(revenue)}</div></div>
     <div class="tile"><div class="label">Нақд (автоматик)</div><div class="value ${naqd<0?'bad':'good'}">${fmt(naqd)}</div></div>`;
}

// Гатҳерс + текширади. Хато бўлса toast кўрсатиб null қайтаради.
function collectBenzinForm(){
  const date = document.getElementById('bz_date').value;
  if(!date){ toast("Санани киритинг"); return null; }
  if(entryExistsForDate(date, 'benzin')){ toast("Бу санага ҳисобот аллақачон киритилган — бошқа сана танланг ёки CEO'га мурожаат қилинг"); return null; }
  const readings = {};
  let ok = true;
  state.dispensers.filter(d=>d.active).forEach(d=>{
    const el = document.getElementById('bz_disp_'+d.id);
    const v = parseFloat(el.value);
    if(isNaN(v)){ ok=false; return; }
    readings[d.id] = v;
  });
  if(!ok){ toast("Барча калонка кўрсаткичларини киритинг"); return null; }

  let soldByFuel = {}, revenue = 0;
  state.dispensers.filter(d=>d.active).forEach(d=>{
    const sold = readings[d.id] - dispenserBaseline(d.id);
    if(d.fuel_type_id) soldByFuel[d.fuel_type_id] = (soldByFuel[d.fuel_type_id]||0) + sold;
  });
  Object.keys(soldByFuel).forEach(ftId=>{ revenue += soldByFuel[ftId]*fuelPriceFor(ftId, date); });

  const uzkard = parseFloat(document.getElementById('bz_uzkard').value)||0;
  const xumo = parseFloat(document.getElementById('bz_xumo').value)||0;
  const kechagiVal = document.getElementById('bz_kechagi').value;
  const salesSum = benzinPending.sales.reduce((s,x)=>s+x.sum,0);
  const naqd = revenue - uzkard - xumo - salesSum;
  const izoh = document.getElementById('bz_izoh').value.trim() || null;

  return { date, readings, soldByFuel, revenue, uzkard, xumo, kechagiVal, salesSum, naqd, izoh };
}

  if(trainingMode){
    closeBenzinReview();
    toast("🎓 Машқ якунланди — бу ҳеч нарса базага ёзилмади");

    renderTab();

  }

  const btn = document.getElementById('bzReviewSubmitBtn');
  btn.disabled = true; btn.textContent = 'Юборилмоқда…';

  const { data: entryRow, error } = await sb.from('benzin_entries').insert({
    date: f.date, operator_id: state.profile.id, operator_name: state.profile.full_name,

}

// Янги калонка қўшиш — масалан янги маҳсулот (бошқа ёқилғи тури) сотила
// бошласа, CEO ўзи шу ердан қўшади. Бошланғич кўрсаткич 0дан бошланади —
// агар калонка ҳақиқатда аввалдан бор бўлса, биринчи кунги кўрсаткични
// жорий ҳолатга қараб операторга тўғридан-тўғри киритиш тавсия этилади.
async function addDispenser(){
  const name = document.getElementById('disp_name').value.trim();
  const fuelId = document.getElementById('disp_fuel').value;
  const seedStr = document.getElementById('disp_seed').value;
  const seed = seedStr!=='' ? parseFloat(seedStr) : null;
  if(!name){ toast("Калонка номини киритинг"); return; }
  const maxSort = state.dispensers.reduce((m,d)=>Math.max(m, Number(d.sort_order)||0), 0);
  const { data: newDisp, error } = await sb.from('dispensers').insert({
    name, fuel_type_id: fuelId, active: true, sort_order: maxSort+1
  }).select().single();
  if(error){ toast("Хатолик: "+error.message); return; }

  // Агар бошланғич кўрсаткич берилган бўлса — КЕЧАГИ сана учун шу
  // қийматни "ўтган кунги кўрсаткич" сифатида ёзиб қўямиз (метандаги
  // seed-хатосининг олдини олиш учун), шунда операторнинг БУГУНГИ биринчи
  // ёзуви тўғри фарқ (сотилган) чиқаради, бутун кўрсаткичнинг ўзи эмас.
  if(seed !== null && !isNaN(seed)){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    const existing = state.benzinEntries.find(e=>e.date===yesterday);
    if(existing){
      const readings = Object.assign({}, existing.readings||{}, { [newDisp.id]: seed });
      const { error: e2 } = await sb.from('benzin_entries').update({ readings }).eq('id', existing.id);
      if(e2){ toast("Калонка қўшилди, лекин бошланғич кўрсаткични ёзишда хатолик: "+e2.message); await loadAll(); renderTab(); return; }
    } else {
      const { error: e2 } = await sb.from('benzin_entries').insert({
        date: yesterday, operator_name: state.profile.full_name,
        readings: { [newDisp.id]: seed }, naqd: 0, uzkard: 0, xumo: 0,
        izoh: 'Калонка бошланғич кўрсаткичи (тизимга қўшилган кундан олдинги кун)'
      });
      if(e2){ toast("Калонка қўшилди, лекин бошланғич кўрсаткични ёзишда хатолик: "+e2.message); await loadAll(); renderTab(); return; }
    }
  }
  toast("Калонка қўшилди ✓"); document.getElementById('disp_name').value=''; await loadAll(); renderTab();
}

// ОЙЛИКЛАР — ҳар бир ходим, ойлиги ва тарихи алоҳида. Бир кишининг
// ойлиги ўзгарса ҳам, эски ойлар ҳисоби ўзгармайди (нарх тарихи каби).
// ============================================================
function employeesForStation(station){
  return state.employees.filter(e => (e.station||'metan')===station);
}
function totalSalaryFor(monthStr, station){
  station = station || 'metan';
  const list = employeesForStation(station);
  if(!list.length) return 0;
  const asOf = monthStr+'-28';
  let total = 0;
  list.filter(e=>e.active).forEach(emp=>{
    const rows = state.employeeSalaries.filter(s=>s.employee_id===emp.id);
    let best = null;
    rows.forEach(r=>{ if(r.effective_date <= asOf) best = r; });
    if(best) total += Number(best.amount)||0;
  });
  return total;
}
function tplSalaries(role, station){
  station = station || 'metan';
  const canEdit = role==='ceo';
  const monthStr = currentMonthKey();
  const rows = employeesForStation(station).map(emp=>{
    const salaries = state.employeeSalaries.filter(s=>s.employee_id===emp.id).sort((a,b)=>a.effective_date.localeCompare(b.effective_date));
    let current = null;
    salaries.forEach(s=>{ if(s.effective_date <= monthStr+'-28') current = s; });
    return { emp, current, salaries };
  });
  return `
  <div class="card">
    <div class="section-title"><h2>Ходимлар ва ойликлари</h2></div>
    <p class="hint">Жорий ойлик = шу ходимнинг энг сўнгги амал қилаётган ставкаси. Ойлик даромад ҳисоботидаги "Иш ҳақи" харажати шу ердаги барча фаол ходимлар ойлигининг йиғиндисидан олинади.</p>
    <div class="table-wrap"><table><thead><tr><th>Исм</th><th>Лавозим</th><th>Жорий ойлиги</th><th>Ҳолат</th>${canEdit?'<th></th>':''}</tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.emp.full_name)}</td><td>${esc(r.emp.position||'')}</td><td>${r.current?fmt(r.current.amount):'<span class="hint">белгиланмаган</span>'}</td>
        <td>${r.emp.active?'Фаол':'Фаол эмас'}</td>
        ${canEdit?`<td><button class="del" onclick="deleteEmployee('${r.emp.id}')" title="Ўчириш">✕</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${canEdit?5:4}" class="empty">Ҳали ходим киритилмаган</td></tr>`}</tbody></table>
    </div>
    <div class="tile-row" style="margin-top:10px"><div class="tile"><div class="label">Жорий ой (${monthStr}) — жами иш ҳақи</div><div class="value">${fmt(totalSalaryFor(monthStr, station))}</div></div></div>
  </div>
  ${!canEdit ? '' : `
  <div class="card group-settings">
    <h2>Янги ходим қўшиш</h2>
    <div class="row">
      <div class="field" style="flex:2"><label>Исм-фамилия</label><input type="text" id="emp_name"></div>
      <div class="field"><label>Лавозим</label><input type="text" id="emp_position" placeholder="Оператор / Ҳайдовчи..."></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn small" onclick="addEmployee('${station}')">Қўшиш</button></div>
    </div>
  </div>
  <div class="card group-settings">
    <h2>Ойлик белгилаш / ўзгартириш</h2>
    <p class="hint">Янги қатор қўшсангиз, шу санадан бошлаб амал қилади — эски ойлар эски ставкада қолаверади. Бирортасининг ойлиги ошса, шу ерга фақат ЯНГИ қатор қўшинг — эски ойлар ҳисоби ўзгармайди, тизимга ҳеч қандай муаммо туғдирмайди.</p>
    <div class="row">
      <div class="field" style="flex:2"><label>Ходим</label><select id="sal_employee_${station}"></select></div>
      <div class="field"><label>Амал қилиш санаси</label><input type="date" id="sal_date_${station}" value="${todayISO()}"></div>
      <div class="field"><label>Ойлик суммаси</label><input type="number" id="sal_amount_${station}"></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn small" onclick="addEmployeeSalary('${station}')">Сақлаш</button></div>
    </div>
  </div>`}`;
}
function afterRenderSalaries(station){
  station = station || 'metan';
  const sel = document.getElementById('sal_employee_'+station);
  if(sel) sel.innerHTML = employeesForStation(station).filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('');
}
async function addEmployee(station){
  station = station || 'metan';
  const name = document.getElementById('emp_name').value.trim();
  if(!name){ toast("Исмни киритинг"); return; }
  const { error } = await sb.from('employees').insert({
    full_name: name, position: document.getElementById('emp_position').value.trim()||null,
    station, created_by_name: state.profile.full_name
  });
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Қўшилди ✓"); await loadAll(); renderTab();
}
async function deleteEmployee(id){
  if(!confirm("Бу ходимни ўчирасизми? (тарихи ҳам ўчади)")) return;
  const { error } = await sb.from('employees').delete().eq('id', id);
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Ўчирилди ✓"); await loadAll(); renderTab();
}
async function addEmployeeSalary(station){
  station = station || 'metan';
  const employeeId = document.getElementById('sal_employee_'+station).value;
  const date = document.getElementById('sal_date_'+station).value;
  const amount = parseFloat(document.getElementById('sal_amount_'+station).value);
  if(!employeeId || !date || !amount){ toast("Ходим, сана ва суммани киритинг"); return; }
  const { error } = await sb.from('employee_salaries').upsert({
    employee_id: employeeId, effective_date: date, amount, created_by_name: state.profile.full_name
  }, {onConflict:'employee_id,effective_date'});
  if(error){ toast("Хатолик: "+error.message); return; }
  toast("Сақланди ✓"); await loadAll(); renderTab();
}

// ============================================================
// EXCEL ЗАХИРА НУСХА — барча маълумотни бир файлга, бир нечта варақда.
// (SheetJS кутубхонаси <head>да юкланган.)
// ============================================================
// Метан — Excel захира нусхаси. Фақат метан станциясига тегишли маълумот
// (бензинники алоҳида функцияда — иккиси ҳеч қачон бир файлга аралашмайди).
// Жами қатор қўшиш — рақамли устунлар йиғиндиси, "ЖАМИ" ёрлиғи биринчи
// матн устунига қўйилади. Умуман бўш рўйхатда ҳеч нарса қайтармайди.
function withTotalRow(rows, labelField, numericFields){
  if(!rows || !rows.length) return rows;
  const total = {};
  Object.keys(rows[0]).forEach(k=>{ total[k] = ''; });
  total[labelField] = 'ЖАМИ';
  numericFields.forEach(k=>{ total[k] = rows.reduce((s,r)=>s+(Number(r[k])||0),0); });
  return [...rows, total];
}
function exportMetanExcel(){
  if(typeof XLSX === 'undefined'){ toast("Excel кутубхонаси юкланмади — интернетни текшириб, саҳифани қайта юкланг"); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, rows) => {
    const safe = (rows && rows.length) ? rows : [{}];
    const ws = XLSX.utils.json_to_sheet(safe);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  };

  addSheet('Kunlik hisobot', withTotalRow(state.entries.map(e=>{
    const companyM3 = state.deliveries.filter(d=>d.entry_id===e.id).reduce((s,d)=>s+(Number(d.m3)||0),0);
    const row = { 'Сана':e.date, 'Оператор':e.operator_name };
    (e.pump_end||[]).forEach((v,i)=>{ row['Калонка '+(PUMP_NAMES[i]||('K'+(i+1)))+' кўрсаткичи'] = v; });
    row['Кунлик сотув (m3)'] = e.sold_m3;
    row['Кунлик сотув суммаси (сўм)'] = e.sales_value;
    row['Нақт (сўм)'] = e.naqt;
    row['UZCARD (сўм)'] = e.uzcard;
    row['HUMO (сўм)'] = e.humo;
    row['QR (сўм)'] = e.qr;
    row['Компанияларга сотилган (m3)'] = companyM3;
    row['Агрес — ҳисоблагичдан ўтган (m3)'] = e.agres;
    return row;
  }), 'Оператор', ['Кунлик сотув (m3)','Кунлик сотув суммаси (сўм)','Нақт (сўм)','UZCARD (сўм)','HUMO (сўм)','QR (сўм)','Компанияларга сотилган (m3)','Агрес — ҳисоблагичдан ўтган (m3)']));

  addSheet('Kompaniyaga gaz', state.deliveries.map(d=>({
    'Сана':(d.entries&&d.entries.date)||'', 'Компания':(state.companies.find(c=>c.id===d.company_id)||{}).name||'', 'Берилган газ (m3)':d.m3
  })));
  addSheet('Kompaniya tolovlari', state.payments.map(p=>({
    'Сана':p.date, 'Компания':(state.companies.find(c=>c.id===p.company_id)||{}).name||'', 'Сумма (сўм)':p.amount, 'Изоҳ':p.note, 'Ким киритган':p.created_by_name
  })));
  addSheet('Kompaniyalar (balans)', companyTotals('metan').map(c=>({ 'Номи':c.name, 'Сотилган (m3)':c.m3, 'Сотилган сумма (сўм)':c.sold, 'Тўланган (сўм)':c.paid, 'Баланс (сўм)':c.paid-c.sold })));
  const metanEmployees = employeesForStation('metan');
  addSheet('Xodimlar', metanEmployees.map(e=>({ 'Исм':e.full_name, 'Лавозим':e.position, 'Фаол':e.active?'Ҳа':"Йўқ" })));
  addSheet('Oyliklar tarixi', state.employeeSalaries.filter(s=>metanEmployees.some(e=>e.id===s.employee_id)).map(s=>({
    'Ходим':(state.employees.find(e=>e.id===s.employee_id)||{}).full_name||'', 'Сана (-дан)':s.effective_date, 'Сумма (сўм)':s.amount
  })));
  addSheet('Narxlar', state.prices.map(p=>({
    'Сана (-дан)':p.effective_date, 'Сотув нархи (сўм/m3)':p.sale_price, 'Таннарх (сўм/m3)':p.cost_price,
    'Акциз (сўм/m3)':p.excise, "Йўқотиш коэффициенти":p.loss_coefficient, 'Ким киритган':p.created_by_name
  })));
  addSheet('Soliq stavkalari', state.taxRates.map(t=>({
    'Сана (-дан)':t.effective_date, 'НДС (%)':(Number(t.nds_rate)||0)*100, 'Ижтимоий солиқ (%)':(Number(t.social_tax_rate)||0)*100,
    'Фойда солиғи (%)':(Number(t.profit_tax_rate)||0)*100, 'Ким киритган':t.created_by_name
  })));
  addSheet('Doimiy xarajatlar', state.fixedCosts.filter(f=>(f.station||'metan')==='metan').map(f=>({
    'Сана (-дан)':f.effective_date, 'Ойлик фонд (сўм)':f.salary, 'Банк кредит фоизи (сўм)':f.bank_loan_interest,
    'Ер/мулк солиғи (сўм)':f.land_property_tax, 'Электр тарифи (сўм)':f.electricity_tariff, 'Ким киритган':f.created_by_name
  })));
  addSheet('Boshqa xarajatlar', withTotalRow(state.otherExpenses.filter(e=>(e.station||'metan')==='metan').map(e=>({
    'Сана':e.date, 'Тавсиф':e.description, 'Сумма (сўм)':e.amount, 'Ким киритган':e.created_by_name
  })), 'Тавсиф', ['Сумма (сўм)']));

  const metanMonths = [...new Set(state.entries.map(e=>e.date && e.date.slice(0,7)).filter(Boolean))].sort();
  addSheet('Oylik hisobot', metanMonths.map(m=>{
    const pl = computeMonthlyPL(m);
    return { 'Ой':m, 'Даромад (сўм)':pl.revenue, 'Жами харажатлар (сўм)':pl.expensesTotal, 'Акциз (сўм)':pl.excise,
      'НДС — соф (сўм)':pl.ndsNet, 'Ижтимоий солиқ (сўм)':pl.socialAmount, 'Солиққача фойда (сўм)':pl.profitBeforeTax,
      'Фойда солиғи (сўм)':pl.profitTaxAmount, 'СОФ ФОЙДА (сўм)':pl.netProfit };
  }));

  XLSX.writeFile(wb, `Mangit_Metan_${todayISO()}.xlsx`);
  toast("Юклаб олинди ✓");
}

// ============================================================
// "Умумий ҳолат"дан бир ойлик ТЎЛИҸ ҲИСОБ-КИТОБ — бухгалтер учун,
// қадам-бақадам (вертикал жадвал: сатр номи + қиймат), худди экрандаги
// "Ойлик фойда ҳисоботи" кўриниши каби — лекин Excel файл сифатида.
// ============================================================
function exportMonthlyPLExcel(monthStr){
  if(!monthStr){ toast("Ойни танланг"); return; }
  if(typeof XLSX === 'undefined'){ toast("Excel кутубхонаси юкланмади — интернетни текшириб, саҳифани қайта юкланг"); return; }
  const wb = XLSX.utils.book_new();
  const addPLSheet = (name, lines) => {
    const rows = lines.map(l => ({ 'Қатор': l.label, 'Сумма (сўм)': l.value==null? '' : l.value }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:45},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  };

  const mPL = computeMonthlyPL(monthStr);
  addPLSheet('Метан — Oylik hisobot', [
    { label: `${monthStr} — Метан, ${mPL.count} кунлик ҳисобот асосида` },
    { label: 'ДАРОМАД' },
    { label: 'Сотув суммаси (жами)', value: mPL.revenue },
    { label: 'ХАРАЖАТЛАР' },
    { label: 'Табиий газ (харид, Агрес асосида)', value: mPL.cogsGas },
    { label: 'Электр энергияси', value: mPL.electricity },
    { label: 'Иш ҳақи', value: mPL.salary },
    { label: 'Банк кредити ва фоиз', value: mPL.bank },
    { label: 'Бошқа харажатлар', value: mPL.otherExp },
    { label: '= Харажатлар жами', value: mPL.expensesTotal },
    { label: 'СОЛИҚЛАР' },
    { label: 'Акциз солиғи (сотилган газ кубига)', value: mPL.excise },
    { label: 'НДС — чиқим ('+pct(mPL.tax.nds_rate)+', сотувдан)', value: mPL.outputVat },
    { label: 'НДС — кирим (газ+электр харидидан)', value: -mPL.inputVat },
    { label: '= НДС (тўланадиган, нетто)', value: mPL.ndsNet },
    { label: 'Ижтимоий солиқ ('+pct(mPL.tax.social_tax_rate)+', иш ҳақидан)', value: mPL.socialAmount },
    { label: 'Ер ва мол-мулк солиғи', value: mPL.land },
    { label: 'НАТИЖА' },
    { label: '= Фойда (солиққача)', value: mPL.profitBeforeTax },
    { label: '− Фойда солиғи ('+pct(mPL.tax.profit_tax_rate)+')', value: mPL.profitTaxAmount },
    { label: '= СОФ ФОЙДА', value: mPL.netProfit },
  ]);

  const bPL = computeBenzinMonthlyPL(monthStr);
  const benzinLines = [
    { label: `${monthStr} — Бензин, ${bPL.count} кунлик ҳисобот асосида` },
    { label: 'ДАРОМАД' },
    { label: 'Сотув суммаси (жами)', value: bPL.revenue },
    { label: 'ТАННАРХ (партия-партия, ФИФО — эски/янги аралаш бўлса ҳам ҳар бири алоҳида кўринади)' },
  ];
  benzinMonthlyBatchBreakdown(monthStr).forEach(r=>{
    benzinLines.push({ label: r.fuelName+' — '+(r.batchDate? r.batchDate+' партия':'жорий нарх')+' ('+fmt(r.costPerLiter)+' сўм/л) — '+fmt(r.liters)+' л', value: r.cost });
  });
  benzinLines.push(
    { label: '= Таннарх жами', value: bPL.cogs },
    { label: 'ХАРАЖАТЛАР' },
    { label: 'Электр энергияси', value: bPL.electricity },
    { label: 'Иш ҳақи (Бензин ходимлари)', value: bPL.salary },
    { label: 'Бошқа харажатлар', value: bPL.otherExp },
    { label: '= Харажатлар жами', value: bPL.expensesTotal },
    { label: 'СОЛИҚЛАР' },
    { label: 'Акциз солиғи', value: bPL.excise },
    { label: 'НДС — чиқим ('+pct(bPL.tax.nds_rate)+', сотувдан)', value: bPL.outputVat },
    { label: 'НДС — кирим (шу ойда харид қилинган ёқилғи + электр)', value: -bPL.inputVat },
    { label: '= НДС (тўланадиган, нетто)', value: bPL.ndsNet },
    { label: 'Ижтимоий солиқ ('+pct(bPL.tax.social_tax_rate)+', иш ҳақидан)', value: bPL.socialAmount },
    { label: 'НАТИЖА' },
    { label: '= Фойда (солиққача)', value: bPL.profitBeforeTax },
    { label: '− Фойда солиғи ('+pct(bPL.tax.profit_tax_rate)+')', value: bPL.profitTaxAmount },
    { label: '= СОФ ФОЙДА', value: bPL.netProfit },
  );
  addPLSheet('Бензин — Oylik hisobot', benzinLines);

  addPLSheet('Умумий', [
    { label: `${monthStr} — икки станция, алоҳида-алоҳида (қўшилмайди)` },
    { label: 'Метан — сотув суммаси', value: mPL.revenue },
    { label: 'Метан — СОФ фойда', value: mPL.netProfit },
    { label: 'Бензин — сотув суммаси', value: bPL.revenue },
    { label: 'Бензин — ялпи фойда (ҳозирча харажатлар тўлиқ бўлинмаган)', value: bPL.grossProfit },
    { label: 'Бензин — СОФ фойда', value: bPL.netProfit },
  ]);

  XLSX.writeFile(wb, `Oylik_hisobot_${monthStr}.xlsx`);
  toast("Юклаб олинди ✓");
}

boot();
</script>
