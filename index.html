<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мангит Метан</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2F5B">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mangit Metan">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  /* FILOP бренд палитаси — "локланган" дизайн токенлари (референс расм
     асосида аниқ белгиланган: навy, blue, gold, purple, gray). */
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EDF2FA; --border:#DCE7F4; --border-strong:#C3CEDE;
  --fg:#0B2F5B; --muted:#64748B;
  --accent:#1E88FF; --accent-hover:#1468C4; --accent-wash:#1E88FF14; --accent-fg:#FFFFFF;
  --navy:#0B2F5B; --navy-wash:#0B2F5B12;
  --gold:#F6B93B; --gold-wash:#F6B93B1F;
  --good:#10B981; --bad:#B3321B; --warn:#AD7510; --orange:#C05F0C;
  --blue:#1E88FF; --purple:#7C3AED; --purple-wash:#7C3AED1A;
  --font-display:'Inter',system-ui,-apple-system,sans-serif; --font-body:'Inter',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-sm:0 2px 8px rgba(11,47,91,.06);
  --shadow-md:0 6px 16px rgba(11,47,91,.11), 0 2px 4px rgba(11,47,91,.06);
  --shadow-lift:0 10px 24px rgba(11,47,91,.16), 0 2px 6px rgba(11,47,91,.08);
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --radius-card:12px; --radius-input:9px; --radius-button:10px; --radius-navigation:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1626; --surface:#11213A; --surface-2:#16283F; --border:#223756; --border-strong:#2E4870;
    --fg:#ECF1F8; --muted:#93A0B8;
    --accent:#4DA3FF; --accent-hover:#6FB5FF; --accent-wash:#4DA3FF22; --accent-fg:#06142A;
    --navy:#0B2F5B; --navy-wash:#0B2F5B40;
    --gold:#F8C563; --gold-wash:#F8C56326;
    --good:#34D399; --bad:#F2795A; --warn:#E8B548; --orange:#F0914A;
    --blue:#4DA3FF; --purple:#B79AE0;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 16px rgba(0,0,0,.40);
    --shadow-lift:0 10px 26px rgba(0,0,0,.48);
  }
}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *{transition-duration:0.001ms !important; animation-duration:0.001ms !important} }
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:16px;padding-block:20px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.05rem}
h3{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--navy);color:#fff;margin:-20px -16px 16px -16px;padding:16px;min-height:80px;box-sizing:border-box}
.topbar h1{color:#fff}
.topbar .who{color:rgba(255,255,255,.72)}
.topbar .btn.secondary{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.38);color:#fff}
.topbar .btn.secondary:hover{background:rgba(255,255,255,.24)}
.topbar .pill{background:rgba(255,255,255,.14);border:none}
.who{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:6px;border-radius:var(--r-md);z-index:5;border:1px solid var(--border)}
.tab-btn{padding:8px 13px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--grp-color,var(--muted));font-size:.85rem;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.tab-btn:hover{background:var(--surface-2)}
.tab-btn.active{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-sm)}
.tab-btn.active:hover{background:var(--accent-hover)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card.group-income{border-left:3px solid var(--good)}
.card.group-expense{border-left:3px solid var(--bad)}
.card.group-tax{border-left:3px solid var(--purple)}
.card.group-company{border-left:3px solid var(--blue)}
.card.group-settings{border-left:3px solid var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
label{font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
input,select,textarea{font-family:var(--font-body);font-size:16px;padding:9px 11px;border-radius:var(--radius-input);border:1px solid var(--border);background:var(--surface-2);color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);background:var(--surface)}
textarea{min-height:60px;resize:vertical}
.btn{padding:10px 17px;border-radius:var(--radius-button);border:1px solid var(--accent-hover);background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s,filter .15s;min-height:44px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn:not(:disabled):hover{filter:brightness(1.07);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.btn:not(:disabled):active{transform:translateY(0);filter:brightness(.97);box-shadow:var(--shadow-sm)}
.btn.secondary{background:var(--surface);border:1px solid var(--border-strong);color:var(--fg);box-shadow:none}
.btn.secondary:not(:disabled):hover{background:var(--surface-2);box-shadow:var(--shadow-sm)}
.btn.danger{background:linear-gradient(180deg,var(--bad) 0%,#8F2714 100%);border-color:#8F2714;color:#fff}
.btn.small{padding:6px 11px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.list-item{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.list-item:last-child{border-bottom:none}
.list-item .del{margin-left:auto;background:none;border:none;color:var(--bad);cursor:pointer;font-size:1rem;padding:2px 8px;border-radius:var(--r-sm)}
.list-item .del:hover{background:color-mix(in srgb, var(--bad) 12%, transparent)}
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow-sm)}
.tile .label{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tile .value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.tile .value.good{color:var(--good)} .tile .value.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.03em}
tbody tr:hover td{background:var(--surface-2)}
.table-wrap{overflow-x:auto;border-radius:var(--r-sm)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.pill.orange{background:color-mix(in srgb, var(--orange) 16%, transparent);color:var(--orange)}
.pill.warn{background:color-mix(in srgb, var(--warn) 16%, transparent);color:var(--warn)}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:.9rem}
.pl-row.pl-indent{padding-left:14px;font-size:.83rem;color:var(--muted)}
.pl-row.pl-bold{font-weight:700;font-size:1rem;border-bottom:2px solid var(--fg);margin-top:4px}
.pl-row .good-text{color:var(--good)}
.pl-row .bad-text{color:var(--bad)}
.pl-group-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:12px;margin-bottom:2px}
.pl-group-title:first-of-type{margin-top:0}
.empty{color:var(--muted);font-size:.85rem;padding:14px 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:var(--r-sm);font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;box-shadow:var(--shadow-lift)}
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:100}
.review-box{background:var(--bg);border-radius:var(--r-lg);max-width:560px;width:100%;padding:20px;margin:auto;box-shadow:var(--shadow-lift)}
.review-box h2{margin:0 0 4px}
.review-section{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.review-section h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.review-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;font-variant-numeric:tabular-nums}
.review-row .k{color:var(--muted)}
.review-warn{background:var(--gold-wash);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;margin-top:12px;font-weight:600;border:1px solid color-mix(in srgb, var(--warn) 30%, transparent)}
.toast.show{opacity:1}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.login-card{max-width:360px;margin:60px auto;text-align:center}
.detail-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:12px;margin-top:10px;font-size:.85rem}
.detail-box div{padding:3px 0}
.confirm-wrap{background:var(--gold-wash);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);border-radius:var(--r-sm);padding:10px;margin-top:8px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.company-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 15px;transition:box-shadow .15s,border-color .15s}
.company-card:hover{box-shadow:var(--shadow-sm);border-color:var(--border-strong)}
.company-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.company-card-name{font-weight:700;font-size:.95rem;line-height:1.25}
.company-card-top .pill{flex-shrink:0}
.company-card-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:var(--r-sm);line-height:1}
.company-card-del:hover{background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad)}
.company-card-balance{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.company-card-balance .unit{font-family:var(--font-body);font-size:.7rem;font-weight:600;color:var(--muted);margin-left:3px}
.company-card-balance.good{color:var(--good)}
.company-card-balance.bad{color:var(--bad)}
.company-card-stats{display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid var(--border)}
.company-card-stats div{display:flex;justify-content:space-between;font-size:.8rem}
.company-card-stats .k{color:var(--muted)}
.company-card-stats .v{font-variant-numeric:tabular-nums;font-weight:600}
.action-box{background:var(--accent-wash);border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);border-radius:var(--r-md);padding:14px;margin-top:14px}
.action-box h3{color:var(--accent);margin-bottom:2px}

/* Таппланадиган карточка — ўзининг устига босиб ичига кирилади (select
   билан танлаш ўрнига). Телефонда кенг тегиш майдони учун катта padding. */
.company-card.tappable{cursor:pointer;-webkit-tap-highlight-color:transparent}
.company-card.tappable:active{transform:scale(.98);box-shadow:none}

/* Қатор-карточка — рўйхат элементи, устига босиш билан деталь очилади
   (ходимлар ва шу каби "рўйхат + таҳрир" экранлар учун). */
.list-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,border-color .15s;font-family:inherit;color:inherit}
.list-card:hover{box-shadow:var(--shadow-sm);border-color:var(--border-strong)}
.list-card:active{transform:scale(.98)}
.list-card-main{flex:1;min-width:0}
.list-card-name{font-weight:700;font-size:.92rem;line-height:1.3}
.list-card-meta{color:var(--muted);font-size:.78rem;margin-top:2px}
.list-card-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.list-card-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;text-align:right;white-space:nowrap}
.list-card-chevron{color:var(--muted);font-size:1.1rem;line-height:1}
.add-fab{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:var(--shadow-sm)}
.add-fab:hover{background:var(--accent-hover)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Станция/катта танлов экрани — кичик тугмалар эмас, катта, аниқ
   кўринадиган, тўлиқ энли карточкалар (топилмай қолмаслиги учун). */
.choice-list{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.choice-card{display:flex;align-items:center;gap:16px;width:100%;padding:20px 20px;border-radius:var(--r-lg);border:1.5px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:left;font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,border-color .15s,transform .1s}
.choice-card:hover{box-shadow:var(--shadow-md);border-color:var(--accent)}
.choice-card:active{transform:scale(.98)}
.choice-icon{flex-shrink:0;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:var(--accent-wash)}
.choice-icon.gold{background:var(--gold-wash)}
.choice-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.choice-title{font-weight:800;font-size:1.15rem;line-height:1.2}
.choice-sub{color:var(--muted);font-size:.82rem}
.choice-chevron{color:var(--muted);font-size:1.6rem;flex-shrink:0}

/* Пастки навигация панели — мобил иловаларга хос, экраннинг тубида
   доим тура­диган 4-5 тугма. Эски юқори "табс" қатори ўрнига. */
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navy);border-radius:var(--radius-navigation) var(--radius-navigation) 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)) 4px;z-index:40;box-shadow:0 -4px 18px rgba(11,47,91,.22)}
.bottomnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;padding:6px 2px 5px;color:rgba(255,255,255,.62);font-size:.68rem;font-weight:700;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:44px}
.bottomnav-btn.active{color:var(--grp-color,var(--gold))}
.bottomnav-btn.active::after{content:'';display:block;width:16px;height:3px;border-radius:2px;background:currentColor;margin-top:1px}
.bottomnav-btn .tab-icon{width:22px;height:22px}
/* Табларни гуруҳига қараб рангли қилиш — операторлар ва CEO/директор бир
   қарашда "бу иш қисми", "бу ҳисобот", "бу бошқарув" эканини рангидан ҳам
   билиб олсин. Оқ (десктоп юқори тab) ва navy (пастки nav) фон учун
   алоҳида, ўқилиши учун мос рангли вариантлар. */
.grp-work{--grp-color:#9a6611}
.grp-overview{--grp-color:var(--navy)}
.grp-reports{--grp-color:var(--accent)}
.grp-manage{--grp-color:var(--purple)}
.grp-system{--grp-color:var(--muted)}
.bottomnav-btn.grp-work{--grp-color:var(--gold)}
.bottomnav-btn.grp-overview{--grp-color:#fff}
.bottomnav-btn.grp-reports{--grp-color:#6FB5FF}
.bottomnav-btn.grp-manage{--grp-color:#B794F6}
.bottomnav-btn.grp-system{--grp-color:rgba(255,255,255,.85)}
#tabBody{padding-bottom:84px}
#tabsRow{display:none}
@media (min-width:720px){
  .bottomnav{display:none}
  #tabBody{padding-bottom:0}
  #tabsRow{display:flex}
}

/* "Бош саҳифа" катакчалар тўри — таблар кўп бўлганда (7-9 та) уларнинг
   ҳаммасини пастки навигацияга сиғдирмай, катта, осон топиладиган
   icon-badge карточкалар орқали кўрсатиш (Soliq-иловаси услуби). */
.nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:480px){.nav-grid{grid-template-columns:repeat(3,1fr)}}
.nav-tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 10px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,border-color .15s,transform .1s}
.nav-tile:hover{box-shadow:var(--shadow-md);border-color:var(--accent)}
.nav-tile:active{transform:scale(.97)}
.nav-tile-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--navy-wash);color:var(--navy)}
.nav-tile-icon svg{width:26px;height:26px}
.nav-tile-icon.work{background:var(--gold-wash);color:#9a6611}
.nav-tile-icon.overview{background:var(--navy-wash);color:var(--navy)}
.nav-tile-icon.reports{background:var(--accent-wash);color:var(--accent)}
.nav-tile-icon.manage{background:var(--purple-wash);color:var(--purple)}
.nav-tile-icon.system{background:var(--surface-2);color:var(--muted)}
.nav-tile-label{font-size:.82rem;font-weight:700;line-height:1.25}
.nav-group{margin-bottom:24px}
.nav-group-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin:0 0 10px 2px;color:var(--grp-color,var(--muted))}

/* CEO/директор "Умумий ҳолат" ландинг экранидаги станция карточкалари ва
   тезкор амаллар — Бош саҳифа катакчалари билан бир хил ранг тизими. */
.station-overview{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.station-overview{grid-template-columns:1fr 1fr}}
.station-ov-card{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.station-ov-icon{flex-shrink:0;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.station-ov-icon.work{background:var(--gold-wash);color:#9a6611}
.station-ov-icon.reports{background:var(--accent-wash);color:var(--accent)}
.station-ov-body{min-width:0}

.quick-action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.quick-action-grid{grid-template-columns:repeat(4,1fr)}}
.quick-action-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 8px;cursor:pointer;text-align:center;font-size:.78rem;font-weight:700;color:var(--fg);-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,border-color .15s}

/* Узун формаларда (масалан кунлик ҳисобот) пастга тушиб кетгандан кейин
   тепага тезда қайтиш учун сузувчи тугма — пастки навигация устида. */
.scroll-top-btn{position:fixed;right:16px;bottom:96px;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-lift);z-index:39;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.scroll-top-btn.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
@media (min-width:720px){.scroll-top-btn{bottom:24px}}

/* Кунлик ҳисобот каби узун формаларда — асосий хулоса (сотилган ҳажм,
   сумма, нақт) доим кўриниб турсин, пастга тушганда ҳам тепага қайта
   қайтиш шарт бўлмасин. */
.entry-summary-sticky{position:sticky;top:6px;z-index:12;border:1.5px solid var(--accent);box-shadow:var(--shadow-md);padding:12px 14px}
.entry-summary-sticky .tile-row{margin:0}

/* Пастдан чиқадиган "sheet" — мобилда қаторнинг/карточканинг ичига
   "кириш"ни ҳис қилдирадиган модал. Телефонда тўлиқ пастдан, катта
   экранда марказда дialog сифатида очилади. */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:70;opacity:0;visibility:hidden;transition:opacity .22s}
.sheet-backdrop.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lift);z-index:71;overflow-y:auto;padding:10px 18px 24px;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.4,1);-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:var(--border-strong);margin:4px auto 10px}
.sheet-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:6px;line-height:1;border-radius:999px}
.sheet-close:hover{background:var(--surface-2);color:var(--fg)}
.sheet-body{padding-top:4px}
@media (min-width:720px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;max-height:82vh;border-radius:var(--r-lg);transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .2s,opacity .2s}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-handle{display:none}
}
body.sheet-lock{overflow:hidden}
/* Топбардаги меню (гамбургер) тугмаси — чап томонда, станция
   алмаштириш/аккаунт/навигация шу орқали очилади. */
.menu-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.38);color:#fff;border-radius:var(--radius-button,10px);padding:8px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

/* Чап томондан чиқадиган навигация панели (drawer) — аккаунт

.drawer{position:fixed;left:0;top:0;bottom:0;width:86%;max-width:320px;background:var(--surface);box-shadow:var(--shadow-lift);z-index:81;overflow-y:auto;transform:translateX(-102%);transition:transform .26s cubic-bezier(.3,.9,.4,1);-webkit-overflow-scrolling:touch}
.drawer.open{transform:translateX(0)}
.drawer-head{background:var(--navy);color:#fff;padding:20px 18px 16px;position:relative}
.drawer-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:1rem;cursor:pointer;padding:6px 10px;line-height:1;border-radius:999px}
.drawer-avatar{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.drawer-name{font-weight:700;font-size:1.02rem}
.drawer-role{color:rgba(255,255,255,.72);font-size:.84rem;margin-top:2px}

.drawer-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:11px 18px;cursor:pointer;color:var(--fg);font-size:.92rem;font-family:inherit;-webkit-tap-highlight-color:transparent}
.drawer-item:active{background:var(--surface-2)}

/* Йиғма тарих — "Препеймент"даги каби кичик рўйхатларни аслида яшириб,

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ============================================================
// CONFIG — these two values are safe to be public (anon/publishable
// key only allows what the RLS policies in schema.sql permit).
// ============================================================
const SUPABASE_URL = 'https://kypgclfrdynegezqitsw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Lq6eHYDL3H_WruWBjN--Lg_PlYQoMYl';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// One-time historical starting point (last known pump readings from the
// old Excel system, 2026-09-26). Used ONLY until the first real entry
// exists in the new system - after that, the baseline is always derived
// from the most recent entry, never hardcoded again.
const SEED_PUMP_START = [971377.59, 788394.55, 1684533.06, 1557224.34, 1180665.26, 1444438.03];
const PUMP_NAMES = ['K1','K2','K3','K4','K5','K6'];

let state = {
  session: null, profile: null,
  companies: [], prices: [], taxRates: [], fixedCosts: [], prepayments: [], otherExpenses: [],
  entries: [], deliveries: [], payments: [], gapLedger: [], entryEditLog: [], bankTx: [], projectNotes: []
};
let pending = { deliveries: [] };
let benzinPending = { sales: [] };

// ============================================================
// ЎҚУВ РЕЖИМИ — операторлар машқ қилиши учун. Ёқилганда, шакллар худди
// одатдагидек ишлайди (текшириш экрани ҳам чиқади), лекин "Тасдиқлаш"
// босилганда ҲЕЧ НАРСА базага ёзилмайди — фақат натижа кўрсатилади.
// Алоҳида база қурилмаган (мураккаблик учун), шунчаки ёзиш қадами
// сохталаштирилади. Саҳифа қайта юкланса ўчиб қолади (қасддан — доим
// ёдда бўлсин деб).
// ============================================================
let trainingMode = false;
function toggleTrainingMode(){ trainingMode = !trainingMode; renderTab(); }
function trainingBannerHtml(){
  return !trainingMode ? '' : `<div class="review-warn" style="margin-bottom:14px">🎓 ЎҚУВ РЕЖИМИ ёқилган — бу ерда киритган ҳеч нарса базага сақланмайди, фақат машқ учун.</div>`;
}
function trainingToggleBtnHtml(){
  return `<button class="btn ${trainingMode?'':'secondary'} small" style="margin-bottom:12px" onclick="toggleTrainingMode()">${trainingMode?'🎓 Ўқув режими — YONIQ (босиб ўчиринг)':'🎓 Ўқув режимини ёқиш (машқ учун, ҳеч нарса сақланмайди)'}</button>`;
}
let activeTab = null;
// Танланган станция: 'metan' | 'benzin' | 'umumiy' | null (ҳали танланмаган).
// profile.station 'both' бўлганларгина (CEO/директор) буни ўзгартира олади,
// бошқаларга логиндаёқ автоматик белгиланади.
let currentStation = null;

const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const pct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';
const todayISO = () => new Date().toISOString().slice(0,10);
const monthISO = (d) => d.slice(0,7)+'-01';
const toast = (msg) => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); };
const esc = s => (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// SHEET (bottom-sheet модал) — карточка/қатор устига босганда
// "ичига кириб" таҳрирлаш ҳисси берадиган умумий компонент.
// Мобилда пастдан тўлиқ чиқади, катта экранда марказда dialog.
// ============================================================
function openSheet(innerHtml, opts){
  opts = opts || {};
  let backdrop = document.getElementById('sheetBackdrop');
  let sheet = document.getElementById('sheetPanel');
  if(!backdrop){
    backdrop = document.createElement('div');
    backdrop.id = 'sheetBackdrop';
    backdrop.className = 'sheet-backdrop';
    backdrop.onclick = closeSheet;
    document.body.appendChild(backdrop);
  }
  if(!sheet){
    sheet = document.createElement('div');
    sheet.id = 'sheetPanel';
    sheet.className = 'sheet';
    sheet.setAttribute('role','dialog');
    document.body.appendChild(sheet);
  }
  sheet.innerHTML = `<div class="sheet-handle"></div><button class="sheet-close" onclick="closeSheet()" title="Ёпиш" aria-label="Ёпиш">✕</button><div class="sheet-body">${innerHtml}</div>`;
  document.body.classList.add('sheet-lock');
  requestAnimationFrame(()=>{
    backdrop.classList.add('open');
    sheet.classList.add('open');
  });
  if(opts.afterOpen) opts.afterOpen();
}
function closeSheet(){
  const backdrop = document.getElementById('sheetBackdrop');
  const sheet = document.getElementById('sheetPanel');
  if(backdrop) backdrop.classList.remove('open');
  if(sheet) sheet.classList.remove('open');
  document.body.classList.remove('sheet-lock');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

// ============================================================
// SIDE MENU (чап томондан чиқадиган drawer) — аккаунт маълумоти ва
// тўлиқ навигация рўйхати, топбардаги гамбургер тугмаси орқали
// очилади. Станция алмаштириш ва чиқиш энди шу ерда (топбар
// тозароқ бўлиши учун).
// ============================================================
function userInitials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}
function tplSideMenu(){
  const role = state.profile.role;
  const canSwitch = (state.profile.station || 'both') === 'both';
  const nav = navTabsFor(role, currentStation);
  const items = nav.all.map(([id,label])=>
    `<button class="drawer-item${id===activeTab?' active':''}" onclick="switchTab('${id}');closeSideMenu()">${tabIconSvg(id)}<span>${esc(stripEmoji(label))}</span></button>`
  ).join('');
  return `
  <div class="drawer-head">
    <button class="drawer-close" onclick="closeSideMenu()" aria-label="Ёпиш">✕</button>
    <div class="drawer-avatar">${esc(userInitials(state.profile.full_name))}</div>
    <div class="drawer-name">${esc(state.profile.full_name)}</div>
    <div class="drawer-role">${roleLabel(role)} — ${currentStation==='metan'?'Метан':(currentStation==='benzin'?'Бензин':'Умумий ҳолат')}</div>
  </div>
  <div class="drawer-section-title">Бўлимлар</div>
  ${items}
  <div class="drawer-divider"></div>
  ${canSwitch?`<button class="drawer-item" onclick="closeSideMenu();switchStation()"><svg class="tab-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>Станцияни алмаштириш</span></button>`:''}
  <button class="drawer-item danger" onclick="closeSideMenu();doLogout()"><svg class="tab-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Чиқиш</span></button>`;
}
function openSideMenu(){
  let backdrop = document.getElementById('drawerBackdrop');
  let drawer = document.getElementById('drawerPanel');
  if(!backdrop){
    backdrop = document.createElement('div');
    backdrop.id = 'drawerBackdrop';
    backdrop.className = 'drawer-backdrop';
    backdrop.onclick = closeSideMenu;
    document.body.appendChild(backdrop);
  }
  if(!drawer){
    drawer = document.createElement('div');
    drawer.id = 'drawerPanel';
    drawer.className = 'drawer';
    document.body.appendChild(drawer);
  }
  drawer.innerHTML = tplSideMenu();
  document.body.classList.add('sheet-lock');
  requestAnimationFrame(()=>{ backdrop.classList.add('open'); drawer.classList.add('open'); });
}
function closeSideMenu(){
  const backdrop = document.getElementById('drawerBackdrop');
  const drawer = document.getElementById('drawerPanel');
  if(backdrop) backdrop.classList.remove('open');
  if(drawer) drawer.classList.remove('open');
  document.body.classList.remove('sheet-lock');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSideMenu(); });

// ============================================================
// OFFLINE QUEUE — интернет йўқ пайтда кунлик ҳисоботни телефонда
// сақлаб қолиш ва интернет қайтганда автоматик юбориш. localStorage
// ишлатамиз (IndexedDB эмас) — бир нечта кутилаётган ҳисобот учун бу
// етарли ва оддийроқ. iOS Safari/PWA Background Sync API'ни қўллаб-
// қувватламайди, шунинг учун синхронизация фақат илова очиқ/фаол
// бўлганда (онлайн бўлганда ёки 'online' ҳодисасида) ишга тушади —
// бу икки платформада (Android ва iPhone) ҳам ишлайдиган ягона усул.
// ============================================================
const OFFLINE_QUEUE_KEY = 'mm_offline_queue_v1';
function loadOfflineQueueFromStorage(){
  try{ return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)) || []; }catch(e){ return []; }
}
let offlineQueue = loadOfflineQueueFromStorage();
function saveOfflineQueueToStorage(){
  try{ localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(offlineQueue)); }catch(e){}
}
function isOnline(){ return typeof navigator==='undefined' || navigator.onLine!==false; }
// Supabase'дан қайтган хато "тармоқ йўқлиги" сабабли эканини тахмин
// қилади (бизнес-мантиқ хатоси — масалан дублика сана — эмас).
function isNetworkError(e){
  if(!isOnline()) return true;
  if(!e) return false;
  if(e.code) return false; // PostgREST/Postgres хатоси — тармоқ эмас, ҳақиқий хато
  const msg = ((e.message||'')+'').toLowerCase();
  return e instanceof TypeError || msg.includes('fetch') || msg.includes('network') || msg.includes('load failed');
}
function queueOfflineSubmission(type, payload){
  const item = { id: 'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,8), type, payload, createdAt: new Date().toISOString(), status:'pending', error:null };
  offlineQueue.push(item);
  saveOfflineQueueToStorage();
  renderOfflineBanner();
  return item;
}
function removeFromOfflineQueue(id){
  offlineQueue = offlineQueue.filter(i=>i.id!==id);
  saveOfflineQueueToStorage();
  renderOfflineBanner();
}
function markQueueItemError(id, message){
  const item = offlineQueue.find(i=>i.id===id);
  if(item){ item.status='error'; item.error=message; }
  saveOfflineQueueToStorage();
  renderOfflineBanner();
}
function discardQueueItem(id){
  if(!confirm("Бу ҳисоботни бутунлай ўчирасизми? (ҳеч қачон юборилмайди, базага ёзилмайди)")) return;
  removeFromOfflineQueue(id);
}
function renderOfflineBanner(){
  const el = document.getElementById('offlineBanner');
  if(!el) return;
  if(!offlineQueue.length){ el.innerHTML=''; return; }
  const waiting = offlineQueue.filter(i=>i.status==='pending');
  const errored = offlineQueue.filter(i=>i.status==='error');
  el.innerHTML = `
  <div class="card" style="border-color:var(--warn);background:var(--gold-wash);margin-bottom:14px">
    <div class="section-title">
      <h2 style="color:var(--warn)">📤 ${waiting.length?`${waiting.length} та ҳисобот юборилишни кутмоқда`:''}${waiting.length&&errored.length?' · ':''}${errored.length?`${errored.length} та хато`:''}</h2>
      ${waiting.length?`<button class="btn small" onclick="syncOfflineQueue()">Қайта юбориш</button>`:''}
    </div>
    ${waiting.length?`<p class="hint">Интернет йўқ пайтда телефонда сақланган — интернет қайтганда автоматик юборилади. Иловани ёпманг, фақат интернетга уланинг.</p>`:''}
    ${offlineQueue.map(item=>`
      <div class="list-card" style="cursor:default">
        <div class="list-card-main">
          <div class="list-card-name">${item.type==='metan_entry'?'Метан':'Бензин'} ҳисоботи — ${esc(item.payload.date)}</div>
          <div class="list-card-meta">${item.status==='error'?`<span style="color:var(--bad)">${esc(item.error||'хато')}</span>`:'Юборилиши кутилмоқда…'}</div>
        </div>
        ${item.status==='error'?`<button class="btn danger small" onclick="discardQueueItem('${item.id}')">Ўчириш</button>`:''}
      </div>`).join('')}
  </div>`;
}
async function submitMetanEntryPayload(f){
  const { data: entryRow, error } = await sb.from('entries').insert({
    date: f.date, operator_id: f.operator_id, operator_name: f.operator,
    pump_end: f.pumpEnd, agres: f.agres,
    uzcard: f.calc.uzcard, humo: f.calc.humo, qr: f.calc.qr,
    sold_m3: f.calc.soldM3, sales_value: f.calc.salesValue, naqt: f.calc.naqt,
    price: f.calc.price.sale_price,
    izoh: f.izoh
  }).select().single();
  if(error) throw error;
  if(f.deliveries && f.deliveries.length){
    const rows = f.deliveries.map(d=>({entry_id: entryRow.id, company_id: d.company_id, m3: d.m3}));
    const { error: e2 } = await sb.from('deliveries').insert(rows);
    if(e2) throw e2;
  }
}
async function submitBenzinEntryPayload(f){
  const { data: entryRow, error } = await sb.from('benzin_entries').insert({
    date: f.date, operator_id: f.operator_id, operator_name: f.operator,
    readings: f.readings, naqd: f.naqd, uzkard: f.uzkard, xumo: f.xumo,
    kechagi_note: f.kechagiVal ? parseFloat(f.kechagiVal) : null,
    izoh: f.izoh
  }).select().single();
  if(error) throw error;
  if(f.sales && f.sales.length){
    const rows = f.sales.map(s=>({ entry_id: entryRow.id, company_id: s.company_id, fuel_type_id: s.fuel_type_id, liters: s.liters, price: s.price, sum: s.sum }));
    const { error: e2 } = await sb.from('benzin_company_sales').insert(rows);
    if(e2) throw e2;
  }
}
// Навбатдаги ҳар бир ёзувни кетма-кет юборишга ҳаракат қилади. Тармоқ
// хатосига дуч келса — тўхтайди (ҳали оффлайн, кейинроқ қайта уринилади).
// Бизнес-мантиқ хатосига (масалан дублика сана) дуч келса — шу ёзувни
// "хато" деб белгилайди ва кейингисига ўтади (абадий қайтармайди).
let syncInProgress = false;
async function syncOfflineQueue(){
  if(syncInProgress || !isOnline() || !offlineQueue.length) return;
  syncInProgress = true;
  let changed = false;
  for(const item of offlineQueue.slice()){
    if(item.status==='error') continue;
    try{
      if(item.type==='metan_entry') await submitMetanEntryPayload(item.payload);
      else if(item.type==='benzin_entry') await submitBenzinEntryPayload(item.payload);
      removeFromOfflineQueue(item.id);
      changed = true;
    }catch(e){
      if(isNetworkError(e)){ break; }
      markQueueItemError(item.id, friendlyDbError(e));
      changed = true;
    }
  }
  syncInProgress = false;
  if(changed){ toast("Сақланган ҳисобот(лар) юборилди ✓"); await loadAll(); renderTab(); }
  renderOfflineBanner();
}
window.addEventListener('online', syncOfflineQueue);

// Операторлар учун ҳақиқий email очиш шарт эмас — "логин" (username)
// билан кирадилар. Ичкарида Supabase'нинг ўзи ҳамон email талаб қилади,
// шунинг учун "username" ни кўринмас тарзда "username@mangitmetan.local"
// қилиб юборамиз. Аккаунт очишда ҳам email ўрнига шу форматни ишлатинг.
const LOGIN_DOMAIN = '@mangitmetan.local';
function toLoginEmail(input){
  input = input.trim();
  return input.includes('@') ? input : (input.toLowerCase() + LOGIN_DOMAIN);
}
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="card login-card">
      <div style="display:flex;justify-content:center;margin-bottom:14px">${filopMarkSvg(56)}</div>
      <h1>Мангит Метан</h1>
      <p class="sub">Кунлик ҳисобот ва бошқарув тизими</p>
      <div class="field" style="text-align:left"><label>Логин</label><input type="text" id="loginEmail" autocapitalize="off" autocomplete="username"></div>
      <div class="field" style="text-align:left"><label>Парол</label><input type="password" id="loginPass"></div>
      <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Кириш</button>
      <p class="hint" id="loginErr" style="color:var(--bad)"></p>
    </div>`;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const email = toLoginEmail(document.getElementById('loginEmail').value);
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Текширилмоқда…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Кириш';
  if(error){ document.getElementById('loginErr').textContent = 'Логин ёки парол хато'; return; }
  await afterLogin(data.session);
}

async function doLogout(){
  await sb.auth.signOut();
}

async function afterLogin(session){
  state.session = session;
  let profile = null, offlineColdStart = false;
  try{
    const res = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if(res.error) throw res.error;
    profile = res.data;
  }catch(e){
    // Тармоқ йўқлиги сабабли бўлса — кешдан фойдаланишга ҳаракат қиламиз
    // (пастда). Бошқа хато бўлса, profile baribir null қолади.
  }
  if(!profile){
    const cached = loadStateCache();
    if(cached && cached.profile && cached.profile.id === session.user.id){
      profile = cached.profile;
      offlineColdStart = true;
    }
  }
  if(!profile){
    document.getElementById('app').innerHTML = `<div class="card login-card"><p>Ҳисобингиз ҳали ролга боғланмаган, ёки интернет йўқ ва аввал бу қурилмада киритилмаган. Интернетга уланиб қайта уриниб кўринг.</p><button class="btn secondary" onclick="doLogout()">Чиқиш</button></div>`;
    return;
  }
  state.profile = profile;
  const station = profile.station || 'both';
  if(station === 'both' && profile.role === 'ceo'){
    // CEO/Owner учун: аввало станция танлаш эмас, тўғридан-тўғри умумий
    // ҳолат (бизнеснинг энг муҳим рақамлари ва харажат киритиш тезкор
    // тугмалари) кўринади — станция танлаш "🔁 Станция" тугмаси орқали
    // кейин ҳам мумкин.
    currentStation = 'umumiy';
  } else {
    currentStation = (station === 'both') ? null : station; // 'both' -> танлов экранини кўрсатади
  }
  let dataLoadFailed = false;
  try{
    if(offlineColdStart) throw new Error('offline cold start');
    await loadAll();
  }catch(e){
    // Интернет йўқ ва илова қайта очилган — кешланган эски маълумотдан
    // фойдаланамиз, токи оператор ҳисоботни киритиб, навбатга қўя олсин.
    const cached = loadStateCache();
    if(cached && cached.state){
      Object.assign(state, cached.state);
      state.profile = profile;
      state.session = session;
      toast("📡 Интернет йўқ — эски маълумотлар кўрсатилмоқда. Киритилган ҳисобот интернет қайтганда юборилади.");
    } else {
      // Ҳеч қандай захира йўқ — операторни/CEOни БЎШ экранда жим қолдирмаймиз,
      // аниқ огоҳлантирамиз ва қайта уриниш тугмасини берамиз.
      dataLoadFailed = true;
    }
  }
  if(dataLoadFailed){
    document.getElementById('app').innerHTML = `<div class="card login-card">
      <p>⚠ Маълумотларни серверда юклаб бўлмади (интернет узилган ёки вақтинчалик хатолик). Кўрсатилаётган "бўш" экранлар — ҳақиқий бўшлик эмас, фақат юкланмаган.</p>
      <button class="btn" style="width:100%;margin-top:10px" onclick="location.reload()">Қайта уриниш</button>
      <button class="btn secondary" style="width:100%;margin-top:10px" onclick="doLogout()">Чиқиш</button>
    </div>`;
    return;
  }
  renderShell();
  syncOfflineQueue();
}

// Интернет бўлган пайтда юкланган маълумотни телефонда сақлаб қўяди —
// кейин интернет йўқ пайтда иловани қайта очганда ҳам (онлайн сессия
// давом этмаган тақдирда ҳам) эски маълумот билан ишлаш, ҳисобот
// киритиш ва навбатга қўйиш мумкин бўлиши учун.
const STATE_CACHE_KEY = 'mm_state_cache_v1';
function saveStateCache(){
  try{ localStorage.setItem(STATE_CACHE_KEY, JSON.stringify({ state, profile: state.profile, currentStation, savedAt: Date.now() })); }catch(e){}
}
function loadStateCache(){
  try{ return JSON.parse(localStorage.getItem(STATE_CACHE_KEY)); }catch(e){ return null; }
}

function priceFor(dateStr){
  let best = state.prices[0] || {sale_price:5500, cost_price:2750, excise:780, loss_coefficient:0.986};
  for(const p of state.prices){ if(p.effective_date <= dateStr) best = p; }
  return best;
}
function taxFor(dateStr){
  let best = state.taxRates[0] || {nds_rate:0.12, social_tax_rate:0.01, profit_tax_rate:0.075};
  for(const t of state.taxRates){ if(t.effective_date <= dateStr) best = t; }
  return best;
}
function fixedCostFor(dateStr, station){
  station = station || 'metan';
  const rows = state.fixedCosts.filter(f=> (f.station||'metan')===station );
  let best = rows[0] || {salary:0, bank_loan_interest:0, land_property_tax:0, electricity_tariff:0};
  rows.forEach(f=>{ if(f.effective_date <= dateStr) best = f; });
  return best;
}
function pumpBaseline(){
  if(state.entries.length){
    // entries loaded newest-first
    return state.entries[0].pump_end;
  }
  return SEED_PUMP_START;
}
// Компания қайси станция(лар)га тегишли — метан ва бензин мижозлари
// рўйхатда аралашиб кетмаслиги учун. 'both' — иккала жойда ҳам кўринади.
function companiesForStation(station){
  return state.companies.filter(c => (c.station||'both')==='both' || (c.station||'both')===station);
}
function companyTotals(station){
  const totals = {};
  const list = station ? companiesForStation(station) : state.companies;
  list.forEach(c=> totals[c.id] = { id:c.id, name:c.name, station:c.station||'both', m3:c.seed_m3||0, sold:c.seed_sold||0, paid:c.seed_paid||0 });
  state.deliveries.forEach(d=>{
    const t = totals[d.company_id]; if(!t) return;
    // Баъзи эски/қўшилган ёзувларда entries.price бўш чиқиши мумкин
    // (масалан, RLS ёки эски сатрларда устун тўлдирилмаган бўлса) —
    // шунда компания балансида "сотилган сумма" 0 бўлиб қолиб,
    // баланс нотўғри кўриниб қоларди. Шу сабабли бўш бўлса,
    // ўша куннинг нарх тарихидан (priceFor) тиклаб олинади.
    let price = (d.entries && Number(d.entries.price)) || 0;
    if(!price){
      const delDate = d.entries && d.entries.date;
      if(delDate) price = priceFor(delDate).sale_price || 0;
    }
    t.m3 += Number(d.m3)||0;
    t.sold += (Number(d.m3)||0) * price;
  });
  state.payments.forEach(p=>{
    const t = totals[p.company_id]; if(!t) return;
    t.paid += Number(p.amount)||0;
  });
  Object.values(totals).forEach(t => { t.balance = t.paid - t.sold; });
  return Object.values(totals);
}

function tabIconSvg(id){
  const p = TAB_ICONS[id];
  if(!p) return '';
  return `<svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}
// Табдаги эмодзини олиб ташлаб, тоза матнни қолдиради (иконка алоҳида
// SVG сифатида чиқади, лейблда яна эмодзи қайтарилмасин учун).
function stripEmoji(label){
  return label.replace(/^\S+\s*/, '').trim();
}
// Гуруҳга қараб иконка-доирачанинг ранги (Бош саҳифа катакчалари учун) —
// мавжуд tabGroup(id) таксономиясидан фойдаланади, янги тоифа ўйлаб
// топилмайди.
function tabGroupColor(id){
  return tabGroup(id); // 'work'|'overview'|'reports'|'manage'|'system'|'other' — CSS класс номи билан бир хил
}
// Айрим роль/станция жуфтлари учун пастки навигацияда ТЎҚҒРИДАН-ТЎҚҒРИ
// кўринадиган (энг кўп ишлатиладиган) 3 таб — қолганлари "Бош саҳифа"
// катакчалари ичида. Кўрсатилмаганлар учун дастлабки 3 таб олинади.
const QUICK_TABS = {
  'metan_direktor': ['overview','reports','expenses'],
  'metan_ceo': ['overview','entry','expenses'],
  'benzin_ceo': ['bz_daily','bz_reports','bz_expenses'],
};
// Жорий роль/станция учун пастки навигация таркибини ҳисоблайди:
// таблар 4 тадан кам/тенг бўлса — ҳаммаси тўғридан-тўғри кўринади;
// кўп бўлса — 3 "тезкор" таб + "Бош саҳифа" (қолган ҳаммаси у ерда).
function navTabsFor(role, station){
  const all = tabsForRole(role, station);
  if(all.length <= 4) return { quick: all, hasHome: false, all };
  const pref = QUICK_TABS[station + '_' + role];
  let quick = pref ? pref.map(id => all.find(t=>t[0]===id)).filter(Boolean) : all.slice(0,3);
  if(quick.length < 3) quick = all.slice(0,3);
  return { quick, hasHome: true, all };
}
// FILOP бренд белгиси — "уч устун, битта том" (қурилиш пештоқидаги
// учта устун ва ягона томнинг рамзи — "Уч ustun. Bitta tom. Bitta ishonch.").
// Доимо шу тўрт рангда чизилади (тема эмас, брендга қатъий боғлиқ).
function filopMarkSvg(px){
  px = px || 40;
  return `<svg width="${px}" height="${px}" viewBox="0 0 64 64" style="flex-shrink:0" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#0B2F5B"/>
    <rect x="16" y="19" width="32" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="17" y="27" width="8" height="22" rx="3" fill="#F6B93B"/>

    <rect x="39" y="27" width="8" height="22" rx="3" fill="#F6B93B"/>
  </svg>`;
}

// "Бош саҳифа" экрани — табл кўп бўлган роль/станцияларда (7-9 та)
// ҳаммасини йирик, осон топиладиган icon-badge катакчалар орқали
// кўрсатади (Soliq-иловаси каби). Худди choice-card каби, лекин
// тур (grid) кўринишида — экранга сиғиши учун.
// Гуруҳ номлари ва тартиби — "Бош саҳифа" экранида таблар алоҳида-алоҳида
// сарлавҳалар остида кўрсатилади (худди молиявий иловаларга хос "Кунлик
// иш / Умумий / Ҳисоботлар / Бошқарув / Созламалар" бўлиниши каби).
const GROUP_LABELS = {work:'Кунлик иш', overview:'Умумий', reports:'Ҳисоботлар', manage:'Бошқарув', system:'Созламалар', other:'Бошқа'};
const GROUP_ORDER = ['work','overview','reports','manage','system','other'];
function tplHomeGrid(tabs){
  const byGroup = {};
  tabs.forEach(t=>{ const g = tabGroupColor(t[0]); (byGroup[g]=byGroup[g]||[]).push(t); });
  const sections = GROUP_ORDER.filter(g=>byGroup[g] && byGroup[g].length).map(g=>{
    const items = byGroup[g].map(([id,label])=>`
      <button class="nav-tile" onclick="switchTab('${id}')">
        <span class="nav-tile-icon ${g}">${tabIconSvg(id).replace('class="tab-icon"','')}</span>
        <span class="nav-tile-label">${esc(stripEmoji(label))}</span>
      </button>`).join('');
    return `<div class="nav-group">
      <h3 class="nav-group-title grp-${g}">${GROUP_LABELS[g]}</h3>
      <div class="nav-grid">${items}</div>
    </div>`;
  }).join('');
  return `<h2 style="margin-top:4px">Бош саҳифа</h2>
  <p class="hint" style="margin-bottom:16px">Керакли бўлимни танланг.</p>
  ${sections}`;
}

function renderGazForecast(){

  const box = document.getElementById('gazForecastBox');

  const ym = monthEl.value || nextMonthKey();
  const f = forecastGazPrepayment(ym);

  box.innerHTML = `
    <div class="tile-row" style="margin-top:10px">

    </div>
    <p class="hint" style="margin-top:8px">
      ${f.hasSeasonality
        ? `Асос: шу йилги ўртача ${fmt(f.avgNow)} m3/ой × мавсумий коэфф. ${f.seasonalIndex.toFixed(2)} (ўтган йил ${f.lastYearYm} ойи, ${fmt(f.lastYearVol)} m3, олдинги 3 ой ўртачаси ${fmt(f.lastYearAvgPrev3)} m3 га нисбатан). Нарх: ${fmt(f.costPrice)} сўм/m3.`
        : `⚠ Мавсумийлик ҳисобга олинмади (ўтган йил ${f.lastYearYm} учун маълумот йўқ) — фақат шу йилги ўртача ${fmt(f.avgNow)} m3/ой асосида. Нарх: ${fmt(f.costPrice)} сўм/m3.`}

    <h3 style="margin-top:14px">Заҳира (ФИФО)</h3>

      <div class="tile"><div class="label">Жами препейментланган</div><div class="value">${fmt(s.totalVolume)} m³</div></div>
      <div class="tile"><div class="label">Жами ишлатилган</div><div class="value">${fmt(s.consumedVolume)} m³</div></div>
      <div class="tile"><div class="label">Қолдиқ (ҳажм)</div><div class="value ${s.remainingVolume<0?'bad':'good'}">${fmt(s.remainingVolume)} m³</div></div>
      <div class="tile"><div class="label">Қолдиқ (қиймати)</div><div class="value ${s.remainingValue<0?'bad':'good'}">${fmt(s.remainingValue)} сўм</div></div>
    </div>
    <p class="hint" style="margin-top:6px">Қолдиқ — ҳар бир препеймент партиясининг ҲАЛИ ИШЛАТИЛМАГАН қисми, ўзининг нархида (ФИФО). Ҳажми (m3) киритилмаган эски партиялар учун тахминий ҳажм ишлатилади.</p>`;
}

// Банк кўчирмасини юклаш/қўлда киритиш ва ҚАЕРГА (бизнес + лойиҳа)
// тегишли эканини белгилаш (teglash), шунингдек лойиҳалар бўйича
// жами баланс.
// ============================================================
const PROJECT_LABELS = {
  benzin: 'Бензин',
  metan: 'Метан',
  restoran: 'Ресторан',
  uchaska: '40 та участка',
  qurilish_kompaniya: 'Қурилиш компанияси (шериклар)'
};
const ENTITY_LABELS = { servis: 'Сервис', mangit_metan: 'Мангит Метан' };

function tplFinance(){
  const rows = state.bankTx || [];
  const untaggedCount = rows.filter(r=>!r.project).length;
  const totalsByProject = {};
  Object.keys(PROJECT_LABELS).forEach(k=> totalsByProject[k] = 0);
  const totalsByEntity = { servis: 0, mangit_metan: 0 };
  rows.forEach(r=>{
    const amt = Number(r.amount) || 0;
    if(r.project && totalsByProject.hasOwnProperty(r.project)) totalsByProject[r.project] += amt;
    if(r.entity && totalsByEntity.hasOwnProperty(r.entity)) totalsByEntity[r.entity] += amt;
  });
  const sorted = rows.slice().sort((a,b)=> a.tx_date < b.tx_date ? 1 : -1);
  return `

async function importBankTxFile(){
  const fileEl = document.getElementById('bt_file');
  const statusEl = document.getElementById('bt_import_status');
  if(!fileEl.files.length){ statusEl.textContent = 'Файл танланмади'; return; }
  const file = fileEl.files[0];
  statusEl.textContent = 'Юкланяпти...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rawRows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(!rawRows.length){ statusEl.textContent = 'Файлда маълумот топилмади'; return; }
    const headers = Object.keys(rawRows[0]);
    const findCol = (keys) => headers.find(h => keys.some(k => String(h).toLowerCase().includes(k)));
    const dateCol = findCol(['sana','дата','date','кун']);
    const amountCol = findCol(['sum','сумма','amount','miqdor','миқдор']);
    const debitCol = findCol(['чиқим','debet','дебет','расход','chiqim','списан']);
    const creditCol = findCol(['кирим','kredit','кредит','доход','kirim','зачисл']);
    const partyCol = findCol(['контрагент','kontragent','получатель','отправитель','клиент','nomi','плательщик']);
    const descCol = findCol(['назначение','izoh','описание','maqsad',"ta'rif",'коммент']);
    if(!dateCol || (!amountCol && !debitCol && !creditCol)){
      statusEl.textContent = 'Устунларни аниқлаб бўлмади. Файлдаги устунлар: '+headers.join(', ')+'. Қўлда қўшинг.';
      return;
    }
    const parsed = rawRows.map(r=>{
      let amount;
      if(amountCol) amount = parseFloat(r[amountCol]) || 0;
      else {
        const debit = parseFloat(r[debitCol]) || 0;
        const credit = parseFloat(r[creditCol]) || 0;
        amount = credit - debit;
      }
      const dateVal = r[dateCol];
      let tx_date;
      if(typeof dateVal === 'number'){
        const d = XLSX.SSF.parse_date_code(dateVal);
        tx_date = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      } else {
        const s = String(dateVal).trim();
        const m = s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
        if(m) tx_date = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
        else tx_date = s.slice(0,10);
      }
      return {
        tx_date,
        amount,
        counterparty: partyCol ? String(r[partyCol]||'').trim() || null : null,
        description: descCol ? String(r[descCol]||'').trim() || null : null,
        created_by_name: state.profile.full_name
      };
    }).filter(r=> r.tx_date && /^\d{4}-\d{2}-\d{2}$/.test(r.tx_date) && !isNaN(r.amount) && r.amount !== 0);
    if(!parsed.length){ statusEl.textContent = 'Тўғри сатрлар топилмади. Файлдаги устунлар: '+headers.join(', '); return; }
    const { error } = await sb.from('bank_tx').insert(parsed);
    if(error){ statusEl.textContent = 'Хатолик: '+error.message; return; }
    statusEl.textContent = `${parsed.length} та сатр юкланди ✓ — энди пастдаги жадвалда ҳар бирини белгиланг.`;
    toast(`${parsed.length} та транзакция қўшилди ✓`);
    fileEl.value = '';
    await loadAll(); renderTab();
  }catch(e){
    statusEl.textContent = 'Хатолик: '+e.message;
  }
}
async function addBankTxManual(){
  const amount = parseFloat(document.getElementById('bt_amount').value);
  if(isNaN(amount) || !document.getElementById('bt_date').value){ toast('Сана ва суммани киритинг'); return; }
  const { error } = await sb.from('bank_tx').insert({
    tx_date: document.getElementById('bt_date').value,
    amount,
    counterparty: document.getElementById('bt_counterparty').value.trim() || null,
    description: document.getElementById('bt_desc').value.trim() || null,
    created_by_name: state.profile.full_name
  });
  if(error){ toast('Хатолик: '+error.message); return; }
  toast('Сақланди ✓'); await loadAll(); renderTab();
}
async function saveBankTxTag(id, field, value){
  const patch = {}; patch[field] = value || null;
  const { error } = await sb.from('bank_tx').update(patch).eq('id', id);
  if(error){ toast('Хатолик: '+error.message); return; }
  const row = (state.bankTx||[]).find(r=>r.id===id);
  if(row) row[field] = value || null;
  toast('Сақланди ✓');
}
async function deleteBankTx(id){
  if(!confirm('Ўчирасизми?')) return;
  const { error } = await sb.from('bank_tx').delete().eq('id', id);
  if(error){ toast('Хатолик: '+error.message); return; }
  toast('Ўчирилди ✓'); await loadAll(); renderTab();
}

  { key: 'qurilish_kompaniya', name: 'Қурилиш компаниясига инвестиция', hint: 'Таниш ва унинг 3 ўғли бошқарадиган қурилиш компаниясига қилинган инвестиция — расмий тизим йўқ, шунинг учун шу ерда назорат қилинади.' }

function projectMoneyTotals(key){
  const rows = (state.bankTx||[]).filter(r=>r.project===key);
  let inflow=0, outflow=0;
  rows.forEach(r=>{ const a=Number(r.amount)||0; if(a>=0) inflow+=a; else outflow+=-a; });
  return { inflow, outflow, net: inflow-outflow, count: rows.length };
}
function projectBalanceTrendSeries(){
  const keys = INVESTMENT_PROJECTS.map(p=>p.key);
  const rows = (state.bankTx||[]).filter(r=>r.project && keys.includes(r.project) && r.tx_date);
  const months = [...new Set(rows.map(r=>r.tx_date.slice(0,7)))].sort();
  const datasets = INVESTMENT_PROJECTS.map(p=>{
    let running = 0;
    const data = months.map(m=>{
      const sum = rows.filter(r=>r.project===p.key && r.tx_date.slice(0,7)===m).reduce((s,r)=>s+(Number(r.amount)||0),0);
      running += sum;
      return running;
    });
    return { label: p.name, data };
  });
  return { labels: months.map(m=>m.slice(2)), datasets };
}

function recalcPreview(){
  const baseline = pumpBaseline();
  const pumps = PUMP_NAMES.map((_,i)=>{
    const el = document.getElementById('pump_'+i);
    return el ? parseFloat(el.value) : NaN;
  });
  let soldM3 = 0, ok = true;
  pumps.forEach((v,i)=>{ if(isNaN(v)){ ok=false; return; } soldM3 += (v - baseline[i]); });
  const date = document.getElementById('f_date').value || todayISO();
  const price = priceFor(date);
  const salesValue = ok ? soldM3 * price.sale_price : NaN;
  const uzcard = parseFloat(document.getElementById('f_uzcard').value)||0;
  const humo = parseFloat(document.getElementById('f_humo').value)||0;
  const qr = parseFloat(document.getElementById('f_qr').value)||0;
  const naqt = ok ? (salesValue - uzcard - humo - qr) : NaN;
  document.getElementById('calcSoldM3').textContent = ok ? fmt(soldM3)+' m3' : '—';
  document.getElementById('calcSalesValue').textContent = ok ? fmt(salesValue)+" сўм" : '—';
  const naqtEl = document.getElementById('calcNaqt');
  naqtEl.textContent = ok ? fmt(naqt)+" сўм" : '—';
  naqtEl.className = 'value ' + (naqt < 0 ? 'bad' : 'good');
  return {soldM3, salesValue, naqt, uzcard, humo, qr, price, ok};
}
function buildPumpFields(){
  const wrap = document.getElementById('pumpFields');
  const baseline = pumpBaseline();
  wrap.innerHTML = PUMP_NAMES.map((name,i)=>

      <input type="number" id="pump_${i}" step="0.01" placeholder="ҳозирги кўрсаткич"></div>`).join('');
  wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcPreview));
}

    ${existing?`<button class="btn danger small" style="width:100%;margin-top:10px" onclick="removeDeliveryEntry('${companyId}')">Ўчириш</button>`:''}
  `);
}
function saveDeliveryEntry(companyId){
  const m3 = parseFloat(document.getElementById('de_m3').value);
  if(!m3){ toast("m3 киритинг"); return; }
  const c = state.companies.find(x=>x.id===companyId);
  const existing = pending.deliveries.find(d=>d.company_id===companyId);
  if(existing){ existing.m3 = m3; } else { pending.deliveries.push({company_id:companyId, companyName:c.name, m3}); }
  closeSheet();
  renderDeliveryGrid();
}
function removeDeliveryEntry(companyId){
  pending.deliveries = pending.deliveries.filter(d=>d.company_id!==companyId);
  closeSheet();
  renderDeliveryGrid();
}

// Gathers + validates the current form. Returns null (and toasts the
// problem) if something required is missing; otherwise returns everything
// needed both to render the review screen and to actually submit.
// Шу сана учун ҳисобот аллақачон бор-йўқлигини текшириш (дублика ёзувнинг
// олдини олиш учун — базада ҳам "date unique" чекланиши бор, бу фақат
// операторга ОЛДИНДАН, тушунарли хабар билан огоҳлантириш учун).
function entryExistsForDate(date, station){
  if(station==='benzin') return state.benzinEntries.some(e=>e.date===date);
  return state.entries.some(e=>e.date===date);
}
// Сана майдони ўзгарганда — шу кунга ҳисобот борми, йўқми, операторга
// ОЛДИНДАН (формани тўлдиришдан олдин) кўрсатиш учун.
function updateEntryDateWarning(station){
  const dateEl = document.getElementById(station==='benzin' ? 'bz_date' : 'f_date');
  const warnEl = document.getElementById(station==='benzin' ? 'bz_dateWarn' : 'f_dateWarn');
  if(!dateEl || !warnEl) return;
  const date = dateEl.value;
  if(date && entryExistsForDate(date, station)){
    warnEl.innerHTML = `<div class="review-warn" style="margin-top:8px">⚠ ${date} санасига ҳисобот АЛЛАҚАЧОН киритилган. Бу санани қайта юбориб бўлмайди — тўғри санани танланг ёки CEO'га мурожаат қилинг.</div>`;
  } else {
    warnEl.innerHTML = '';
  }
}
// Supabase'дан қайтган "duplicate key" хатосини операторга тушунарли
// ўзбекча хабарга айлантиради.
function friendlyDbError(error){
  if(error && (error.code==='23505' || /duplicate key|already exists/i.test(error.message||''))){
    return "Бу санага ҳисобот АЛЛАҚАЧОН киритилган — қайта юбориб бўлмайди. Агар хато бўлса, CEO'дан эски ёзувни тузатишни сўранг.";
  }
  return "Хатолик: " + ((error && error.message) || 'сақланмади');
}
function collectEntryForm(){
  const date = document.getElementById('f_date').value;
  const operator = document.getElementById('f_operator').value.trim();
  if(!date || !operator){ toast("Сана ва оператор исмини киритинг"); return null; }
  if(entryExistsForDate(date, 'metan')){ toast("Бу санага ҳисобот аллақачон киритилган — бошқа сана танланг ёки CEO'га мурожаат қилинг"); return null; }
  const calc = recalcPreview();
  if(!calc.ok){ toast("Барча помпа кўрсаткичларини киритинг"); return null; }
  const agres = parseFloat(document.getElementById('f_agres').value);
  if(isNaN(agres)){ toast("Агрес кўрсаткичини киритинг"); return null; }
  const baseline = pumpBaseline();
  const pumpEnd = PUMP_NAMES.map((_,i)=>parseFloat(document.getElementById('pump_'+i).value));
  const izoh = document.getElementById('f_izoh').value.trim() || null;
  return { date, operator, calc, agres, pumpEnd, baseline, izoh };
}

// Step 2: only runs after the operator ticked the confirm box on the
// review screen. This is the actual database write.
async function doSubmitEntry(){
  const f = collectEntryForm();
  if(!f){ closeReview(); return; }

  if(trainingMode){
    closeReview();
    toast("🎓 Машқ якунланди — бу ҳеч нарса базага ёзилмади");
    pending = {deliveries:[]};
    renderTab();
    return;
  }

  const payload = { ...f, operator_id: state.profile.id, deliveries: pending.deliveries.slice() };

  if(!isOnline()){
    queueOfflineSubmission('metan_entry', payload);
    closeReview();
    toast("📤 Интернет йўқ — ҳисобот телефонда сақланди, интернет қайтганда ўзи юборилади");
    pending = {deliveries:[]};
    renderTab();
    return;
  }

  const btn = document.getElementById('reviewSubmitBtn');
  btn.disabled = true; btn.textContent = 'Юборилмоқда…';
  try{
    await submitMetanEntryPayload(payload);
    closeReview();
    toast("Ҳисобот юборилди ✓");
    pending = {deliveries:[]};
    await loadAll();
    renderTab();
  }catch(e){
    if(isNetworkError(e)){
      queueOfflineSubmission('metan_entry', payload);
      closeReview();
      toast("📤 Интернетга уланиб бўлмади — ҳисобот телефонда сақланди, қайта уланганда ўзи юборилади");
      pending = {deliveries:[]};
      renderTab();
      return;
    }
    toast(friendlyDbError(e));
    btn.disabled = false; btn.textContent = 'Тасдиқлаш ва юбориш';
    await loadAll();
  }
}

// OVERVIEW — grouped dashboard (direktor + ceo)
// ============================================================
function currentMonthKey(){ return todayISO().slice(0,7); }

// Full monthly profit & loss for one calendar month (yyyy-mm).
// Every line is shown separately in renderPL() so the CEO/Direktor can
// verify each number against the source data - this is an ESTIMATE built
// from the entered rates, not a substitute for the accountant's own
// bookkeeping (NDS/tax math in particular is simplified).
// Matches the company's own official monthly report format exactly
// (Даромадлар / Харажатлар / Солиқлар / Фойда), verified line-by-line
// against a real submitted "МАНГИТ МЕТАН" hisobot:
//   Фойда = Даромад − Харажатлар(Газ+Электр+Иш ҳақи+Банк+Бошқа)
//           − Акциз − НДС(нетто) − Ижтимоий солиқ − Ер-мулк солиғи
//   Фойда солиғи = Фойда × ставка (ижтимоий солиқ АЛЛАҚАЧОН айирилган
//   бўлгандан кейин ҳисобланади)
//   Соф фойда = Фойда − Фойда солиғи
function computeMonthlyPL(monthStr){
  const monthEntries = state.entries.filter(e=> e.date && e.date.slice(0,7)===monthStr);
  let revenue=0, soldM3Total=0, agresTotal=0;
  monthEntries.forEach(e=>{
    revenue += Number(e.sales_value)||0;
    soldM3Total += Number(e.sold_m3)||0;
    agresTotal += Number(e.agres)||0;
  });
  // Narx (taннарх/акциз) o'zgargan bo'lishi mumkin oy ichida — shuning
  // uchun oyning ohirgi kunidagi ставкаdan foydalanamiz (rasmiy hisobot
  // ham bir oyga bitta ставка bilan ishlaydi).
  const pr = priceFor(monthStr+'-28');
  // Таннарх — таъминотчидан қанча газ СОТИБ ОЛИНГАНИ (Агрес, давлат
  // ҳисоблагичи) асосида — эски расмий ҳисоботдаги каби (пумпадан
  // сотилган m3 эмас). 2026-10-13дан бошлаб ФИФО орқали (ҳар бир gaz
  // препейменти ўз нархи билан) — гар ҳажми (volume_m3) киритилмаган
  // партиялар учун эски (бир хил таннарх) натижа сақланиб қолади.
  const gazCogsMap = gazFifoCogs();
  const cogsGas = monthEntries.reduce((s,e)=> s + (gazCogsMap[e.id]||0), 0);
  // Акциз — сотилган (пумпа) m3'дан олинадиган солиқ.
  const excise = soldM3Total * pr.excise;

  const fc = fixedCostFor(monthStr+'-01');
  // Электр учун Агрес каби "аниқ истеъмол" ўлчагичи йўқ (газдан фарқли
  // равишда) — шунинг учун электр харажати сифатида шу ойда ТЎЛАНГАН
  // препеймент (Ток) суммасининг ўзи олинади. Агар шу ой учун препеймент
  // ёзуви бўлмаса (тарихий ойлар), Созламалардаги қўлда киритилган
  // ойлик жами қиймат fallback сифатида ишлатилади.
  const prepayGaz = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='gaz').reduce((s,p)=>s+Number(p.amount||0),0);
  const prepayTok = state.prepayments.filter(p=>p.month && p.month.slice(0,7)===monthStr && p.kind==='tok').reduce((s,p)=>s+Number(p.amount||0),0);
  const electricity = prepayTok || Number(fc.electricity_tariff)||0;
  // Иш ҳақи — ХОДИМЛАР рўйхатидан (ҳар бирининг ойлиги алоҳида, тарихи
  // билан) ҳисобланади. Агар ҳали ходим киритилмаган бўлса (масалан эски
  // импорт қилинган ойлар), эски Доимий харажатлардаги якка рақамга
  // fallback қилинади.
  const salary = totalSalaryFor(monthStr, 'metan') || Number(fc.salary)||0;
  const bank = Number(fc.bank_loan_interest)||0;
  const land = Number(fc.land_property_tax)||0;
  const otherExp = state.otherExpenses.filter(e=>e.date && e.date.slice(0,7)===monthStr && (e.station||'metan')==='metan').reduce((s,e)=>s+Number(e.amount||0),0);
  const expensesTotal = cogsGas + electricity + salary + bank + otherExp;

  const tax = taxFor(monthStr+'-01');
  const ndsRate = Number(tax.nds_rate)||0;
  const outputVat = revenue * (ndsRate/(1+ndsRate));
  const inputVat = (cogsGas + electricity) * (ndsRate/(1+ndsRate));
  const ndsNet = outputVat - inputVat;
  const socialAmount = salary * (Number(tax.social_tax_rate)||0);

  const profitBeforeTax = revenue - expensesTotal - excise - ndsNet - socialAmount - land;
  const profitTaxAmount = Math.max(profitBeforeTax, 0) * (Number(tax.profit_tax_rate)||0);
  const netProfit = profitBeforeTax - profitTaxAmount;

  return { count: monthEntries.length, revenue, cogsGas, electricity, salary, bank, land, otherExp, expensesTotal,
    excise, outputVat, inputVat, ndsNet, socialAmount, profitBeforeTax, tax, profitTaxAmount, netProfit,
    prepayGaz, prepayTok };
}

// ============================================================
// ГАЗ ПРЕПЕЙМЕНТ БАШОРАТИ — "YYYY-MM" ойга қанча препеймент тавсия
// қилинади. Мантиқ (фойдаланувчи билан келишилган, 2026-10-13):
//   1) Шу йилги охирги 6 ойнинг ўртача Агрес ҳажми — "joriy tezlik".
//   2) Агар ўтган йилнинг ХУДДИ ШУ ойи ва ундан олдинги 3 ойи мавжуд
//      бўлса — "mavsumiy koeffitsient" (seasonal index) ҳисобланади:
//      ўтган йил шу ой ҳажми / ўтган йилги олдинги 3 ой ўртачаси.
//      Бу рақам қишда авто-паст чиқади (ўтган йил ҳам қишда камайган
//      бўлгани учун) — "қайси ойлар қишки" деб қўлда белгилаш керак
//      эмас, тизим буни тарихнинг ўзидан "ўрганади".
//   3) Якуний ҳажм = joriy tezlik × mavsumiy koeffitsient (агар бор
//      бўлса), акс ҳолда фақат joriy tezlikнинг ўзи (огоҳлантириш
//      билан — мавсумийлик ҳисобга олинмаган).
//   4) Сумма = ҳажм × ҳозирги таннарх (сўм/m3, "Нарх" дан).
// Эслатма: бу ҲАЖМ-асосли башорат, ФИФО қолдиғини (ҳали қурилмаган)
// автоматик АЙИРМАЙДИ — шунинг учун пастда алоҳида "жорий баланс"
// (жами тўланган − жами сарфланган, сум бўйича, тахминий) кўрсатилади.
// ============================================================
// ============================================================
// ГАЗ ФИФО (бензиндаги benzinFifoCogs() нинг газ учун эгизаги):
// ҲАР БИР gaz препейменти (prepayments, kind='gaz') ўз "партияси" —
// ўзининь ҳажми (volume_m3) ва нархи (amount/volume_m3) билан.
// Агар volume_m3 бўш бўлса (эски қаторлар ёки CEO киритмаган) —
// ҳажм шу ойдаги Созламалар таннархи орқали тахминий ҳисобланади
// (натижада ЭСКИ хатти-ҳаракат сақланади — фақат ЯНГИ, ҳажми
// киритилган партиялар ҳақиқий ФИФО нархини беради).
// Истеъмол — ҳар кунлик ёзувнинг Агрес (давлат ҳисоблагичи) ҳажми
// бўйича, хронологик тартибда, энг эски партиядан бошлаб.
// ============================================================
let GAZ_FIFO_BATCHES = []; // охирги чақирувдан кейинги қолдиқ — "Заҳира" кўрсатиш учун
function gazFifoCogs(){
  const batches = state.prepayments.filter(p=>p.kind==='gaz').slice()
    .sort((a,b)=> a.month < b.month ? -1 : (a.month > b.month ? 1 : 0))
    .map(p=>{
      const amount = Number(p.amount)||0;
      let volume = p.volume_m3!=null ? Number(p.volume_m3) : null;
      if(volume == null || volume <= 0){
        const refPrice = priceFor((p.month||'').slice(0,7)+'-28').cost_price || 0;
        volume = refPrice > 0 ? amount/refPrice : 0;
      }
      const costPerM3 = volume > 0 ? amount/volume : 0;
      return { month: p.month, totalVolume: volume, remaining: volume, costPerM3, estimated: p.volume_m3==null };
    });
  const asc = state.entries.slice().sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const cogsByEntry = {};
  let lastKnownCost = null;
  asc.forEach(e=>{
    let need = Number(e.agres)||0;
    let cost = 0;
    for(const b of batches){
      if(need <= 0) break;
      if(b.remaining <= 0) continue;
      const take = Math.min(b.remaining, need);
      cost += take * b.costPerM3;
      b.remaining -= take;
      need -= take;
      if(b.costPerM3 > 0) lastKnownCost = b.costPerM3;
    }
    if(need > 0){
      const cpl = lastKnownCost != null ? lastKnownCost : priceFor(e.date).cost_price;
      cost += need * cpl;
    }
    cogsByEntry[e.id] = cost;
  });
  GAZ_FIFO_BATCHES = batches;
  return cogsByEntry;
}
// "Заҳира" — жами партия ҳажми, жами истеъмол (Агрес), қолдиқ (m3 ва
// қолган партияларнинг ўз нархида қиймати, сум). gazFifoCogs() ни
// чақиргандан кейинги GAZ_FIFO_BATCHES қолдиғидан фойдаланади.
function gazStockSummary(){
  gazFifoCogs(); // GAZ_FIFO_BATCHES'ни янгилаш учун
  const totalVolume = GAZ_FIFO_BATCHES.reduce((s,b)=>s+b.totalVolume,0);
  const remainingVolume = GAZ_FIFO_BATCHES.reduce((s,b)=>s+b.remaining,0);
  const remainingValue = GAZ_FIFO_BATCHES.reduce((s,b)=>s+b.remaining*b.costPerM3,0);
  const consumedVolume = totalVolume - remainingVolume;
  return { totalVolume, consumedVolume, remainingVolume, remainingValue };
}
function monthKeyAdd(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return y+'-'+String(m).padStart(2,'0');
}
function nextMonthKey(){ return monthKeyAdd(currentMonthKey(), 1); }
// Ой бўйича Агрес (давлат ҳисоблагичи) ҳажми — табиий газ харид ҳажми,
// COGS худди шу асосда ҳисобланади (pumpadan sotilgan m3 emas).
function metanMonthlyAgres(){
  const byMonth = {};
  state.entries.forEach(e=>{
    if(!e.date) return;
    const ym = e.date.slice(0,7);
    byMonth[ym] = (byMonth[ym]||0) + Number(e.agres||0);
  });
  return byMonth;
}
function forecastGazPrepayment(targetYm){
  const vol = metanMonthlyAgres();
  const recentYms = [1,2,3,4,5,6].map(i=>monthKeyAdd(targetYm,-i));
  const recentVals = recentYms.map(m=>vol[m]).filter(v=>v!==undefined && v>0);
  const avgNow = recentVals.length ? recentVals.reduce((a,b)=>a+b,0)/recentVals.length : null;

  const lastYearYm = monthKeyAdd(targetYm,-12);
  const lastYearVol = vol[lastYearYm];
  const lastYearPrev3 = [1,2,3].map(i=>vol[monthKeyAdd(lastYearYm,-i)]).filter(v=>v!==undefined && v>0);
  const lastYearAvgPrev3 = lastYearPrev3.length ? lastYearPrev3.reduce((a,b)=>a+b,0)/lastYearPrev3.length : null;

  let seasonalIndex = null, forecastVolume = null, hasSeasonality = false;
  if(avgNow != null){
    if(lastYearVol != null && lastYearAvgPrev3 != null && lastYearAvgPrev3 > 0){
      seasonalIndex = lastYearVol / lastYearAvgPrev3;
      forecastVolume = avgNow * seasonalIndex;
      hasSeasonality = true;
    } else {
      forecastVolume = avgNow;
    }
  }
  const curPrice = latestByDate(state.prices);
  const costPrice = curPrice ? Number(curPrice.cost_price||0) : 0;
  const forecastAmount = forecastVolume != null ? forecastVolume * costPrice : null;

  // Жорий қолдиқ — энди ФИФО орқали ҳисобланади (gazStockSummary):
  // ҳар бир партиянинг ЎЗ нархида қолган ҳажми йиғиндиси. Ҳажми
  // киритилмаган эски партиялар учун тахминий ҳажмдан фойдаланилади
  // (gazFifoCogs() изоҳига қаранг) — шунинг учун баъзи эски ойлар
  // учун бу рақам ҳамон тахминий бўлиб қолади.
  const stock = gazStockSummary();

  return { targetYm, avgNow, lastYearYm, lastYearVol, lastYearAvgPrev3, seasonalIndex, hasSeasonality,
    forecastVolume, costPrice, forecastAmount, estBalance: stock.remainingValue, stock };
}

// қанча даромад қилганимизни" бир қарашда кўриш учун (чартдан ташқари,
// аниқ рақамлар билан).
function monthlyRevenueRows(station){
  const src = station==='benzin' ? state.benzinEntries : state.entries;
  const months = [...new Set(src.map(e=>e.date && e.date.slice(0,7)).filter(Boolean))].sort().slice(-12).reverse();
  return months.map(m=>{
    if(station==='benzin'){
      const pl = computeBenzinMonthlyPL(m);
      return { month: m, revenue: pl.revenue, netProfit: pl.netProfit };
    }
    const pl = computeMonthlyPL(m);
    return { month: m, revenue: pl.revenue, netProfit: pl.netProfit };
  });
}

function baseChartOptions(opts={}){

async function saveEntryEdit(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  const updates = {};
  const logRows = [];
  const compName = cid => (state.companies.find(c=>c.id===cid)||{}).name || '—';
  ENTRY_EDIT_FIELDS.forEach(([key])=>{
    const el = document.getElementById('ee_'+key);
    if(!el) return;
    let newVal = key==='izoh' ? el.value.trim() : parseFloat(el.value);
    if(key==='izoh' && newVal==='') newVal = null;
    const oldVal = e[key];
    const changed = key==='izoh' ? (String(oldVal||'') !== String(newVal||'')) : (Number(oldVal||0) !== Number(newVal||0));
    if(changed){
      updates[key] = newVal;
      logRows.push({ station:'metan', entry_id:id, entry_date:e.date, field_name:key, old_value: oldVal==null?'':String(oldVal), new_value: newVal==null?'':String(newVal), edited_by_name: state.profile.full_name });
    }
  });

  // Компанияларга берилган газ — қўшилган/ўзгартирилган/ўчирилган қаторларни аниқлаш
  const existingDels = state.deliveries.filter(d=>d.entry_id===id);
  const seenIds = new Set();
  const rowEls = document.querySelectorAll('#eeDeliveryRows [data-del-id], #eeDeliveryNewRows [data-del-id]');
  for(const rowEl of rowEls){
    const delId = rowEl.getAttribute('data-del-id');
    const companyId = rowEl.querySelector('.ee-del-company').value;
    const m3Val = parseFloat(rowEl.querySelector('.ee-del-m3').value);
    if(delId === 'new'){
      if(companyId && m3Val > 0){
        const { error: insErr } = await sb.from('deliveries').insert({ entry_id:id, company_id:companyId, m3:m3Val });
        if(insErr){ toast("Хатолик: "+insErr.message); return; }
        logRows.push({ station:'metan', entry_id:id, entry_date:e.date, field_name:'Компанияга газ (янги)', old_value:'', new_value: compName(companyId)+' — '+fmt(m3Val)+' m3', edited_by_name: state.profile.full_name });
      }
    } else {
      seenIds.add(delId);
      const orig = existingDels.find(d=>d.id===delId);
      if(!orig) continue;
      if(String(orig.company_id)!==String(companyId) || Number(orig.m3||0)!==Number(m3Val||0)){
        const { error: updErr } = await sb.from('deliveries').update({ company_id: companyId, m3: m3Val }).eq('id', delId);
        if(updErr){ toast("Хатолик: "+updErr.message); return; }
        logRows.push({ station:'metan', entry_id:id, entry_date:e.date, field_name:'Компанияга газ',
          old_value: compName(orig.company_id)+' — '+fmt(orig.m3)+' m3', new_value: compName(companyId)+' — '+fmt(m3Val)+' m3', edited_by_name: state.profile.full_name });
      }
    }
  }
  for(const orig of existingDels){
    if(!seenIds.has(orig.id)){
      const { error: delErr } = await sb.from('deliveries').delete().eq('id', orig.id);
      if(delErr){ toast("Хатолик: "+delErr.message); return; }
      logRows.push({ station:'metan', entry_id:id, entry_date:e.date, field_name:'Компанияга газ (ўчирилди)',
        old_value: compName(orig.company_id)+' — '+fmt(orig.m3)+' m3', new_value:'', edited_by_name: state.profile.full_name });
    }
  }

  if(Object.keys(updates).length){
    const { error } = await sb.from('entries').update(updates).eq('id', id);
    if(error){ toast("Хатолик: "+error.message); return; }
  }
  if(!logRows.length){ toast("Ҳеч нарса ўзгармади"); document.getElementById('entryEditArea').innerHTML=''; return; }
  await sb.from('entry_edit_log').insert(logRows);
  toast("Тузатилди ✓");
  await loadAll();
  renderTab();
  document.getElementById('rep_date').value = e.date;
  renderReportDetail();
}

  const { error } = await sb.from('entries').delete().eq('id', id);
